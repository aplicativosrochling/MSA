<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#15171C">
<meta name="mobile-web-app-capable" content="yes">
<title>MSA Pro — Gestão de Análise de Sistemas de Medição</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>(function(){var m="auto";try{m=localStorage.getItem("msa-theme")||"auto"}catch(e){}var h=new Date().getHours();document.documentElement.setAttribute("data-theme",m==="auto"?(h>=6&&h<18?"light":"dark"):m)})()</script>
<style>
/*TEMA*/
:root{--bg:#EAEEF6;--bg2:#EEF2F9;--bg3:#F6F8FC;--bd2:#C3CCDD;--card:#fff;--brand:#1B66C9;--brand-d:#14509F;--brand-l:#3C84E0;--brand-t:#EAF1FB;--text:#1D2742;--muted:#5E6A88;--border:#DDE3F0;--ok:#107C10;--ok-bg:#DFF6DD;--warn:#8A6B00;--warn-bg:#FFF4CE;--bad:#A4262C;--bad-bg:#FDE7E9;--inc:#5E6A88;--inc-bg:#E6EAF3;--r:8px;--sh:0 1.6px 3.6px rgba(20,30,70,.13),0 .3px .9px rgba(20,30,70,.1);--pbi:#F2C811;--side:#252423;--toast:#1D2742;color-scheme:light}
:root[data-theme="dark"]{--bg:#0E1322;--bg2:#1E2742;--bg3:#1B2340;--bd2:#3A4570;--card:#171E35;--brand:#3C7DE6;--brand-d:#6EA3FF;--brand-l:#6EA3FF;--brand-t:#1F2C52;--text:#E7EBF8;--muted:#98A2C4;--border:#273052;--ok:#6CE08A;--ok-bg:#16391F;--warn:#F2C811;--warn-bg:#3A3210;--bad:#FF8A8F;--bad-bg:#44181B;--inc:#98A2C4;--inc-bg:#2A3150;--sh:0 1.6px 3.6px rgba(0,0,0,.45);--side:#1B1A19;--toast:#2A3566;color-scheme:dark}
body,.card,.side,.btn,.search{transition:background-color .4s,color .4s,border-color .4s}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Open Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
h1,h2,h3,h4{font-family:'Segoe UI','Open Sans',sans-serif;letter-spacing:-.01em;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:248px;flex-shrink:0;background:var(--side);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px}
.logo{display:flex;align-items:center;gap:12px;padding:4px 8px 20px;border-bottom:1px solid rgba(255,255,255,.09);margin-bottom:12px}
.logo .ic{width:42px;height:42px;border-radius:8px;background:var(--pbi);color:var(--side);display:grid;place-items:center;font-size:18px}
.logo b{font-family:'Segoe UI','Open Sans',sans-serif;font-size:18px;font-weight:700;display:block}.logo small{color:#A19F9D;font-size:11px}
.nav-s{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#8A8886;padding:14px 10px 6px;font-weight:600}
.nav{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:6px;cursor:pointer;color:#D2D0CE;font-weight:600;font-size:13.5px;transition:.15s;border:0;background:none;width:100%;text-align:left;position:relative}
.nav i{width:18px;text-align:center}.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav.on{background:#3B3A39;color:#fff}
.nav.on:before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--pbi)}
.nav .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.14);padding:1px 8px;border-radius:4px;font-variant-numeric:tabular-nums}.nav.on .cnt{background:var(--pbi);color:var(--side)}
.side-foot{margin-top:auto;font-size:11.5px;color:#A19F9D;padding:10px;border-top:1px solid rgba(255,255,255,.09)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#aaa}.dot.on{background:#6CE08A;box-shadow:0 0 0 3px rgba(108,224,138,.25)}
/* main */
.main{flex:1;min-width:0;padding:22px 28px 40px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:26px}.top .sub{color:var(--muted);font-size:13px}
.top .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd2);border-radius:4px;padding:8px 12px;min-width:240px;transition:.15s}
.search input{border:0;outline:0;flex:1;background:none}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--bd2);background:var(--card);padding:9px 14px;border-radius:4px;cursor:pointer;font-weight:600;font-size:13px;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--bg2);border-color:#8A8886;color:var(--text)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
.btn.dan{color:var(--bad)}.btn.dan:hover{border-color:var(--bad);background:var(--bad-bg)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:4px}
.btn.ic{padding:7px 9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .hint{margin-left:auto;font:500 11px 'Segoe UI';color:var(--muted)}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{cursor:pointer;position:relative;overflow:hidden;transition:.18s}
.kpi:hover{transform:translateY(-2px);border-color:var(--brand);box-shadow:0 6.4px 14.4px rgba(0,0,0,.14),0 1.2px 3.6px rgba(0,0,0,.1)}
.kpi .lb{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.3px}
.kpi .lb i{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-size:13px}
.kpi .v{font:700 30px 'Segoe UI','Open Sans',sans-serif;margin-top:10px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .bar{height:4px;border-radius:4px;background:var(--inc-bg);margin-top:10px;overflow:hidden}.kpi .bar span{display:block;height:100%;border-radius:4px;transition:width .6s}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}.c-brand{color:var(--brand)}
.bg-ok{background:var(--ok-bg)}.bg-warn{background:var(--warn-bg)}.bg-bad{background:var(--bad-bg)}.bg-brand{background:var(--brand-t)}.bg-inc{background:var(--inc-bg)}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.g3{grid-template-columns:2fr 1fr}
.chart{position:relative;height:260px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:4px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-Aprovado{background:var(--ok-bg);color:var(--ok)}.b-Condicional{background:var(--warn-bg);color:var(--warn)}.b-Reprovado{background:var(--bad-bg);color:var(--bad)}.b-Incompleto{background:var(--inc-bg);color:var(--inc)}
.tag{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--brand-t);color:var(--brand-d);font-weight:600}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:10px;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;cursor:pointer;user-select:none}
table.t td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
table.t tr.cl:hover td{background:var(--brand-t);cursor:pointer}
.tw{overflow:auto;border:1px solid var(--border);border-radius:8px;background:var(--card)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.chip{padding:6px 12px;border-radius:4px;border:1px solid var(--bd2);background:var(--card);cursor:pointer;font-size:12.5px;font-weight:600}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
select.f,input.f,textarea.f{border:1px solid var(--bd2);border-radius:4px;padding:8px 10px;background:var(--card);outline:0;width:100%}
select.f:focus,input.f:focus,textarea.f:focus{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
label.l{font-size:11.5px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}.empty i{font-size:34px;opacity:.35;display:block;margin-bottom:10px}
/* data grid */
.dg{border-collapse:collapse;font-size:12.5px}
.dg th,.dg td{border:1px solid var(--border);padding:0;text-align:center;min-width:62px}
.dg th{background:var(--bg2);padding:6px;font-weight:600;font-size:11.5px;color:var(--muted)}
.dg td.h{background:var(--bg3);font-weight:700;padding:6px}
.dg td.c{background:var(--bg3);padding:6px;font-weight:600;color:var(--brand-d)}
.dg input{width:100%;border:0;padding:7px 4px;text-align:center;background:transparent;outline:0}
.dg input:focus{background:var(--brand-t)}
.dg td.out{background:var(--bad-bg)!important;color:var(--bad)}
.dg td.tg{cursor:pointer;font-weight:700;padding:6px;user-select:none}
.dg td.tg.v1{background:var(--ok-bg);color:var(--ok)}.dg td.tg.v0{background:var(--bad-bg);color:var(--bad)}.dg td.tg.vn{color:#bbb}
.dg th input{width:100%;min-width:72px;border:1px dashed var(--border);background:var(--card);border-radius:6px;padding:3px 4px;font-weight:700;color:var(--brand-d);text-align:center;outline:0}
.dg th input:focus{border-color:var(--brand);background:var(--brand-t);border-style:solid}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.m{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.m .k{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.m .x{font:700 19px 'Segoe UI';margin-top:4px}
.verdict{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:8px;margin-bottom:14px}
.verdict i{font-size:26px}.verdict b{font:700 18px 'Segoe UI';display:block}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--brand);border-color:var(--brand)}
.list-i{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px dashed var(--border);cursor:pointer}
.list-i:last-child{border:0}.list-i:hover{background:var(--bg3)}
.list-i .ico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.list-i .tx{flex:1;min-width:0}.list-i .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list-i .tx small{color:var(--muted)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;backdrop-filter:blur(2px)}
.ov.show{display:flex}
.modal{background:var(--card);border-radius:8px;width:100%;max-width:620px;max-height:90vh;overflow:auto;box-shadow:0 25.6px 57.6px rgba(0,0,0,.22),0 4.8px 14.4px rgba(0,0,0,.18)}
.modal .mh{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}.modal .mh h3{flex:1;font-size:17px}
.modal .mb{padding:20px}.modal .mf{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.type{border:1px solid var(--border);border-radius:8px;padding:14px;cursor:pointer;transition:.15s}
.type:hover{border-color:var(--brand);background:var(--brand-t)}
.type i{font-size:20px;color:var(--brand);margin-bottom:8px}.type b{display:block}.type small{color:var(--muted);font-size:12px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--toast);color:#fff;padding:12px 18px;border-radius:8px;font-weight:600;z-index:60;transform:translateY(120px);transition:.3s;display:flex;gap:10px;align-items:center}
.toast.show{transform:none}
.dd{position:relative}.dd-m{position:absolute;right:0;top:110%;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--sh);min-width:220px;padding:6px;display:none;z-index:20}
.dd.open .dd-m{display:block}.dd-m div{padding:9px 12px;border-radius:6px;cursor:pointer;display:flex;gap:10px;align-items:center}.dd-m div:hover{background:var(--brand-t)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.legend{font-size:12px;color:var(--muted);margin-top:8px}
.live{font-size:11px;color:var(--ok);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.live:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.25}}
.fade{animation:fd .25s ease}@keyframes fd{from{opacity:0;transform:translateY(4px)}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#8A8886;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
@media(max-width:900px){.side{display:none}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.main{padding:16px}}
/* procedimento */
.proc{font-size:13.5px;line-height:1.6;max-width:900px;margin:0 auto}
.proc h3.s1{font:700 15px 'Segoe UI';color:var(--brand-d);margin:22px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--brand)}
.proc h4.s2{font:700 13.5px 'Segoe UI';margin:14px 0 4px}
.proc p{margin:6px 0}.proc ol,.proc ul{margin:6px 0 6px 22px}
.proc table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12.5px}
.proc td,.proc th{border:1px solid var(--border);padding:6px 9px;vertical-align:top;text-align:left}
.proc table.pt td{background:var(--bg3)}.proc table.pt td:last-child{text-align:center;vertical-align:middle}
.proc th{background:var(--bg2)}.proc .plogo{max-width:150px;height:auto}
.proc blockquote{margin:6px 0 6px 18px}
.pg-eq td{vertical-align:middle}.pg-eq .tag{margin-right:4px}
.stp{display:inline-flex;align-items:center;gap:6px;margin:2px 4px 2px 0;cursor:pointer;font-size:12px;font-weight:600}
.stp:hover{text-decoration:underline}
.thm{margin:auto 0 8px;padding:8px 10px;border-top:1px solid rgba(255,255,255,.12);color:#dbe6fb;font-size:11.5px}
.thm .tl{margin-bottom:6px;font-weight:600}.thm .tl small{display:block;font-weight:400;opacity:.75}
.thm .sg{display:flex;background:rgba(255,255,255,.14);border-radius:7px;padding:2px}
.thm .sg button{flex:1;border:0;background:none;color:#dbe6fb;font-size:11.5px;padding:5px 4px;border-radius:5px;cursor:pointer}
.thm .sg button.on{background:#fff;color:var(--side);font-weight:700}
.thm+.side-foot{margin-top:0}


/* ======== REDESIGN v19: moderno, limpo, foco nos dados ======== */
:root{--bg:#F3F5F9;--bg2:#F0F3F8;--bg3:#F7F9FC;--bd2:#D5DBE8;--border:#E4E8F0;--brand:#2456E8;--brand-d:#1A3FB8;--brand-l:#4F7BFF;--brand-t:#E9EFFE;--text:#141A2A;--muted:#667089;--r:16px;--sh:0 1px 2px rgba(20,26,42,.05),0 6px 20px rgba(20,26,42,.05);--side:#15171C}
:root[data-theme="dark"]{--bg:#0C0F18;--bg2:#1B2236;--bg3:#161C2E;--bd2:#33405F;--card:#131929;--border:#222B44;--brand:#4F7BFF;--brand-d:#8AAAFF;--brand-l:#8AAAFF;--brand-t:#1C2A52;--text:#E9EDF9;--muted:#93A0C2;--sh:0 1px 2px rgba(0,0,0,.4);--side:#0A0C11}
body{font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;font-size:14px;letter-spacing:-.005em}
h1,h2,h3,h4,.logo b,.kpi .v{font-family:'Plus Jakarta Sans','Segoe UI',sans-serif}
.main{padding:28px 36px 48px;max-width:1480px}
.top h1{font-size:28px;font-weight:800;letter-spacing:-.03em}
/* sidebar */
.side{width:256px;padding:22px 14px}
.logo{border-bottom:0;padding:2px 8px 22px}
.logo .ic{width:44px;height:44px;border-radius:14px}
.nav-s{font-size:11.5px;letter-spacing:0;text-transform:none;color:#7C8196;padding:18px 12px 6px;font-weight:600}
.nav{border-radius:12px;padding:10px 12px;font-weight:600;color:#C9CCD8;margin-bottom:2px}
.nav i{color:#8B90A6;transition:.15s}
.nav:hover{background:rgba(255,255,255,.06)}
.nav.on{background:rgba(245,184,0,.13);color:#fff}.nav.on i{color:var(--pbi)}
.nav.on:before{left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0}
.nav .cnt{background:rgba(255,255,255,.1);border-radius:20px;padding:1px 9px}
/* cartões */
.card{border-radius:var(--r);padding:22px;border-color:var(--border)}
.card h3{font-size:15px;font-weight:700}
.kpi{border-radius:var(--r)}
.kpi:hover{transform:none;border-color:var(--brand);box-shadow:var(--sh),0 0 0 3px var(--brand-t)}
.kpi .lb{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600}
.kpi .lb i{width:32px;height:32px;border-radius:10px}
.kpi .v{font-size:32px;font-weight:800;letter-spacing:-.03em}
.kpi .bar{height:6px;border-radius:6px}
/* botões, campos, filtros */
.btn{border-radius:12px;padding:10px 16px;border-color:var(--border);background:var(--card);font-weight:600;box-shadow:0 1px 1px rgba(20,26,42,.04)}
.btn:hover{background:var(--bg3);border-color:var(--bd2)}
.btn.pri{background:var(--brand);border-color:var(--brand);box-shadow:0 4px 14px rgba(36,86,232,.28)}
.btn.pri:hover{background:var(--brand-d);border-color:var(--brand-d)}
.btn.sm{border-radius:10px}
.search{border-radius:12px;border-color:var(--border);background:var(--card);padding:10px 14px}
select.f,input.f,textarea.f,.top select{border-radius:12px;border-color:var(--border);background:var(--card);padding:10px 12px}
select.f:focus,input.f:focus,textarea.f:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-t)}
.chip{border-radius:999px;padding:7px 14px;font-weight:600;border-color:var(--border);background:var(--card)}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tag{border-radius:999px;padding:3px 10px;font-weight:600}
button:focus-visible,.nav:focus-visible,.chip:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
/* tabelas */
.tw{border-radius:var(--r);border-color:var(--border)}
table.t th{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--bg3);padding:13px 12px}
table.t td{padding:13px 12px;border-bottom:1px solid var(--border)}
table.t tr.cl:hover td{background:var(--brand-t)}
.dg th{background:var(--bg3)}
.modal{border-radius:20px}
.list-i{border-radius:10px;padding:12px 8px}
.list-i .ico{border-radius:11px}
.toast{border-radius:14px}
.thm .sg{border-radius:12px}.thm .sg button{border-radius:9px}
::-webkit-scrollbar{width:11px;height:11px}
@media(max-width:900px){.main{padding:18px 16px 36px}.top h1{font-size:23px}}

.usr{margin-top:auto;padding:10px 12px;font-size:12.5px;color:#C9CCD8;cursor:pointer;border-radius:10px}.usr:hover{background:rgba(255,255,255,.06)}.usr+.thm{margin-top:0}
.dg td.h,.dg th:first-child{position:sticky;left:0;z-index:2;background:var(--bg3)}

<script>
if(typeof Chart==='undefined'){window.Chart=function(){this.destroy=function(){};this.update=function(){}};Chart.defaults=(function m(){return new Proxy({},{get:function(t,k){return k in t?t[k]:(t[k]=m())},set:function(t,k,v){t[k]=v;return true}})})();Chart.register=function(){};window.__noChart=true;setTimeout(function(){toast('Gráficos indisponíveis: a biblioteca Chart.js não carregou (verifique a internet)','fa-triangle-exclamation')},2000)}
/* ============================================================
   MSA PRO — sistema completo em arquivo único
   Persistência: localStorage (sempre) + Firebase Firestore (opcional, tempo real)
   ============================================================ */
const TYPES={
  est:{n:'Estabilidade',ic:'fa-wave-square',d:'Carta X̄-R ao longo do tempo com peça padrão'},
  bias:{n:'Tendência (Bias)',ic:'fa-bullseye',d:'Leituras repetidas contra valor de referência'},
  lin:{n:'Linearidade',ic:'fa-chart-line',d:'Tendência ao longo da faixa de operação'},
  rr:{n:'R&R Variável',ic:'fa-users',d:'Médias e amplitudes (AIAG) — operadores × peças × ciclos'},
  atr:{n:'R&R Atributo',ic:'fa-check-double',d:'Kappa, eficácia, perda e falso alarme'}
};
const STATUS=['Aprovado','Condicional','Reprovado','Incompleto'];
const SCOL={Aprovado:'#107C10',Condicional:'#D9B300',Reprovado:'#D13438',Incompleto:'#8A8886'};
const KEY='msa_pro_v1';
const FB={apiKey:"AIzaSyAcmnS6S47tznpns-ZEarMXqXAFsD_Ylqk",authDomain:"msa-novo.firebaseapp.com",projectId:"msa-novo",storageBucket:"msa-novo.firebasestorage.app",messagingSenderId:"154466050071",appId:"1:154466050071:web:7e17a9fe24e448bfb9fc52"};

/* ---------------- utilidades ---------------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(v===''||v==null)return NaN;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:NaN};
const ok=v=>typeof v==='number'&&isFinite(v);
const decimalPlaces=(s=null)=>{const raw=s&&s.decimais!==undefined&&s.decimais!==null&&s.decimais!==''?Number(s.decimais):Number(S.cfg.decimais);return Number.isFinite(raw)?Math.max(0,Math.min(8,Math.round(raw))):4};
const fxd=(v,d)=>ok(v)?(+v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const fsig=(v,dp)=>{if(!ok(v))return'—';const a=Math.abs(v);let d=dp;if(a>0&&a<1)d=Math.max(dp,Math.min(8,3-Math.floor(Math.log10(a))));return fxd(v,d)};
const fmt=(v,d=decimalPlaces())=>ok(v)?(+v.toFixed(d)).toLocaleString('pt-BR',{maximumFractionDigits:d}):'—';
const pct=(v,d=decimalPlaces())=>ok(v)?v.toFixed(d).replace('.',',')+'%':'—';
const mean=a=>{a=a.filter(ok);return a.length?a.reduce((s,x)=>s+x,0)/a.length:NaN};
const sd=a=>{a=a.filter(ok);if(a.length<2)return NaN;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))};
const rng=a=>{a=a.filter(ok);return a.length?Math.max(...a)-Math.min(...a):NaN};
const today=()=>new Date().toISOString().slice(0,10);
const fdate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'—';
const daysTo=d=>d?Math.round((new Date(d+'T12:00:00')-new Date(today()+'T12:00:00'))/864e5):null;
function logGamma(z){const p=[676.5203681218851,-1259.1392167224028,771.3234287776531,-176.6150291621406,12.507343278686905,-.13857109526572012,9.984369578019572e-6,1.5056327351493116e-7];if(z<.5)return Math.log(Math.PI)-Math.log(Math.sin(Math.PI*z))-logGamma(1-z);z-=1;let x=.9999999999998099;for(let i=0;i<p.length;i++)x+=p[i]/(z+i+1);const t=z+7.5;return .9189385332046727+(z+.5)*Math.log(t)-t+Math.log(x)}
function betaCF(a,b,x){const qab=a+b,qap=a+1,qam=a-1,fp=1e-300,eps=3e-14;let c=1,d=1-qab*x/qap;if(Math.abs(d)<fp)d=fp;d=1/d;let h=d;for(let m=1;m<=200;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<fp)d=fp;c=1+aa/c;if(Math.abs(c)<fp)c=fp;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<fp)d=fp;c=1+aa/c;if(Math.abs(c)<fp)c=fp;d=1/d;const delta=d*c;h*=delta;if(Math.abs(delta-1)<eps)break}return h}
function regBeta(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(logGamma(a+b)-logGamma(a)-logGamma(b)+a*Math.log(x)+b*Math.log1p(-x));return x<(a+1)/(a+b+2)?bt*betaCF(a,b,x)/a:1-bt*betaCF(b,a,1-x)/b}
function tcrit(df,alpha=.05){if(!(df>0)||!(alpha>0&&alpha<1))return NaN;let lo=0,hi=1;while(regBeta(df/(df+hi*hi),df/2,.5)>alpha&&hi<1e8)hi*=2;for(let i=0;i<80;i++){const mid=(lo+hi)/2,p=regBeta(df/(df+mid*mid),df/2,.5);if(p>alpha)lo=mid;else hi=mid}return(lo+hi)/2}
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const r4=v=>Math.round(v*10000)/10000;
function toast(msg,icon='fa-circle-check'){const t=$('#toast');t.innerHTML=`<i class="fas ${icon}"></i>${esc(msg)}`;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
function mtx(r,c,f=''){return Array.from({length:r},()=>Array.from({length:c},()=>f))}
function resize(m,r,c,f=''){m=m||[];return Array.from({length:r},(_,i)=>Array.from({length:c},(_,j)=>(m[i]&&m[i][j]!==undefined)?m[i][j]:f))}

/* ---------------- dados / persistência ---------------- */
let S={studies:[],instruments:[],cfg:{empresa:'Minha Empresa',grrOk:10,grrCond:30,ndcMin:5,base:'tv',k:6,biasMax:10,effOk:90,effCond:80,missOk:2,faOk:5,kappaOk:0.75,decimais:4,cloud:true,diasAviso:30}};
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){S.studies=d.studies||[];S.instruments=d.instruments||[];Object.assign(S.cfg,d.cfg||{})}}catch(e){}}
/* Dados vivem SOMENTE no Firebase. O localStorage é lido uma única vez (migração) e depois apagado. */
function cloudCfg(){return db?db.collection('msapro_config').doc('cfg').set({id:'cfg',json:JSON.stringify(S.cfg)}).then(()=>true).catch(()=>false):Promise.resolve(false)}
function persist(){clearTimeout(persist.t);persist.t=setTimeout(cloudCfg,500)}
let db=null;
let pendW=0,failW=new Set(),lastWarn=0;
const warnSave=m=>{if(Date.now()-lastWarn>5000){lastWarn=Date.now();toast(m,'fa-triangle-exclamation')}};
window.addEventListener('beforeunload',e=>{if(pendW>0||failW.size){e.preventDefault();e.returnValue=''}});
function cloudSet(col,doc){
  if(!db){warnSave('Sem conexão com o Firebase — esta alteração NÃO foi salva');return Promise.resolve(false)}
  const j=JSON.stringify(doc);
  if(j.length>950000){failW.add(doc.id);setSync(false,'estudo grande demais (limite de 1 MB por documento)');warnSave('Estudo grande demais para salvar no Firebase (limite 1 MB)');return Promise.resolve(false)}
  pendW++;
  return db.collection(col).doc(doc.id).set({id:doc.id,codigo:doc.codigo||'',tipo:doc.tipo||'',atualizadoEm:doc.atualizadoEm||'',json:j})
    .then(()=>{pendW--;failW.delete(doc.id);setSync(true);return true})
    .catch(e=>{pendW--;failW.add(doc.id);const c=e&&e.code||'erro';setSync(false,c);warnSave('NÃO foi possível salvar na nuvem ('+c+'). Não feche a página.');return false})}
function cloudDel(col,id){if(db)db.collection(col).doc(id).delete().catch(()=>{})}
let cloudOk=false,unsub=null,syncTimer=null;
function setSync(on,err){cloudOk=!!on;$('#syncDot').className='dot'+(on?' on':'');$('#syncTxt').textContent=on?'Firebase conectado · tempo real':(err?`Sem conexão Firebase (${err}) · clique para reconectar`:'Sem Firebase — alterações NÃO ficam salvas')}
let authTried=false,progDone=false;
function ensureProg(){if(progDone)return;progDone=true;migrateProg()} /* não cria mais estudos sozinho ao abrir; use Procedimento > Criar estudos */
function retryCloud(){authTried=false;progDone=false;S.cfg.cloud=true;persist();setSync(false,'conectando…');try{if(db)db.enableNetwork()}catch(e){}initCloud();S.studies.forEach(x=>cloudSet('msapro_estudos',x))}
function initCloud(){
  if(!S.cfg.cloud){setSync(false);ensureProg();return}
  if(typeof firebase==='undefined'){setSync(false,'biblioteca Firebase bloqueada');ensureProg();return}
  try{
    if(!firebase.apps.length)firebase.initializeApp(FB);
    if(!db){db=firebase.firestore();try{db.settings({experimentalAutoDetectLongPolling:true,merge:true})}catch(e){}}
    startSubs();
  }catch(e){db=null;setSync(false,e.code||'erro');ensureProg()}
}
function startSubs(){
  const col='msapro_estudos';let first=true;
  if(unsub){try{unsub()}catch(e){}}
  clearTimeout(syncTimer);syncTimer=setTimeout(()=>{if(!cloudOk)setSync(false,'servidor não respondeu — verifique internet/firewall (firestore.googleapis.com)')},12000);
  unsub=db.collection(col).onSnapshot({includeMetadataChanges:true},snap=>{
    if(first&&snap.metadata.fromCache)return;
    const remote=snap.docs.map(d=>{const x=d.data();try{return x.json?JSON.parse(x.json):x}catch(e){return x}});const ids=new Set(remote.map(r=>r.id));
    if(first){first=false;
      const lo=S.studies.filter(x=>!ids.has(x.id));
      if(!ids.size)mig(Promise.all(lo.map(x=>cloudSet(col,x))));else{if(lo.length)rescue('studies',lo);mig(Promise.resolve(true));S.studies=remote}
      S.studies.forEach(x=>{if(!x.resultado||x.tipo==='atr')x.resultado=calc(x)});
      ensureProg();
    }else S.studies=remote;
    if(!snap.metadata.fromCache){clearTimeout(syncTimer);setSync(true)}refresh();
  },err=>{
    if(err&&err.code==='permission-denied'&&!authTried&&firebase.auth){authTried=true;
      firebase.auth().signInAnonymously().then(startSubs).catch(()=>{setSync(false,'permission-denied — ajuste as regras do Firestore');ensureProg()});return}
    setSync(false,err&&err.code||'erro');ensureProg();refresh()});
  subsExtra();
}
let un2=[],mg={n:3,ok:true},resc={};
const mig=p=>p.then(r=>{if(![].concat(r).every(Boolean))mg.ok=false;if(--mg.n===0&&mg.ok){try{localStorage.removeItem(KEY)}catch(e){}}});
function rescue(k,items){resc[k]=items;clearTimeout(rescue.t);rescue.t=setTimeout(()=>{try{const b=new Blob([JSON.stringify(resc,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='msa_copia_local_antes_de_migrar.json';a.click()}catch(e){}toast('Havia dados só neste navegador — baixei uma cópia de segurança','fa-triangle-exclamation')},1200)}
function subsExtra(){
  un2.forEach(u=>{try{u()}catch(e){}});un2=[];mg={n:3,ok:true};
  const pj=d=>{const x=d.data();try{return x.json?JSON.parse(x.json):x}catch(e){return x}};
  let f2=true,f3=true;
  un2.push(db.collection('msapro_instrumentos').onSnapshot({includeMetadataChanges:true},snap=>{
    if(f2&&snap.metadata.fromCache)return;
    const rem=snap.docs.map(pj),ids=new Set(rem.map(r=>r.id));
    if(f2){f2=false;const lo=S.instruments.filter(x=>!ids.has(x.id));
      if(!ids.size)mig(Promise.all(lo.map(x=>cloudSet('msapro_instrumentos',x))));else{if(lo.length)rescue('instruments',lo);mig(Promise.resolve(true));S.instruments=rem}
    }else S.instruments=rem;
    refresh()},()=>{mig(Promise.resolve(false))}));
  un2.push(db.collection('msapro_config').doc('cfg').onSnapshot({includeMetadataChanges:true},d=>{
    if(f3&&d.metadata.fromCache)return;
    if(d.exists){try{Object.assign(S.cfg,JSON.parse(d.data().json),{cloud:true})}catch(e){}if(f3)mig(Promise.resolve(true));refresh()}
    else if(f3)mig(cloudCfg());
    f3=false},()=>{mig(Promise.resolve(false))}));
}
function saveStudy(s){s.atualizadoEm=new Date().toISOString();s.resultado=calc(s);const i=S.studies.findIndex(x=>x.id===s.id);traceLog(s,i>=0?S.studies[i]:null);if(i>=0)S.studies[i]=s;else S.studies.push(s);persist();cloudSet('msapro_estudos',s)}
function delStudy(id){S.studies=S.studies.filter(x=>x.id!==id);persist();cloudDel('msapro_estudos',id)}
function saveInstr(x){x.atualizadoEm=new Date().toISOString();const i=S.instruments.findIndex(y=>y.id===x.id);if(i>=0)S.instruments[i]=x;else S.instruments.push(x);persist();cloudSet('msapro_instrumentos',x)}
function delInstr(id){S.instruments=S.instruments.filter(x=>x.id!==id);persist();cloudDel('msapro_instrumentos',id)}
const instrOf=s=>S.instruments.find(i=>i.id===s.instrumentoId);
const instrName=s=>{const i=instrOf(s);return i?`${i.codigo} — ${i.descricao}`:(s.instrumentoTxt||'—')};

/* ---------------- modelos de estudo ---------------- */
function nextCode(t){const pre={est:'EST',bias:'TEN',lin:'LIN',rr:'GRR',atr:'ATR'}[t];const n=S.studies.filter(s=>s.tipo===t).length+1;return `${pre}-${new Date().getFullYear()}-${String(n).padStart(3,'0')}`}
function newStudy(t){
  const base={id:uid(),tipo:t,codigo:nextCode(t),nome:'',instrumentoId:'',instrumentoTxt:'',peca:'',caracteristica:'',unidade:'mm',lie:'',lse:'',responsavel:'',area:'',data:today(),obs:'',decimais:decimalPlaces(),criadoEm:new Date().toISOString()};
  const D={est:{n:5,g:20,ref:'',m:mtx(20,5),dts:Array(20).fill(''),hrs:Array(20).fill('')},bias:{ref:'',n:15,v:Array(15).fill('')},lin:{g:5,m:10,refs:Array(5).fill(''),v:mtx(5,10)},
    rr:{ops:3,parts:10,trials:3,opNames:['A','B','C'],v:[mtx(3,10),mtx(3,10),mtx(3,10)]},
    atr:{ops:3,parts:50,trials:3,opNames:['Avaliador 1','Avaliador 2','Avaliador 3'],ref:Array(50).fill(''),v:[mtx(3,50),mtx(3,50),mtx(3,50)]}};

e IATF 16949:2016, assegurando que as medições, calibrações, ensaios e estudos realizados atendam aos requisitos dos clientes e tenham rastreabilidade a padrões nacionais e/ou internacionais. Isso garante a confiabilidade dos resultados obtidos na validação da conformidade do produto acabado para os diferentes números de peça.<\/p>\n<h3 class=\"s1\">Escopo:<\/h3>\n<p>Este procedimento aplica-se à área de Metrologia da Röchling Automotive AM-N.<\/p>\n<h3 class=\"s1\">Responsabilidades:<\/h3>\n<p>Metrologia da Qualidade<\/p>\n<p>Técnicos da Qualidade<\/p>\n<p>Engenheiros da Qualidade<\/p>\n<p>Gestão da Qualidade<\/p>\n<h3 class=\"s1\">Abreviações e terminologia: <\/h3>\n<p><strong>MSA – Análise do Sistema de Medição<\/strong><\/p>\n\n<h3 class=\"s1\">1 - ANÁLISE E SELEÇÃO DE EQUIPAMENTOS DE MEDIÇÃO E ENSAIO<\/h3>\n<h4 class=\"s2\">1.1 Responsável pela seleção dos equipamentos<\/h4>\n<p>A área de Metrologia é responsável pela seleção dos equipamentos de medição e ensaio, bem como pelas atividades descritas nos itens 1 a 4. Essa seleção é validada pelo Gerente da Qualidade, responsável pela área.<\/p>\n<h4 class=\"s2\">1.2 Requisitos técnicos<\/h4>\n<p>Os requisitos técnicos (especificações) são definidos com base em:<\/p>\n<p>• Quantidade de peças a serem medidas, faixa de aplicação e classe de precisão ou exatidão do equipamento de medição necessário.<br />\n• Limitações de instalação e uso do equipamento: condições ambientais, metodologia do cliente, manuseio, manutenção etc.<br />\n• Possibilidade de evolução dos equipamentos de medição para minimizar o risco de obsolescência.<br />\n• Requisitos específicos relacionados à calibração ou verificação.<br />\n• Condições de aceitação.<\/p>\n<h4 class=\"s2\">1.3 Condições comerciais<\/h4>\n<p>São considerados os seguintes fatores:<\/p>\n<p>• Prazo de entrega.<br />\n• Contrato de manutenção, verificação e/ou suporte técnico (relevância técnica e custo).<br />\n• Condições de suporte técnico do fornecedor.<\/p>\n<h4 class=\"s2\">1.4 Seleção de equipamentos de medição ou ensaio<\/h4>\n<p>A escolha do equipamento também deve considerar as lições aprendidas e os requisitos específicos do cliente.<\/p>\n<h3 class=\"s1\">2 - RECEBIMENTO E ACEITAÇÃO DOS EQUIPAMENTOS<\/h3>\n<p>Ao receber um novo equipamento de medição, após verificar se a entrega está em boas condições, a equipe de Metrologia realiza as seguintes operações:<\/p>\n<h4 class=\"s2\">2.1 Identificação do equipamento<\/h4>\n<p>Todos os equipamentos são registrados com um ID de referência, incluído no banco de dados de gerenciamento de equipamentos.<\/p>\n<h4 class=\"s2\">2.2 Arquivo mestre do equipamento<\/h4>\n<p>O arquivo mestre inclui todos os equipamentos de medição e ensaio. A documentação ou os certificados correspondentes a cada equipamento são arquivados individualmente.<\/p>\n<h4 class=\"s2\">2.3 Calibração / ensaio antes da utilização<\/h4>\n<p>Antes de o equipamento de medição ser colocado em serviço, é obrigatório verificar se ele está calibrado:<\/p>\n<ol type=\"a\">\n<li><p>pelo fornecedor ou por uma organização externa acreditada conforme a ISO/IEC 17025 ou equivalente nacional.<\/p><\/li>\n<li><p>internamente, de acordo com as instruções de calibração/verificação e as operações descritas no processo de calibração. O equipamento de referência (padrão) deve ser calibrado/verificado por uma organização acreditada conforme a ISO/IEC 17025 ou equivalente nacional.<\/p><\/li>\n<\/ol>\n<h4 class=\"s2\">2.4 Análise do Sistema de Medição (MSA)<\/h4>\n<p>É necessário realizar estudos estatísticos para analisar as variações nos resultados dos equipamentos de medição e ensaio. Esse requisito aplica-se aos equipamentos utilizados nas atividades de liberação incluídas nos planos de controle do produto.<\/p>\n<p>Para isso, é utilizado o software estatístico interno da Röchling para realizar a respectiva Análise do Sistema de Medição.<\/p>\n<p>Os critérios de aceitação dos estudos estatísticos são os seguintes:<\/p>\n<p>Estudo R&amp;R por variável.<\/p>\n<table class=\"pt2\">\n\n<thead>\n<tr class=\"header\">\n<th>% GRR &lt;10%<\/th>\n<th>Aceitável<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>% GRR 10% - 20%<\/td>\n<td>Aceitável sob avaliação<\/td>\n<\/tr>\n<tr>\n<td>% GRR &gt;20%<\/td>\n<td>Não aceitável<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Estudo R&amp;R por atributo.<\/p>\n<table class=\"pt2\">\n\n<thead>\n<tr class=\"header\">\n<th>% GRR &gt;90%<\/th>\n<th>Aceitável<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>% GRR 70% - 90%<\/td>\n<td>Aceitável sob avaliação<\/td>\n<\/tr>\n<tr>\n<td>% GRR &lt;70%<\/td>\n<td>Não aceitável<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Estudo de tendência (Bias) e linearidade: o resultado deve ser &lt;10%.<\/p>\n<p>Em caso de qualquer alteração no equipamento/dispositivo, incluindo mudança do pessoal responsável pela liberação de produtos, deve ser realizado o estudo estatístico correspondente para garantir o atendimento aos requisitos estabelecidos.<\/p>\n<p>O Programa de Calibração deve especificar o tipo de estudo de MSA aplicável a cada equipamento envolvido no processo de liberação de produtos. A tabela a seguir apresenta os tipos de estudos de MSA aplicáveis ​​aos equipamentos gerenciados na Röchling AM-N, bem como sua periodicidade<\/p>\n<table class=\"pt2\">\n\n<thead>\n<tr class=\"header\">\n<th><strong>Equipamento de medição<\/strong><\/th>\n<th><strong>Padrão de referência<\/strong><\/th>\n<th><strong>Tipo de estudo<\/strong><\/th>\n<th><strong>Frequência (meses)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Micrômetro interno<\/td>\n<td>Bloco-padrão<\/td>\n<td>R&amp;R<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Chave de torque digital<\/td>\n<td>Analisador de torque<\/td>\n<td>Estudo de tendência (Bias) e linearidade<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Balanças<\/td>\n<td>Peso-padrão<\/td>\n<td>Estudo de tendência (Bias) e linearidade<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Durômetro<\/td>\n<td>Placa-padrão<\/td>\n<td>Estudo de tendência (Bias) e linearidade<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Paquímetros<\/td>\n<td>Bloco-padrão<\/td>\n<td>Estudo de tendência (Bias) e linearidade<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Relógios comparadores digitais<\/td>\n<td>Bloco-padrão<\/td>\n<td>Estudo de tendência (Bias) e linearidade<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Dispositivo de controle passa/não passa<\/td>\n<td>Peças de produção verificadas por CMM<\/td>\n<td>R&amp;R<\/td>\n<td>No recebimento<\/td>\n<\/tr>\n<tr>\n<td>Dispositivo de controle com SPC<\/td>\n<td>Indicador digital<\/td>\n<td>R&amp;R<\/td>\n<td>No recebimento<\/td>\n<\/tr>\n<tr>\n<td>CMM<\/td>\n<td>Dispositivo de calibração certificado (Tetra, Ball Bar)<\/td>\n<td>R &amp; R<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Máquina universal de ensaios<\/td>\n<td>Leituras realizadas com padrão do fornecedor<\/td>\n<td>Estudo de tendência (Bias) e linearidade<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Plastômetro<\/td>\n<td>Leituras realizadas com padrão do fornecedor<\/td>\n<td>Estudo de tendência (Bias) e linearidade<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Medidor de altura<\/td>\n<td>Bloco-padrão<\/td>\n<td>Estudo de tendência (Bias) e linearidade<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Medidor de espessura<\/td>\n<td>Bloco-padrão<\/td>\n<td>Estudo de tendência (Bias) e linearidade<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Micrômetro<\/td>\n<td>Bloco-padrão<\/td>\n<td>Estudo de tendência (Bias) e linearidade<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Testador de vazamento<\/td>\n<td>Leituras realizadas com padrão do fornecedor<\/td>\n<td>Estudo de tendência (Bias) e linearidade<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Dinamômetros<\/td>\n<td>Leituras realizadas com padrão do fornecedor<\/td>\n<td>Estudo de tendência (Bias) e linearidade<\/td>\n<td>12<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Quando um equipamento de medição é adaptado a uma estação de trabalho, mesa ou outro dispositivo, ele passa a ser considerado um dispositivo de controle; portanto, o estudo MSA aplicável deve ser R&amp;R.<\/p>\n<h3 class=\"s1\">3 - Novos equipamentos de medição e ensaio<\/h3>\n<h4 class=\"s2\">3.1 Registro de equipamentos de medição e ensaio<\/h4>\n<p>Todos os equipamentos de medição e teste são registrados pelo Departamento de Metrologia no banco de dados de calibração de equipamentos, o qual apresenta, no mínimo, as seguintes informações:<\/p>\n<p>- Designação<\/p>\n<p>- Marca e tipo<\/p>\n<p>- ID do equipamento<\/p>\n<p>- Características (faixa de medição, erro máximo etc.)<\/p>\n<p>- Frequência de calibração/verificação: definida com base na importância da medição, na frequência e no tipo de uso.<\/p>\n<p>- Data da última/próxima calibração<\/p>\n<p>- Data de início de utilização<\/p>\n<p>Todos os equipamentos de medição e ensaio devem possuir uma etiqueta com o código interno de identificação e outra indicando a data prevista para a próxima calibração/verificação (etiqueta anual ou mensal), para que essa informação possa ser conferida antes do uso.<\/p>\n<h3 class=\"s1\">4 - GERENCIAMENTO DOS EQUIPAMENTOS DE MEDIÇÃO E ENSAIO<\/h3>\n<h4 class=\"s2\">4.1 Calibração/verificação<\/h4>\n<p>Existem diferentes formas de realizar calibrações ou verificações.<\/p>\n<p>A área de Metrologia deve:<\/p>\n<p>- garantir a validade dos documentos de acreditação dos laboratórios externos.<\/p>\n<p>- obter os certificados de calibração ou relatórios de verificação dos equipamentos.<\/p>\n<p>- definir a frequência de calibração dos equipamentos registrados no banco de dados, considerando, entre outros fatores, a frequência de uso, o local de armazenamento e/ou as condições do local onde são normalmente utilizados. As frequências de calibração e/ou verificação são especificadas no Banco de Dados de Calibração de Equipamentos.<\/p>\n<h4 class=\"s2\">4.2 Banco de dados de verificação/calibração<\/h4>\n<p>Cada área ou pessoa designada como responsável por equipamentos de medição e teste deve garantir que eles estejam em conformidade com a próxima data de calibração/verificação indicada no equipamento.<\/p>\n<p>Para isso, o departamento de metrologia deve consultar o Banco de Dados de Calibração de Equipamentos a fim de identificar os equipamentos que precisam ser calibrados/verificados no mês vigente.<\/p>\n<p>É permitida uma tolerância de +1 mês em relação à periodicidade de calibração/verificação, de modo a assegurar o atendimento aos requisitos do serviço.<\/p>\n<p>Após a realização da calibração/verificação, o departamento de metrologia valida e registra as ações executadas, as intervenções (histórico) e o respectivo status no banco de dados de equipamentos.<\/p>\n<p>Caso ocorra um atraso na calibração/verificação (seja planejado ou acidental), o uso do equipamento deve ser avaliado com cautela, sendo necessário consultar os registros de calibração do item para analisar seu desempenho.<\/p>\n<p>O departamento de metrologia informa a equipe responsável sobre a situação do equipamento, para que se decida se ele pode ser utilizado além do prazo de validade da calibração. Essa autorização deve ser sinalizada no próprio equipamento por meio de uma etiqueta adicional, assinada pelo Gerente da Qualidade e contendo a nova data de calibração.<\/p>\n<p>.<\/p>\n<p>Quando for realizada uma verificação e/ou calibração, devem ser asseguradas as condições de temperatura do laboratório, que devem atender a 20 °C ± 2 °C.<\/p>\n<h4 class=\"s2\">4.3 Gerenciamento de equipamentos defeituosos ou não conformes (calibração/verificação)<\/h4>\n<blockquote>\n<h4 class=\"s2\">4.3.1. Equipamento defeituoso após uma ocorrência<\/h4>\n<\/blockquote>\n<p>Em caso de mau funcionamento ou dano ao equipamento, o laboratório realiza uma análise, determina se o reparo pode ser feito interna ou externamente e valida essa decisão junto à área ou ao responsável pelo equipamento, bem como ao Gerente da Qualidade. Caso o reparo não seja possível, o equipamento é declarado \"fora de serviço\", com a devida justificativa.<\/p>\n<p>Se o equipamento for reparado, ele deve passar por uma nova calibração/verificação, e o banco de dados de equipamentos deve ser atualizado, mantendo-se a sua rastreabilidade documentada.<\/p>\n<blockquote>\n<h4 class=\"s2\">4.3.2. Equipamento não conforme durante a validação<\/h4>\n<\/blockquote>\n<p>O equipamento considerado \"em não conformidade\" no momento da verificação deve ser reparado, seja internamente ou externamente.<\/p>\n<p>Na sequência, ele deve ser novamente calibrado/verificado, e o banco de dados de equipamentos deve ser atualizado, mantendo-se a sua rastreabilidade documentada.<\/p>\n<p>Caso o equipamento não possa ser reparado, seu status deve ser alterado para \"Inativo\", registrando-se no banco de dados o motivo dessa alteração.<\/p>\n<p>Se for identificada uma questão significativa no equipamento durante a calibração/verificação, a área de Metrologia, em acordo com o Gerente da Qualidade, aumentará imediatamente a frequência de calibração/verificação e tomará as medidas necessárias em relação a outros produtos potencialmente suspeitos.<\/p>\n<p>Em caso de ferramentas ou equipamentos defeituosos, deverá ser realizada uma auditoria do produto no lote de produção atual.<\/p>\n<h4 class=\"s2\">4.4 Registros e armazenamento<\/h4>\n<p>O registro do equipamento é atualizado no banco de dados pelo responsável da Metrologia após cada calibração/verificação.<\/p>\n<p>Os documentos são arquivados na unidade de rede.<\/p>\n<h4 class=\"s2\">4.5. Lista de equipamentos de medição e ensaio<\/h4>\n<p>O banco de dados de equipamentos de medição e ensaio deve conter:<\/p>\n<ul>\n<li><p>ID do equipamento<\/p><\/li>\n<li><p>Produto<\/p><\/li>\n<li><p>Uso correspondente<\/p><\/li>\n<li><p>Características (faixa de medição, dimensões, resoluções etc.)<\/p><\/li>\n<li><p>Frequência de calibração e/ou verificação<\/p><\/li>\n<li><p>Estudos MSA aplicáveis conforme o tipo de dispositivo e sua utilização.<\/p><\/li>\n<\/ul>\n<h3 class=\"s1\">5 - AUTORIZAÇÃO E QUALIFICAÇÃO DO PESSOAL<\/h3>\n<p>O processo de autorização e qualificação do pessoal que realiza ensaios na área de Metrologia é o seguinte:<\/p>\n<ul>\n<li><p>O pessoal é contratado com base em seu nível inicial de formação (qualificação/experiência profissional).<\/p><\/li>\n<li><p>O profissional desenvolve gradualmente suas competências de acordo com a descrição de seu cargo, sob a supervisão de uma pessoa qualificada (com conhecimento teórico e prático dos equipamentos de ensaio utilizados).<\/p><\/li>\n<\/ul>\n<h3 class=\"s1\">Revisões<\/h3>\n<table class=\"pt2\">\n\n<thead>\n<tr class=\"header\">\n<th>Data<\/th>\n<th>Anterior<\/th>\n<th>Atual<\/th>\n<th>Comentários<\/th>\n<th>Responsável<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>01-10-2025<\/td>\n<td>-<\/td>\n<td>A<\/td>\n<td>Nova emissão<\/td>\n<td>P. Sobti<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n";
const PROC_ID='P08_05WI 25A';
/* Tabela do item 2.4 do procedimento. est: tipos de estudo exigidos (bias+lin = "Tendência (Bias) e linearidade") */
const PROG=[
 {k:'micint',eq:'Micrômetro interno',pad:'Bloco-padrão',est:['rr'],freq:'12',un:'mm'},
 {k:'torque',eq:'Chave de torque digital',pad:'Analisador de torque',est:['bias','lin'],freq:'12',un:'N·m'},
 {k:'balanca',eq:'Balanças',pad:'Peso-padrão',est:['bias','lin'],freq:'12',un:'g'},
 {k:'duro',eq:'Durômetro',pad:'Placa-padrão',est:['bias','lin'],freq:'12',un:''},
 {k:'paq',eq:'Paquímetros',pad:'Bloco-padrão',est:['bias','lin'],freq:'12',un:'mm'},
 {k:'relogio',eq:'Relógios comparadores digitais',pad:'Bloco-padrão',est:['bias','lin'],freq:'12',un:'mm'},
 {k:'passa',eq:'Dispositivo de controle passa/não passa',pad:'Peças de produção verificadas por CMM',est:['atr'],freq:'No recebimento',un:''},
 {k:'spc',eq:'Dispositivo de controle com SPC',pad:'Indicador digital',est:['rr'],freq:'No recebimento',un:'mm'},
 {k:'cmm',eq:'CMM',pad:'Dispositivo de calibração certificado (Tetra, Ball Bar)',est:['rr'],freq:'12',un:'mm'},
 {k:'uni',eq:'Máquina universal de ensaios',pad:'Leituras realizadas com padrão do fornecedor',est:['bias','lin'],freq:'12',un:'N'},
 {k:'plasto',eq:'Plastômetro',pad:'Leituras realizadas com padrão do fornecedor',est:['bias','lin'],freq:'12',un:''},
 {k:'altura',eq:'Medidor de altura',pad:'Bloco-padrão',est:['bias','lin'],freq:'12',un:'mm'},
 {k:'espess',eq:'Medidor de espessura',pad:'Bloco-padrão',est:['bias','lin'],freq:'12',un:'mm'},
 {k:'micro',eq:'Micrômetro',pad:'Bloco-padrão',est:['bias','lin'],freq:'12',un:'mm'},
 {k:'vazam',eq:'Testador de vazamento',pad:'Leituras realizadas com padrão do fornecedor',est:['bias','lin'],freq:'12',un:''},
 {k:'dinam',eq:'Dinamômetros',pad:'Leituras realizadas com padrão do fornecedor',est:['bias','lin'],freq:'12',un:'N'}
];
const progId=(p,t)=>`${PROC_ID}|${p.k}|${t}`;
const progTxt=p=>p.est.includes('bias')?'Estudo de tendência (Bias) e linearidade':p.est.includes('atr')?'R&R por atributo':'R&R por variável';
const progMissing=()=>PROG.flatMap(p=>p.est.filter(t=>!S.studies.some(s=>s.progId===progId(p,t))).map(t=>[p,t]));
function genProg(){
  const miss=progMissing();if(!miss.length){toast('Todos os estudos do programa já existem','fa-circle-info');return 0}
  miss.forEach(([p,t])=>{const s=newStudy(t);
    while(S.studies.some(x=>x.codigo===s.codigo)){const m=s.codigo.match(/^(.*-)(\d+)$/);s.codigo=m[1]+String(+m[2]+1).padStart(3,'0')}
    Object.assign(s,{id:'prog_'+p.k+'_'+t,progId:progId(p,t),instrumentoTxt:p.eq,padrao:p.pad,freq:p.freq,unidade:p.un,
      obs:`Gerado do procedimento ${PROC_ID} (item 2.4). Equipamento: ${p.eq}. Padrão de referência: ${p.pad}. Frequência: ${/^\d+$/.test(p.freq)?p.freq+' meses':p.freq}. Atualizar identificação (instrumento, peça, característica, LIE/LSE, responsável, data).`});
    saveStudy(normalize(s))});
  toast(`${miss.length} estudo(s) do procedimento criados e enviados ao Firebase`);if(typeof refresh==='function')refresh();return miss.length}
/* ---------- deduplicação e vínculo com o programa (anti-duplicação) ---------- */
const dataFill=s=>{let n=0;const walk=v=>{if(Array.isArray(v))v.forEach(walk);else if(v!==''&&v!=null)n++};if(s.dados)Object.values(s.dados).forEach(walk);return n};
function progCandidates(p,t){const pid=progId(p,t);
  const exact=S.studies.filter(s=>s.tipo===t&&(s.progId===pid||s.id==='prog_'+p.k+'_'+t));
  const loose=S.studies.filter(s=>s.tipo===t&&!s.progId&&s.instrumentoTxt===p.eq&&(s.padrao===p.pad||/procedimento/i.test(s.obs||'')));
  const seen=new Set(),all=[];exact.concat(loose).forEach(s=>{if(!seen.has(s.id)){seen.add(s.id);all.push(s)}});
  return all}
function migrateProg(){
  let removed=0,fixed=0;
  const recency=s=>String(s.atualizadoEm||s.criadoEm||'');
  // 1) programa do procedimento: no máximo uma cópia por item; mantém a mais preenchida
  PROG.forEach(p=>p.est.forEach(t=>{const pid=progId(p,t),canon='prog_'+p.k+'_'+t;
    const cand=progCandidates(p,t);if(!cand.length)return;
    cand.sort((a,b)=>dataFill(b)-dataFill(a)||recency(b).localeCompare(recency(a)));
    const keep=cand[0];
    cand.slice(1).forEach(s=>{S.studies=S.studies.filter(x=>x.id!==s.id);cloudDel('msapro_estudos',s.id);removed++});
    if(keep.progId!==pid){keep.progId=pid;fixed++}
    if(keep.id!==canon&&!S.studies.some(x=>x.id===canon)){const i=S.studies.findIndex(x=>x.id===keep.id);keep.id=canon;if(i>=0)S.studies[i]=keep;fixed++}}));
  // 2) duplicatas exatas fora do programa (mesmo tipo+codigo): mantém a melhor cópia
  const groups=new Map();
  S.studies.forEach(s=>{const k=s.tipo+'|'+s.codigo;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(s)});
  groups.forEach(g=>{if(g.length<2)return;
    const filled=g.filter(s=>dataFill(s)>0),empty=g.filter(s=>!dataFill(s));const drop=new Set();
    if(filled.length){const best=filled.sort((a,b)=>dataFill(b)-dataFill(a)||recency(b).localeCompare(recency(a)))[0];
      filled.slice(1).forEach(s=>{if(JSON.stringify(s.dados||{})===JSON.stringify(best.dados||{}))drop.add(s)});
      empty.forEach(s=>drop.add(s));
    }else{empty.sort((a,b)=>(b.progId?1:0)-(a.progId?1:0)||recency(b).localeCompare(recency(a)));empty.slice(1).forEach(s=>drop.add(s))}
    drop.forEach(s=>{S.studies=S.studies.filter(x=>x.id!==s.id);cloudDel('msapro_estudos',s.id);removed++})});
  return{removed,fixed}}
function migrateAll(report){const r=migrateProg();
  if(r.removed||r.fixed){persist();if(report||r.removed)toast(`${r.removed} duplicado(s) removido(s) · ${r.fixed} estudo(s) vinculado(s) ao programa`,'fa-broom')}
  else if(report)toast('Nenhuma duplicidade encontrada','fa-circle-info');
  return r}
function askGenProg(){const n=progMissing().length;if(!n){toast('Todos os estudos do programa já existem','fa-circle-info');return}
  confirmBox(`Criar <b>${n}</b> estudo(s) em branco com base na tabela do procedimento <b>${PROC_ID}</b>?<br><small>Estudos já gerados não são duplicados. Depois é só abrir cada um e atualizar os campos de identificação.</small>`,()=>{genProg();if(V.view==='procedimento')rProc();else refresh()})}
function procPrint(){openWin('Procedimento '+PROC_ID,`<style>${PROC_CSS}</style><div class="proc">${PROC_HTML}</div>`)}

  const total=PROG.reduce((a,p)=>a+p.est.length,0),feitos=total-progMissing().length;

   <div class="tw"><table class="t pg-eq"><thead><tr><th style="cursor:default">Equipamento de medição</th><th style="cursor:default">Padrão de referência</th><th style="cursor:default">Tipo de estudo</th><th style="cursor:default">Frequência</th><th style="cursor:default">Estudos no sistema</th></tr></thead><tbody>
   ${PROG.map(p=>{const ss=p.est.flatMap(t=>S.studies.filter(s=>s.progId===progId(p,t)));return `<tr><td><b>${esc(p.eq)}</b></td><td>${esc(p.pad)}</td><td>${esc(progTxt(p))}<div style="margin-top:4px">${p.est.map(t=>`<span class="tag">${TYPES[t].n}</span>`).join('')}</div></td><td>${/^\d+$/.test(p.freq)?p.freq+' meses':esc(p.freq)}</td><td>${ss.length?ss.map(stp).join(''):'<span style="color:var(--muted)">Pendente</span>'}</td></tr>`}).join('')}</tbody></table></div>
   <p class="legend">Quando um equipamento de medição é adaptado a uma estação de trabalho, mesa ou outro dispositivo, ele passa a ser dispositivo de controle e o estudo aplicável é R&amp;R (procedimento, item 2.4).</p></div>`;
  $('#main').innerHTML=`<div class="fade"><div class="top"><div><h1>Procedimento ${PROC_ID}</h1><div class="sub">Metrologia de Equipamentos de Teste · Rev. A · 10-jan-2025</div></div><div class="sp"></div>
   <button class="btn" onclick="procPrint()"><i class="fas fa-print"></i>Imprimir</button>
   <button class="btn pri" onclick="askGenProg()" ${progMissing().length?'':'disabled'}><i class="fas fa-wand-magic-sparkles"></i>Gerar estudos${progMissing().length?` (${progMissing().length})`:''}</button></div>
   <div class="tabs"><div class="tab ${tab==='doc'?'on':''}" onclick="V.ptab='doc';rProc()">Documento</div><div class="tab ${tab==='prog'?'on':''}" onclick="V.ptab='prog';rProc()">Programa MSA (tabela)</div></div>${body}</div>`;

function dashSet(){const p=+V.dash.periodo,a=V.dash.area;return S.studies.filter(s=>(!p||daysTo(s.data)>=-p)&&(!a||s.area===a))}
const areas=()=>[...new Set([...S.studies.map(s=>s.area),...S.instruments.map(i=>i.area)].filter(Boolean))].sort();
function rDash(){
  const L=dashSet(),cnt=st=>L.filter(s=>(s.resultado?.status||'Incompleto')===st).length,tot=L.length;
  const ap=cnt('Aprovado'),co=cnt('Condicional'),re=cnt('Reprovado'),inc=cnt('Incompleto');const done=tot-inc;const conf=done?ap/done*100:0;
  const grr=L.filter(s=>s.tipo==='rr'&&ok(s.resultado?.kv));const grrM=mean(grr.map(s=>s.resultado.kv));

  $('#main').innerHTML=`<div class="fade">
   <div class="top"><div><h1>Dashboard MSA</h1><div class="sub">${esc(S.cfg.empresa)} · <span class="live">Atualização em tempo real</span></div></div><div class="sp"></div>
   <select class="f" style="width:auto" id="dPer"><option value="30">Últimos 30 dias</option><option value="90">Últimos 90 dias</option><option value="365">Últimos 12 meses</option><option value="0">Todo o período</option></select>
   <select class="f" style="width:auto" id="dArea"><option value="">Todas as áreas</option>${areas().map(a=>`<option ${a===V.dash.area?'selected':''}>${esc(a)}</option>`).join('')}</select>
   <button class="btn" onclick="openPrint()"><i class="fas fa-print"></i>Imprimir</button>
   <button class="btn pri" onclick="openNew()"><i class="fas fa-plus"></i>Novo estudo</button></div>
  ${S.studies.length?'':`<div class="card" style="margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap"><i class="fas fa-circle-info c-brand" style="font-size:22px"></i><div style="flex:1"><b>Nenhum estudo cadastrado ainda.</b><div class="sub" style="color:var(--muted)">Crie seu primeiro estudo ou carregue dados de exemplo para conhecer o sistema.</div></div><button class="btn" onclick="seed()"><i class="fas fa-wand-magic-sparkles"></i>Carregar exemplos</button><button class="btn pri" onclick="openNew()"><i class="fas fa-plus"></i>Novo estudo</button></div>`}
  <div class="grid kpis" style="margin-bottom:16px">
   ${kpi('Total de estudos',tot,`${done} concluídos`,'fa-folder-open','brand',100,{})}
   ${kpi('Aprovados',ap,pct(done?ap/done*100:0)+' dos concluídos','fa-circle-check','ok',done?ap/done*100:0,{status:'Aprovado'})}
   ${kpi('Condicionais',co,pct(done?co/done*100:0),'fa-triangle-exclamation','warn',done?co/done*100:0,{status:'Condicional'})}
   ${kpi('Reprovados',re,pct(done?re/done*100:0),'fa-circle-xmark','bad',done?re/done*100:0,{status:'Reprovado'})}
   ${kpi('Índice de conformidade',pct(conf),'aprovados / concluídos','fa-gauge-high',conf>=80?'ok':conf>=60?'warn':'bad',conf,null,"go('estudos',{f:{status:'Aprovado'}})")}
   ${kpi('%GRR médio',ok(grrM)?pct(grrM):'—',`${grr.length} estudos R&R`,'fa-users',!ok(grrM)?'brand':grrM<=S.cfg.grrOk?'ok':grrM<=S.cfg.grrCond?'warn':'bad',ok(grrM)?Math.min(100,grrM/40*100):0,{tipo:'rr'})}
  </div>
  <div class="grid g2" style="margin-bottom:16px">
   <div class="card"><h3><i class="fas fa-chart-pie c-brand"></i>Resultado dos estudos<span class="hint">clique para filtrar</span></h3><div class="chart"><canvas id="chSt"></canvas></div></div>
   <div class="card"><h3><i class="fas fa-layer-group c-brand"></i>Estudos por tipo e resultado<span class="hint">clique para filtrar</span></h3><div class="chart"><canvas id="chTp"></canvas></div></div>
  </div>
  <div class="grid g2" style="margin-bottom:16px">
   <div class="card"><h3><i class="fas fa-chart-column c-brand"></i>%GRR por estudo<span class="hint">clique para abrir</span></h3><div class="chart"><canvas id="chGrr"></canvas></div><div class="legend">Linhas de referência: ${S.cfg.grrOk}% (aceitável) e ${S.cfg.grrCond}% (limite condicional)</div></div>
   <div class="card"><h3><i class="fas fa-chart-line c-brand"></i>Evolução mensal<span class="hint">clique para filtrar o mês</span></h3><div class="chart"><canvas id="chMes"></canvas></div></div>
  </div>
  <div class="grid g3">
   <div class="card"><h3><i class="fas fa-clock-rotate-left c-brand"></i>Estudos recentes<a class="hint" style="cursor:pointer;color:var(--brand)" onclick="go('estudos')">ver todos →</a></h3>${recent(L)}</div>
   <div class="card"><h3><i class="fas fa-bell c-bad"></i>Pontos de atenção</h3>${attention(L)}</div>
  </div></div>`;
  $('#dPer').value=pv;$('#dPer').onchange=e=>{V.dash.periodo=e.target.value;killAll();rDash()};$('#dArea').onchange=e=>{V.dash.area=e.target.value;killAll();rDash()};
  dashCharts(L);
}
function kpi(lb,v,s,ic,c,bar,f,click){const on=click||(f?`go('estudos',{f:${JSON.stringify(Object.assign({},f,{periodo:V.dash.periodo,area:V.dash.area})).replace(/"/g,"'")}})`:'');
  return`<div class="card kpi" onclick="${on}"><div class="lb"><i class="fas ${ic} bg-${c} c-${c}"></i>${lb}</div><div class="v">${v}</div><div class="s">${s}</div><div class="bar"><span style="width:${Math.max(0,Math.min(100,bar))}%;background:var(--${c==='brand'?'brand':c})"></span></div></div>`}
function recent(L){const r=[...L].sort((a,b)=>(b.atualizadoEm||'').localeCompare(a.atualizadoEm||'')).slice(0,7);if(!r.length)return'<div class="empty"><i class="fas fa-inbox"></i>Sem estudos no período</div>';
   return r.map(s=>`<div class="list-i" onclick="openStudy('${s.id}')"><div class="ico bg-brand c-brand"><i class="fas ${TYPES[s.tipo].ic}"></i></div><div class="tx"><b>${esc(s.codigo)} · ${esc(s.nome||s.caracteristica||TYPES[s.tipo].n)}</b><small>${TYPES[s.tipo].n} · ${esc(instrName(s))} · ${fdate(s.data)}${s.simulado?' · SIMULAÇÃO':''}</small></div><small style="color:var(--muted)">${esc(s.resultado?.chave||'')}</small>${badge(s)}</div>`).join('')}
function attention(L){const items=[];
  L.filter(s=>s.resultado?.status==='Reprovado').slice(0,5).forEach(s=>items.push(`<div class="list-i" onclick="openStudy('${s.id}')"><div class="ico bg-bad c-bad"><i class="fas fa-circle-xmark"></i></div><div class="tx"><b>${esc(s.codigo)} reprovado</b><small>${esc(s.resultado.chave)} · ${esc(instrName(s))}</small></div></div>`));
  L.filter(s=>s.resultado?.status==='Incompleto').slice(0,3).forEach(s=>items.push(`<div class="list-i" onclick="openStudy('${s.id}')"><div class="ico bg-inc"><i class="fas fa-hourglass-half"></i></div><div class="tx"><b>${esc(s.codigo)} incompleto</b><small>${esc(s.resultado.msg)}</small></div></div>`));
  return items.join('')||'<div class="empty"><i class="fas fa-circle-check" style="color:var(--ok);opacity:.6"></i>Tudo em ordem</div>'}
function dashCharts(L){Chart.defaults.font.family="'Segoe UI',sans-serif";Chart.defaults.elements.arc.borderColor=getComputedStyle(document.documentElement).getPropertyValue('--card').trim();Chart.defaults.color=getComputedStyle(document.documentElement).getPropertyValue('--muted').trim();Chart.defaults.borderColor=getComputedStyle(document.documentElement).getPropertyValue('--border').trim();
  const st=STATUS.map(x=>L.filter(s=>(s.resultado?.status||'Incompleto')===x).length);
  kill('chSt');charts.chSt=new Chart($('#chSt'),{type:'doughnut',data:{labels:STATUS,datasets:[{data:st,backgroundColor:STATUS.map(x=>SCOL[x]),borderWidth:3,borderColor:'#fff',hoverOffset:10}]},
    options:{maintainAspectRatio:false,cutout:'64%',plugins:{legend:{position:'right'}},onClick:(e,el)=>el.length&&go('estudos',{f:{status:STATUS[el[0].index],periodo:V.dash.periodo,area:V.dash.area}}),onHover:hov},plugins:[centerTxt(L.length,'estudos')]});
  const tk=Object.keys(TYPES);kill('chTp');charts.chTp=new Chart($('#chTp'),{type:'bar',data:{labels:tk.map(t=>TYPES[t].n),datasets:STATUS.map(x=>({label:x,data:tk.map(t=>L.filter(s=>s.tipo===t&&(s.resultado?.status||'Incompleto')===x).length),backgroundColor:SCOL[x],borderRadius:6}))},
    options:{maintainAspectRatio:false,scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,ticks:{precision:0}}},plugins:{legend:{position:'bottom'}},onHover:hov,onClick:(e,el)=>{if(!el.length)return;go('estudos',{f:{tipo:tk[el[0].index],status:STATUS[el[0].datasetIndex],periodo:V.dash.periodo,area:V.dash.area}})}}});
  const g=L.filter(s=>s.tipo==='rr'&&ok(s.resultado?.kv)).sort((a,b)=>b.resultado.kv-a.resultado.kv).slice(0,15);
  kill('chGrr');charts.chGrr=new Chart($('#chGrr'),{type:'bar',data:{labels:g.map(s=>s.codigo),datasets:[{label:'%GRR',data:g.map(s=>+s.resultado.kv.toFixed(2)),backgroundColor:g.map(s=>SCOL[s.resultado.status]),borderRadius:6}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{afterLabel:c=>instrName(g[c.dataIndex])}}},scales:{y:{beginAtZero:true,suggestedMax:40,ticks:{callback:v=>v+'%'}},x:{grid:{display:false}}},onHover:hov,onClick:(e,el)=>el.length&&openStudy(g[el[0].index].id)},plugins:[refLines([S.cfg.grrOk,S.cfg.grrCond])]});
  const months=[];const now=new Date();for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(d.toISOString().slice(0,7))}
  const byM=x=>months.map(m=>L.filter(s=>(s.data||'').startsWith(m)&&(!x||s.resultado?.status===x)).length);
  const lbl=months.map(m=>new Date(m+'-15').toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}));
  kill('chMes');charts.chMes=new Chart($('#chMes'),{type:'line',data:{labels:lbl,datasets:[{label:'Total',data:byM(),borderColor:'#118DFF',backgroundColor:'rgba(17,141,255,.1)',fill:true,tension:.35},{label:'Aprovados',data:byM('Aprovado'),borderColor:SCOL.Aprovado,tension:.35},{label:'Reprovados',data:byM('Reprovado'),borderColor:SCOL.Reprovado,tension:.35}]},
    options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},scales:{y:{beginAtZero:true,ticks:{precision:0}},x:{grid:{display:false}}},plugins:{legend:{position:'bottom'}},onHover:hov,onClick:(e,el)=>{if(!el.length)return;go('estudos',{f:{q:'',mes:months[el[0].index]}})}}});
}
const hov=(e,el)=>{e.native.target.style.cursor=el.length?'pointer':'default'};
const centerTxt=(v,l)=>({id:'ct',afterDraw(c){const{ctx,chartArea:a}=c;const x=(a.left+a.right)/2,y=(a.top+a.bottom)/2;ctx.save();ctx.textAlign='center';ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text').trim();ctx.font="700 26px 'Segoe UI'";ctx.fillText(v,x,y+4);ctx.font="12px 'Segoe UI'";ctx.fillStyle='#605E5C';ctx.fillText(l,x,y+22);ctx.restore()}});
const refLines=(vals,axis='y',colors=['#107C10','#D13438'],labels)=>({id:'rl'+vals.join(),afterDatasetsDraw(c){const{ctx,chartArea:a,scales}=c;const sc=scales[axis];vals.forEach((v,i)=>{if(!ok(v))return;const y=sc.getPixelForValue(v);if(y<a.top-1||y>a.bottom+1)return;ctx.save();ctx.strokeStyle=colors[i%colors.length];ctx.setLineDash([6,4]);ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(a.left,y);ctx.lineTo(a.right,y);ctx.stroke();if(labels){ctx.fillStyle=colors[i%colors.length];ctx.font='11px Segoe UI';ctx.fillText(labels[i],a.right-ctx.measureText(labels[i]).width-4,y-4)}ctx.restore()})}});
const badge=s=>{const st=s.resultado?.status||'Incompleto';const ic={Aprovado:'fa-check',Condicional:'fa-exclamation',Reprovado:'fa-xmark',Incompleto:'fa-hourglass-half'}[st];return`<span class="badge b-${st}"><i class="fas ${ic}"></i>${st}</span>`};

/* ---------------- LISTA DE ESTUDOS ---------------- */
function filtered(){const f=V.f,q=(f.q||'').toLowerCase(),p=+f.periodo;
  let L=S.studies.filter(s=>(!f.tipo||s.tipo===f.tipo)&&(!f.status||(s.resultado?.status||'Incompleto')===f.status)&&(!f.area||s.area===f.area)&&(!p||daysTo(s.data)>=-p)&&(!f.mes||(s.data||'').startsWith(f.mes))
    &&(!q||[s.codigo,s.nome,s.peca,s.caracteristica,s.responsavel,s.area,instrName(s),TYPES[s.tipo].n].join(' ').toLowerCase().includes(q)));
  const k=V.sort.k,d=V.sort.d;const val=s=>k==='instr'?instrName(s):k==='status'?STATUS.indexOf(s.resultado?.status||'Incompleto'):k==='kv'?(s.resultado?.kv??-1):k==='tipo'?TYPES[s.tipo].n:(s[k]||'');
  return L.sort((a,b)=>{const x=val(a),y=val(b);return(x>y?1:x<y?-1:0)*d})}

   `<span style="flex:1"></span>${sel('tipo',Object.entries(TYPES).map(([k,v])=>[k,v.n]),f.tipo,'Todos os tipos')}${sel('area',areas().map(a=>[a,a]),f.area,'Todas as áreas')}${sel('periodo',[['30','30 dias'],['90','90 dias'],['365','12 meses']],f.periodo,'Todo período')}
   ${f.mes?`<span class="chip on" onclick="V.f.mes='';rList()">Mês ${f.mes} ✕</span>`:''}${(f.tipo||f.status||f.area||f.periodo||f.q||f.mes)?`<button class="btn sm" onclick="V.f={q:'',tipo:'',status:'',instr:'',periodo:'',area:''};$('#q').value='';rList()"><i class="fas fa-filter-circle-xmark"></i>Limpar</button>`:''}`;

  const th=(k,l)=>`<th onclick="V.sort={k:'${k}',d:V.sort.k==='${k}'?-V.sort.d:1};rList()">${l}${V.sort.k===k?(V.sort.d>0?' ▲':' ▼'):''}</th>`;

   :`<div class="empty"><i class="fas fa-folder-open"></i>Nenhum estudo encontrado.<br><br><button class="btn pri" onclick="openNew()"><i class="fas fa-plus"></i>Criar estudo</button></div>`;

function askDel(id){const s=S.studies.find(x=>x.id===id);confirmBox(`Excluir o estudo <b>${esc(s.codigo)}</b>? Esta ação não pode ser desfeita.`,()=>{delStudy(id);V.sel.delete(id);toast('Estudo excluído','fa-trash');if(V.view==='editor')go('estudos',{force:true});else refresh()})}
function bulkDel(){confirmBox(`Excluir <b>${V.sel.size}</b> estudo(s) selecionado(s)?`,()=>{[...V.sel].forEach(delStudy);V.sel.clear();toast('Estudos excluídos','fa-trash');rList()})}
function dupStudy(id){const s=JSON.parse(JSON.stringify(S.studies.find(x=>x.id===id)));s.id=uid();s.codigo=nextCode(s.tipo);s.data=today();s.criadoEm=new Date().toISOString();s.nome=(s.nome||'')+' (cópia)';saveStudy(s);toast('Estudo duplicado');openStudy(s.id)}
function openStudy(id){const s=S.studies.find(x=>x.id===id);if(!s)return;V.edit=normalize(JSON.parse(JSON.stringify(s)));V.isNew=false;V.dirty=false;go('editor',{force:true})}
function openNew(t){if(!t){modal(`<div class="mh"><h3>Novo estudo MSA</h3><button class="btn ic" onclick="closeModal()"><i class="fas fa-xmark"></i></button></div><div class="mb"><div class="types">${Object.entries(TYPES).map(([k,v])=>`<div class="type" onclick="closeModal();openNew('${k}')"><i class="fas ${v.ic}"></i><b>${v.n}</b><small>${v.d}</small></div>`).join('')}</div></div>`);return}
  const go2=()=>{V.edit=newStudy(t);V.isNew=true;V.dirty=false;go('editor',{force:true})};if(V.view==='editor'&&V.dirty)confirmBox('Descartar alterações não salvas?',go2);else go2()}
