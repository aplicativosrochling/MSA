<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSA Pro — Gestão de Análise de Sistemas de Medição</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F6;--card:#fff;--brand:#0064B3;--brand-d:#004F8D;--brand-l:#3D8FD0;--text:#1E2B37;--muted:#5B6773;--border:#DCE5EE;--ok:#2E9E4F;--ok-bg:#E6F6EA;--warn:#C98A00;--warn-bg:#FFF6DB;--bad:#D23B3B;--bad-bg:#FDEAEA;--inc:#7A8794;--inc-bg:#EEF1F4;--r:16px;--sh:0 1px 2px rgba(16,40,64,.06),0 8px 24px -12px rgba(16,40,64,.18)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:248px;flex-shrink:0;background:linear-gradient(170deg,var(--brand),var(--brand-d));color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px}
.logo{display:flex;align-items:center;gap:12px;padding:4px 8px 22px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:12px}
.logo .ic{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:18px}
.logo b{font-family:'Space Grotesk';font-size:18px;display:block}.logo small{opacity:.7;font-size:11px}
.nav-s{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;opacity:.55;padding:14px 10px 6px;font-weight:700}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;color:rgba(255,255,255,.8);font-weight:600;font-size:13.5px;transition:.15s;border:0;background:none;width:100%;text-align:left}
.nav i{width:18px;text-align:center}.nav:hover{background:rgba(255,255,255,.12);color:#fff}
.nav.on{background:#fff;color:var(--brand-d);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.nav .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.2);padding:1px 8px;border-radius:20px}.nav.on .cnt{background:var(--bg)}
.side-foot{margin-top:auto;font-size:11.5px;opacity:.85;padding:10px;border-top:1px solid rgba(255,255,255,.15)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#aaa}.dot.on{background:#6CE08A;box-shadow:0 0 0 3px rgba(108,224,138,.25)}
/* main */
.main{flex:1;min-width:0;padding:22px 28px 40px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:24px}.top .sub{color:var(--muted);font-size:13px}
.top .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px 12px;min-width:240px}
.search input{border:0;outline:0;flex:1;background:none}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:#fff;padding:9px 14px;border-radius:11px;cursor:pointer;font-weight:600;font-size:13px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--brand-l);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand-d);color:#fff}
.btn.dan{color:var(--bad)}.btn.dan:hover{border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.btn.ic{padding:7px 9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .hint{margin-left:auto;font:500 11px 'DM Sans';color:var(--muted)}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{cursor:pointer;position:relative;overflow:hidden;transition:.18s}
.kpi:hover{transform:translateY(-2px);border-color:var(--brand-l)}
.kpi .lb{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.kpi .lb i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:13px}
.kpi .v{font:700 30px 'Space Grotesk';margin-top:10px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .bar{height:5px;border-radius:5px;background:var(--bg);margin-top:10px;overflow:hidden}.kpi .bar span{display:block;height:100%;border-radius:5px;transition:width .6s}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}.c-brand{color:var(--brand)}
.bg-ok{background:var(--ok-bg)}.bg-warn{background:var(--warn-bg)}.bg-bad{background:var(--bad-bg)}.bg-brand{background:#E3EFFA}.bg-inc{background:var(--inc-bg)}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.g3{grid-template-columns:2fr 1fr}
.chart{position:relative;height:260px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-Aprovado{background:var(--ok-bg);color:var(--ok)}.b-Condicional{background:var(--warn-bg);color:var(--warn)}.b-Reprovado{background:var(--bad-bg);color:var(--bad)}.b-Incompleto{background:var(--inc-bg);color:var(--inc)}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#E3EFFA;color:var(--brand-d);font-weight:700}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:10px;border-bottom:1px solid var(--border);background:#F7FAFC;position:sticky;top:0;cursor:pointer;user-select:none}
table.t td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
table.t tr.cl:hover td{background:#F5F9FD;cursor:pointer}
.tw{overflow:auto;border:1px solid var(--border);border-radius:12px;background:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:12.5px;font-weight:600}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
select.f,input.f,textarea.f{border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:#fff;outline:0;width:100%}
select.f:focus,input.f:focus,textarea.f:focus{border-color:var(--brand-l);box-shadow:0 0 0 3px rgba(61,143,208,.15)}
label.l{font-size:11.5px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}.empty i{font-size:34px;opacity:.35;display:block;margin-bottom:10px}
/* data grid */
.dg{border-collapse:collapse;font-size:12.5px}
.dg th,.dg td{border:1px solid var(--border);padding:0;text-align:center;min-width:62px}
.dg th{background:#F2F6FA;padding:6px;font-weight:700;font-size:11.5px;color:var(--muted)}
.dg td.h{background:#F7FAFC;font-weight:700;padding:6px}
.dg td.c{background:#FBFCFD;padding:6px;font-weight:600;color:var(--brand-d)}
.dg input{width:100%;border:0;padding:7px 4px;text-align:center;background:transparent;outline:0}
.dg input:focus{background:#E8F2FB}
.dg td.out{background:var(--bad-bg)!important;color:var(--bad)}
.dg td.tg{cursor:pointer;font-weight:700;padding:6px;user-select:none}
.dg td.tg.v1{background:var(--ok-bg);color:var(--ok)}.dg td.tg.v0{background:var(--bad-bg);color:var(--bad)}.dg td.tg.vn{color:#bbb}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.m{background:#F7FAFC;border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.m .k{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.m .x{font:700 19px 'Space Grotesk';margin-top:4px}
.verdict{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;margin-bottom:14px}
.verdict i{font-size:26px}.verdict b{font:700 18px 'Space Grotesk';display:block}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--brand);border-color:var(--brand)}
.list-i{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px dashed var(--border);cursor:pointer}
.list-i:last-child{border:0}.list-i:hover{background:#F7FAFC}
.list-i .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.list-i .tx{flex:1;min-width:0}.list-i .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list-i .tx small{color:var(--muted)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,30,45,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;backdrop-filter:blur(2px)}
.ov.show{display:flex}
.modal{background:#fff;border-radius:18px;width:100%;max-width:620px;max-height:90vh;overflow:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.modal .mh{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}.modal .mh h3{flex:1;font-size:17px}
.modal .mb{padding:20px}.modal .mf{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.type{border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;transition:.15s}
.type:hover{border-color:var(--brand);background:#F3F8FD}
.type i{font-size:20px;color:var(--brand);margin-bottom:8px}.type b{display:block}.type small{color:var(--muted);font-size:12px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--text);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:60;transform:translateY(120px);transition:.3s;display:flex;gap:10px;align-items:center}
.toast.show{transform:none}
.dd{position:relative}.dd-m{position:absolute;right:0;top:110%;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh);min-width:220px;padding:6px;display:none;z-index:20}
.dd.open .dd-m{display:block}.dd-m div{padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:center}.dd-m div:hover{background:#F3F8FD}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.legend{font-size:12px;color:var(--muted);margin-top:8px}
.live{font-size:11px;color:var(--ok);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.live:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.25}}
.fade{animation:fd .25s ease}@keyframes fd{from{opacity:0;transform:translateY(4px)}}
@media(max-width:900px){.side{display:none}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.main{padding:16px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="ic"><i class="fas fa-ruler-combined"></i></div><div><b>MSA Pro</b><small>Análise de Sistemas de Medição</small></div></div>
    <div class="nav-s">Visão geral</div>
    <button class="nav" data-v="dashboard"><i class="fas fa-chart-pie"></i>Dashboard</button>
    <button class="nav" data-v="estudos"><i class="fas fa-folder-open"></i>Estudos<span class="cnt" id="cntE">0</span></button>
    <button class="nav" data-v="instrumentos"><i class="fas fa-screwdriver-wrench"></i>Instrumentos<span class="cnt" id="cntI">0</span></button>
    <div class="nav-s">Novo estudo</div>
    <button class="nav" data-new="est"><i class="fas fa-wave-square"></i>Estabilidade</button>
    <button class="nav" data-new="bias"><i class="fas fa-bullseye"></i>Tendência (Bias)</button>
    <button class="nav" data-new="lin"><i class="fas fa-chart-line"></i>Linearidade</button>
    <button class="nav" data-new="rr"><i class="fas fa-users"></i>R&amp;R Variável</button>
    <button class="nav" data-new="atr"><i class="fas fa-check-double"></i>R&amp;R Atributo</button>
    <div class="nav-s">Sistema</div>
    <button class="nav" data-v="config"><i class="fas fa-gear"></i>Configurações</button>
    <div class="side-foot"><span class="dot" id="syncDot"></span><span id="syncTxt">Dados locais</span></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<canvas id="printCanvas" width="900" height="380" style="position:fixed;left:-9999px;top:0"></canvas>

<script>
/* ============================================================
   MSA PRO — sistema completo em arquivo único
   Persistência: localStorage (sempre) + Firebase Firestore (opcional, tempo real)
   ============================================================ */
const TYPES={
  est:{n:'Estabilidade',ic:'fa-wave-square',d:'Carta X̄-R ao longo do tempo com peça padrão'},
  bias:{n:'Tendência (Bias)',ic:'fa-bullseye',d:'Leituras repetidas contra valor de referência'},
  lin:{n:'Linearidade',ic:'fa-chart-line',d:'Tendência ao longo da faixa de operação'},
  rr:{n:'R&R Variável',ic:'fa-users',d:'Médias e amplitudes (AIAG) — operadores × peças × ciclos'},
  atr:{n:'R&R Atributo',ic:'fa-check-double',d:'Kappa, eficácia, perda e falso alarme'}
};
const STATUS=['Aprovado','Condicional','Reprovado','Incompleto'];
const SCOL={Aprovado:'#2E9E4F',Condicional:'#E0A400',Reprovado:'#D23B3B',Incompleto:'#9AA6B2'};
const KEY='msa_pro_v1';
const FB={apiKey:"AIzaSyAcmnS6S47tznpns-ZEarMXqXAFsD_Ylqk",authDomain:"msa-novo.firebaseapp.com",projectId:"msa-novo",storageBucket:"msa-novo.firebasestorage.app",messagingSenderId:"154466050071",appId:"1:154466050071:web:7e17a9fe24e448bfb9fc52"};

/* ---------------- utilidades ---------------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(v===''||v==null)return NaN;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:NaN};
const ok=v=>typeof v==='number'&&isFinite(v);
const fmt=(v,d=4)=>ok(v)?(+v.toFixed(d)).toLocaleString('pt-BR',{maximumFractionDigits:d}):'—';
const pct=(v,d=1)=>ok(v)?v.toFixed(d).replace('.',',')+'%':'—';
const mean=a=>{a=a.filter(ok);return a.length?a.reduce((s,x)=>s+x,0)/a.length:NaN};
const sd=a=>{a=a.filter(ok);if(a.length<2)return NaN;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))};
const rng=a=>{a=a.filter(ok);return a.length?Math.max(...a)-Math.min(...a):NaN};
const today=()=>new Date().toISOString().slice(0,10);
const fdate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'—';
const daysTo=d=>d?Math.round((new Date(d+'T12:00:00')-new Date(today()+'T12:00:00'))/864e5):null;
function tcrit(df){if(!(df>0))return NaN;const z=1.959964;return z+(z**3+z)/(4*df)+(5*z**5+16*z**3+3*z)/(96*df**2)+(3*z**7+19*z**5+17*z**3-15*z)/(384*df**3)+(79*z**9+776*z**7+1482*z**5-1920*z**3-945*z)/(92160*df**4)}
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const r4=v=>Math.round(v*10000)/10000;
function toast(msg,icon='fa-circle-check'){const t=$('#toast');t.innerHTML=`<i class="fas ${icon}"></i>${esc(msg)}`;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
function mtx(r,c,f=''){return Array.from({length:r},()=>Array.from({length:c},()=>f))}
function resize(m,r,c,f=''){m=m||[];return Array.from({length:r},(_,i)=>Array.from({length:c},(_,j)=>(m[i]&&m[i][j]!==undefined)?m[i][j]:f))}

/* ---------------- dados / persistência ---------------- */
let S={studies:[],instruments:[],cfg:{empresa:'Minha Empresa',grrOk:10,grrCond:30,ndcMin:5,base:'tv',k:6,biasMax:10,effOk:90,effCond:80,missOk:2,faOk:5,kappaOk:0.75,cloud:true,diasAviso:30}};
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){S.studies=d.studies||[];S.instruments=d.instruments||[];Object.assign(S.cfg,d.cfg||{})}}catch(e){}}
function persist(){localStorage.setItem(KEY,JSON.stringify(S));try{bc&&bc.postMessage('upd')}catch(e){}}
let db=null,bc=null;try{bc=new BroadcastChannel('msa_pro');bc.onmessage=()=>{load();refresh()}}catch(e){}
window.addEventListener('storage',e=>{if(e.key===KEY){load();refresh()}});
function cloudSet(col,doc){if(db)db.collection(col).doc(doc.id).set(JSON.parse(JSON.stringify(doc))).catch(()=>setSync(false))}
function cloudDel(col,id){if(db)db.collection(col).doc(id).delete().catch(()=>{})}
function setSync(on){$('#syncDot').className='dot'+(on?' on':'');$('#syncTxt').textContent=on?'Nuvem conectada · tempo real':'Dados locais (offline)'}
function initCloud(){
  if(!S.cfg.cloud||typeof firebase==='undefined'){setSync(false);return}
  try{if(!firebase.apps.length)firebase.initializeApp(FB);db=firebase.firestore();
    const sub=(col,key)=>db.collection(col).onSnapshot(snap=>{
      const remote=snap.docs.map(d=>d.data());const ids=new Set(remote.map(r=>r.id));
      // envia itens locais ainda não existentes na nuvem (primeira sincronização)
      if(!sub[col]){S[key].filter(x=>!ids.has(x.id)).forEach(x=>cloudSet(col,x));sub[col]=1;
        const loc=new Map(S[key].map(x=>[x.id,x]));remote.forEach(r=>{const l=loc.get(r.id);if(!l||(r.atualizadoEm||'')>=(l.atualizadoEm||''))loc.set(r.id,r)});S[key]=[...loc.values()];}
      else S[key]=remote;
      localStorage.setItem(KEY,JSON.stringify(S));setSync(true);refresh();
    },()=>{db=null;setSync(false)});
    sub('msapro_estudos','studies');sub('msapro_instrumentos','instruments');
  }catch(e){db=null;setSync(false)}
}
function saveStudy(s){s.atualizadoEm=new Date().toISOString();s.resultado=calc(s);const i=S.studies.findIndex(x=>x.id===s.id);if(i>=0)S.studies[i]=s;else S.studies.push(s);persist();cloudSet('msapro_estudos',s)}
function delStudy(id){S.studies=S.studies.filter(x=>x.id!==id);persist();cloudDel('msapro_estudos',id)}
function saveInstr(x){x.atualizadoEm=new Date().toISOString();const i=S.instruments.findIndex(y=>y.id===x.id);if(i>=0)S.instruments[i]=x;else S.instruments.push(x);persist();cloudSet('msapro_instrumentos',x)}
function delInstr(id){S.instruments=S.instruments.filter(x=>x.id!==id);persist();cloudDel('msapro_instrumentos',id)}
const instrOf=s=>S.instruments.find(i=>i.id===s.instrumentoId);
const instrName=s=>{const i=instrOf(s);return i?`${i.codigo} — ${i.descricao}`:(s.instrumentoTxt||'—')};

/* ---------------- modelos de estudo ---------------- */
function nextCode(t){const pre={est:'EST',bias:'TEN',lin:'LIN',rr:'GRR',atr:'ATR'}[t];const n=S.studies.filter(s=>s.tipo===t).length+1;return `${pre}-${new Date().getFullYear()}-${String(n).padStart(3,'0')}`}
function newStudy(t){
  const base={id:uid(),tipo:t,codigo:nextCode(t),nome:'',instrumentoId:'',instrumentoTxt:'',peca:'',caracteristica:'',unidade:'mm',lie:'',lse:'',responsavel:'',area:'',data:today(),obs:'',criadoEm:new Date().toISOString()};
  const D={est:{n:5,g:20,ref:'',m:mtx(20,5)},bias:{ref:'',n:15,v:Array(15).fill('')},lin:{g:5,m:10,refs:Array(5).fill(''),v:mtx(5,10)},

  L.filter(s=>s.resultado?.status==='Reprovado').slice(0,5).forEach(s=>items.push(`<div class="list-i" onclick="openStudy('${s.id}')"><div class="ico bg-bad c-bad"><i class="fas fa-circle-xmark"></i></div><div class="tx"><b>${esc(s.codigo)} reprovado</b><small>${esc(s.resultado.chave)} · ${esc(instrName(s))}</small></div></div>`));
  cal.sort((a,b)=>daysTo(a.proxCal)-daysTo(b.proxCal)).slice(0,5).forEach(i=>{const d=daysTo(i.proxCal);items.push(`<div class="list-i" onclick="editInstr('${i.id}')"><div class="ico ${d<0?'bg-bad c-bad':'bg-warn c-warn'}"><i class="fas fa-calendar-xmark"></i></div><div class="tx"><b>${esc(i.codigo)} — ${esc(i.descricao)}</b><small>Calibração ${d<0?'vencida há '+(-d)+' dia(s)':'vence em '+d+' dia(s)'}</small></div></div>`)});
  L.filter(s=>s.resultado?.status==='Incompleto').slice(0,3).forEach(s=>items.push(`<div class="list-i" onclick="openStudy('${s.id}')"><div class="ico bg-inc"><i class="fas fa-hourglass-half"></i></div><div class="tx"><b>${esc(s.codigo)} incompleto</b><small>${esc(s.resultado.msg)}</small></div></div>`));
  return items.join('')||'<div class="empty"><i class="fas fa-circle-check" style="color:var(--ok);opacity:.6"></i>Tudo em ordem</div>'}
function dashCharts(L){Chart.defaults.font.family="'DM Sans',sans-serif";Chart.defaults.color='#5B6773';
  const st=STATUS.map(x=>L.filter(s=>(s.resultado?.status||'Incompleto')===x).length);
  kill('chSt');charts.chSt=new Chart($('#chSt'),{type:'doughnut',data:{labels:STATUS,datasets:[{data:st,backgroundColor:STATUS.map(x=>SCOL[x]),borderWidth:3,borderColor:'#fff',hoverOffset:10}]},
    options:{maintainAspectRatio:false,cutout:'64%',plugins:{legend:{position:'right'}},onClick:(e,el)=>el.length&&go('estudos',{f:{status:STATUS[el[0].index],periodo:V.dash.periodo,area:V.dash.area}}),onHover:hov},plugins:[centerTxt(L.length,'estudos')]});
  const tk=Object.keys(TYPES);kill('chTp');charts.chTp=new Chart($('#chTp'),{type:'bar',data:{labels:tk.map(t=>TYPES[t].n),datasets:STATUS.map(x=>({label:x,data:tk.map(t=>L.filter(s=>s.tipo===t&&(s.resultado?.status||'Incompleto')===x).length),backgroundColor:SCOL[x],borderRadius:6}))},
    options:{maintainAspectRatio:false,scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,ticks:{precision:0}}},plugins:{legend:{position:'bottom'}},onHover:hov,onClick:(e,el)=>{if(!el.length)return;go('estudos',{f:{tipo:tk[el[0].index],status:STATUS[el[0].datasetIndex],periodo:V.dash.periodo,area:V.dash.area}})}}});
  const g=L.filter(s=>s.tipo==='rr'&&ok(s.resultado?.kv)).sort((a,b)=>b.resultado.kv-a.resultado.kv).slice(0,15);
  kill('chGrr');charts.chGrr=new Chart($('#chGrr'),{type:'bar',data:{labels:g.map(s=>s.codigo),datasets:[{label:'%GRR',data:g.map(s=>+s.resultado.kv.toFixed(2)),backgroundColor:g.map(s=>SCOL[s.resultado.status]),borderRadius:6}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{afterLabel:c=>instrName(g[c.dataIndex])}}},scales:{y:{beginAtZero:true,suggestedMax:40,ticks:{callback:v=>v+'%'}},x:{grid:{display:false}}},onHover:hov,onClick:(e,el)=>el.length&&openStudy(g[el[0].index].id)},plugins:[refLines([S.cfg.grrOk,S.cfg.grrCond])]});
  const months=[];const now=new Date();for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(d.toISOString().slice(0,7))}
  const byM=x=>months.map(m=>L.filter(s=>(s.data||'').startsWith(m)&&(!x||s.resultado?.status===x)).length);
  const lbl=months.map(m=>new Date(m+'-15').toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}));
  kill('chMes');charts.chMes=new Chart($('#chMes'),{type:'line',data:{labels:lbl,datasets:[{label:'Total',data:byM(),borderColor:'#0064B3',backgroundColor:'rgba(0,100,179,.1)',fill:true,tension:.35},{label:'Aprovados',data:byM('Aprovado'),borderColor:SCOL.Aprovado,tension:.35},{label:'Reprovados',data:byM('Reprovado'),borderColor:SCOL.Reprovado,tension:.35}]},
    options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},scales:{y:{beginAtZero:true,ticks:{precision:0}},x:{grid:{display:false}}},plugins:{legend:{position:'bottom'}},onHover:hov,onClick:(e,el)=>{if(!el.length)return;go('estudos',{f:{q:'',mes:months[el[0].index]}})}}});
}
const hov=(e,el)=>{e.native.target.style.cursor=el.length?'pointer':'default'};
const centerTxt=(v,l)=>({id:'ct',afterDraw(c){const{ctx,chartArea:a}=c;const x=(a.left+a.right)/2,y=(a.top+a.bottom)/2;ctx.save();ctx.textAlign='center';ctx.fillStyle='#1E2B37';ctx.font="700 26px 'Space Grotesk'";ctx.fillText(v,x,y+4);ctx.font="12px 'DM Sans'";ctx.fillStyle='#5B6773';ctx.fillText(l,x,y+22);ctx.restore()}});
const refLines=(vals,axis='y',colors=['#2E9E4F','#D23B3B'],labels)=>({id:'rl'+vals.join(),afterDatasetsDraw(c){const{ctx,chartArea:a,scales}=c;const sc=scales[axis];vals.forEach((v,i)=>{if(!ok(v))return;const y=sc.getPixelForValue(v);if(y<a.top-1||y>a.bottom+1)return;ctx.save();ctx.strokeStyle=colors[i%colors.length];ctx.setLineDash([6,4]);ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(a.left,y);ctx.lineTo(a.right,y);ctx.stroke();if(labels){ctx.fillStyle=colors[i%colors.length];ctx.font='11px DM Sans';ctx.fillText(labels[i],a.right-ctx.measureText(labels[i]).width-4,y-4)}ctx.restore()})}});
const badge=s=>{const st=s.resultado?.status||'Incompleto';const ic={Aprovado:'fa-check',Condicional:'fa-exclamation',Reprovado:'fa-xmark',Incompleto:'fa-hourglass-half'}[st];return`<span class="badge b-${st}"><i class="fas ${ic}"></i>${st}</span>`};

/* ---------------- LISTA DE ESTUDOS ---------------- */
function filtered(){const f=V.f,q=(f.q||'').toLowerCase(),p=+f.periodo;
  let L=S.studies.filter(s=>(!f.tipo||s.tipo===f.tipo)&&(!f.status||(s.resultado?.status||'Incompleto')===f.status)&&(!f.instr||s.instrumentoId===f.instr)&&(!f.area||s.area===f.area)&&(!p||daysTo(s.data)>=-p)&&(!f.mes||(s.data||'').startsWith(f.mes))
    &&(!q||[s.codigo,s.nome,s.peca,s.caracteristica,s.responsavel,s.area,instrName(s),TYPES[s.tipo].n].join(' ').toLowerCase().includes(q)));
  const k=V.sort.k,d=V.sort.d;const val=s=>k==='instr'?instrName(s):k==='status'?STATUS.indexOf(s.resultado?.status||'Incompleto'):k==='kv'?(s.resultado?.kv??-1):k==='tipo'?TYPES[s.tipo].n:(s[k]||'');
  return L.sort((a,b)=>{const x=val(a),y=val(b);return(x>y?1:x<y?-1:0)*d})}
function rList(){const L=filtered(),f=V.f;
  if(!$('#lst')){
  $('#main').innerHTML=`<div class="fade"><div class="top"><div><h1>Estudos</h1><div class="sub">Gerencie, edite, duplique, imprima e exporte seus estudos MSA</div></div><div class="sp"></div>

   <div class="dd" id="ddX"><button class="btn" onclick="this.parentNode.classList.toggle('open')"><i class="fas fa-file-export"></i>Exportar<i class="fas fa-chevron-down" style="font-size:10px"></i></button><div class="dd-m">
    <div onclick="exportCSV()"><i class="fas fa-file-csv"></i>Planilha CSV (filtrados)</div><div onclick="exportJSON()"><i class="fas fa-database"></i>Backup completo (JSON)</div><div onclick="$('#imp').click()"><i class="fas fa-file-import"></i>Importar backup</div></div></div>
   <input type="file" id="imp" accept=".json" hidden>
   <button class="btn pri" onclick="openNew()"><i class="fas fa-plus"></i>Novo estudo</button></div>

   $('#q').oninput=e=>{V.f.q=e.target.value;rList()};$('#imp').onchange=importJSON;
   document.addEventListener('click',e=>{if(!e.target.closest('.dd'))$$('.dd').forEach(d=>d.classList.remove('open'))});
  }
  const sel=(id,opts,val,ph)=>`<select class="f" style="width:auto" onchange="V.f.${id}=this.value;rList()"><option value="">${ph}</option>${opts.map(([v,l])=>`<option value="${esc(v)}" ${v===val?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  $('#chips').innerHTML=`<span class="chip ${!f.status?'on':''}" onclick="V.f.status='';rList()">Todos (${S.studies.length})</span>`+STATUS.map(st=>`<span class="chip ${f.status===st?'on':''}" onclick="V.f.status='${st}';rList()"><span class="dot" style="background:${SCOL[st]}"></span>${st} (${S.studies.filter(s=>(s.resultado?.status||'Incompleto')===st).length})</span>`).join('')+
   `<span style="flex:1"></span>${sel('tipo',Object.entries(TYPES).map(([k,v])=>[k,v.n]),f.tipo,'Todos os tipos')}${sel('instr',S.instruments.map(i=>[i.id,i.codigo+' — '+i.descricao]),f.instr,'Todos os instrumentos')}${sel('area',areas().map(a=>[a,a]),f.area,'Todas as áreas')}${sel('periodo',[['30','30 dias'],['90','90 dias'],['365','12 meses']],f.periodo,'Todo período')}
   ${f.mes?`<span class="chip on" onclick="V.f.mes='';rList()">Mês ${f.mes} ✕</span>`:''}${(f.tipo||f.status||f.instr||f.area||f.periodo||f.q||f.mes)?`<button class="btn sm" onclick="V.f={q:'',tipo:'',status:'',instr:'',periodo:'',area:''};$('#q').value='';rList()"><i class="fas fa-filter-circle-xmark"></i>Limpar</button>`:''}`;
  V.sel=new Set([...V.sel].filter(id=>S.studies.some(s=>s.id===id)));
  $('#bulk').innerHTML=V.sel.size?`<b>${V.sel.size} selecionado(s)</b><button class="btn sm" onclick="printStudies([...V.sel])"><i class="fas fa-print"></i>Imprimir</button><button class="btn sm" onclick="exportCSV([...V.sel])"><i class="fas fa-file-csv"></i>CSV</button><button class="btn sm dan" onclick="bulkDel()"><i class="fas fa-trash"></i>Excluir</button><button class="btn sm" onclick="V.sel.clear();rList()">Limpar seleção</button>`:`<span style="color:var(--muted);font-size:12.5px">${L.length} estudo(s) encontrado(s)</span>`;
  const th=(k,l)=>`<th onclick="V.sort={k:'${k}',d:V.sort.k==='${k}'?-V.sort.d:1};rList()">${l}${V.sort.k===k?(V.sort.d>0?' ▲':' ▼'):''}</th>`;
  $('#lst').innerHTML=L.length?`<table class="t"><thead><tr><th style="width:34px"><input type="checkbox" ${L.length&&L.every(s=>V.sel.has(s.id))?'checked':''} onclick="event.stopPropagation();${L.map(s=>`'${s.id}'`).length?`[${L.map(s=>`'${s.id}'`).join(',')}].forEach(i=>this.checked?V.sel.add(i):V.sel.delete(i));rList()`:''}"></th>${th('codigo','Código')}${th('tipo','Tipo')}${th('nome','Peça / Característica')}${th('instr','Instrumento')}${th('data','Data')}${th('responsavel','Responsável')}${th('kv','Resultado')}${th('status','Status')}<th style="cursor:default">Ações</th></tr></thead><tbody>
   ${L.map(s=>`<tr class="cl" onclick="openStudy('${s.id}')"><td onclick="event.stopPropagation()"><input type="checkbox" ${V.sel.has(s.id)?'checked':''} onchange="this.checked?V.sel.add('${s.id}'):V.sel.delete('${s.id}');rList()"></td>
   <td><b>${esc(s.codigo)}</b></td><td><span class="tag"><i class="fas ${TYPES[s.tipo].ic}"></i> ${TYPES[s.tipo].n}</span></td><td>${esc(s.nome||s.peca||'—')}<div style="color:var(--muted);font-size:12px">${esc(s.caracteristica)}</div></td><td>${esc(instrName(s))}</td><td>${fdate(s.data)}</td><td>${esc(s.responsavel||'—')}</td><td>${esc(s.resultado?.chave||'—')}</td><td>${badge(s)}</td>
   <td onclick="event.stopPropagation()" style="white-space:nowrap"><button class="btn ic sm" title="Editar" onclick="openStudy('${s.id}')"><i class="fas fa-pen"></i></button> <button class="btn ic sm" title="Imprimir" onclick="printStudies(['${s.id}'])"><i class="fas fa-print"></i></button> <button class="btn ic sm" title="Duplicar" onclick="dupStudy('${s.id}')"><i class="fas fa-copy"></i></button> <button class="btn ic sm dan" title="Excluir" onclick="askDel('${s.id}')"><i class="fas fa-trash"></i></button></td></tr>`).join('')}</tbody></table>`
   :`<div class="empty"><i class="fas fa-folder-open"></i>Nenhum estudo encontrado.<br><br><button class="btn pri" onclick="openNew()"><i class="fas fa-plus"></i>Criar estudo</button></div>`;
}
function askDel(id){const s=S.studies.find(x=>x.id===id);confirmBox(`Excluir o estudo <b>${esc(s.codigo)}</b>? Esta ação não pode ser desfeita.`,()=>{delStudy(id);V.sel.delete(id);toast('Estudo excluído','fa-trash');if(V.view==='editor')go('estudos',{force:true});else refresh()})}
function bulkDel(){confirmBox(`Excluir <b>${V.sel.size}</b> estudo(s) selecionado(s)?`,()=>{[...V.sel].forEach(delStudy);V.sel.clear();toast('Estudos excluídos','fa-trash');rList()})}
function dupStudy(id){const s=JSON.parse(JSON.stringify(S.studies.find(x=>x.id===id)));s.id=uid();s.codigo=nextCode(s.tipo);s.data=today();s.criadoEm=new Date().toISOString();s.nome=(s.nome||'')+' (cópia)';saveStudy(s);toast('Estudo duplicado');openStudy(s.id)}
function openStudy(id){const s=S.studies.find(x=>x.id===id);if(!s)return;V.edit=normalize(JSON.parse(JSON.stringify(s)));V.isNew=false;V.dirty=false;go('editor',{force:true})}
function openNew(t){if(!t){modal(`<div class="mh"><h3>Novo estudo MSA</h3><button class="btn ic" onclick="closeModal()"><i class="fas fa-xmark"></i></button></div><div class="mb"><div class="types">${Object.entries(TYPES).map(([k,v])=>`<div class="type" onclick="closeModal();openNew('${k}')"><i class="fas ${v.ic}"></i><b>${v.n}</b><small>${v.d}</small></div>`).join('')}</div></div>`);return}
  const go2=()=>{V.edit=newStudy(t);V.isNew=true;V.dirty=false;go('editor',{force:true})};if(V.view==='editor'&&V.dirty)confirmBox('Descartar alterações não salvas?',go2);else go2()}

   <div class="grid g3"><div class="card"><h3><i class="fas fa-chart-area c-brand"></i>Gráficos</h3><div id="chs"></div></div><div class="card"><h3><i class="fas fa-calculator c-brand"></i>Resultado</h3><div id="res"></div></div></div></div>`;

  const inp=(k,l,t='text',ex='')=>`<div><label class="l">${l}</label><input class="f" data-f="${k}" type="${t}" value="${esc(s[k])}" ${ex}></div>`;
  $('#info').innerHTML=inp('codigo','Código')+inp('nome','Peça / Descrição')+inp('caracteristica','Característica')+
   `<div><label class="l">Instrumento <a style="color:var(--brand);cursor:pointer;text-transform:none" onclick="editInstr()">+ cadastrar</a></label><select class="f" data-f="instrumentoId"><option value="">— selecione —</option>${opts}</select></div>`+
   inp('unidade','Unidade')+inp('lie','LIE (tol. inferior)','text','inputmode="decimal"')+inp('lse','LSE (tol. superior)','text','inputmode="decimal"')+inp('responsavel','Responsável')+
   `<div><label class="l">Área / Setor</label><input class="f" data-f="area" list="dlArea" value="${esc(s.area)}"><datalist id="dlArea">${areas().map(a=>`<option>${esc(a)}</option>`).join('')}</datalist></div>`+inp('data','Data','date')+
   `<div style="grid-column:1/-1"><label class="l">Observações / Ações</label><textarea class="f" data-f="obs" rows="2">${esc(s.obs)}</textarea></div>`;
  $$('#info [data-f]').forEach(e=>e.oninput=()=>{s[e.dataset.f]=e.value;if(e.dataset.f==='instrumentoId'){const i=instrOf(s);if(i){if(!s.area)s.area=i.area||'';if(!s.unidade||s.unidade==='mm')s.unidade=i.unidade||s.unidade}}markDirty();if(['lie','lse'].includes(e.dataset.f))recalc()});

function markDirty(){V.dirty=true;const d=$('#dirty');if(d)d.innerHTML='· <b class="c-warn">alterações não salvas</b>'}
function rParams(){const s=V.edit,d=s.dados;const ni=(k,l,mn,mx)=>`<label class="row" style="gap:6px"><span class="l" style="margin:0">${l}</span><input class="f" style="width:74px" type="number" min="${mn}" max="${mx}" value="${d[k]}" onchange="V.edit.dados.${k}=Math.min(${mx},Math.max(${mn},+this.value||${mn}));normalize(V.edit);markDirty();rParams();rGrid();recalc()"></label>`;

function cell(path,val){return`<td><input data-p="${path}" value="${esc(val)}" inputmode="decimal"></td>`}
function rGrid(){const s=V.edit,d=s.dados;let h='';

  plan.forEach((t,i)=>{const s=newStudy(t);const ins=t==='atr'?inst[4]:inst[i%4];const ft=feats[i%feats.length];Object.assign(s,{nome:ft[0],caracteristica:ft[1],instrumentoId:ins.id,area:ins.area,lie:'9.90',lse:'10.10',responsavel:names[i%4],data:new Date(Date.now()-Math.floor(Math.random()*330)*864e5).toISOString().slice(0,10)});
    simulate(s,i%5===3?'bad':i%4===2?'mid':'good');if(i===15)s.dados.v=s.dados.v.map((x,j)=>j>8?'':x);saveStudy(s)});
  toast('Dados de exemplo carregados');render()}

   <td onclick="event.stopPropagation()" style="white-space:nowrap"><button class="btn ic sm" title="Novo estudo para este instrumento" onclick="newFor('${i.id}')"><i class="fas fa-plus"></i></button> <button class="btn ic sm" onclick="editInstr('${i.id}')"><i class="fas fa-pen"></i></button> <button class="btn ic sm dan" onclick="askDelI('${i.id}')"><i class="fas fa-trash"></i></button></td></tr>`).join('')}</tbody></table>`:`<div class="empty"><i class="fas fa-screwdriver-wrench"></i>Nenhum instrumento cadastrado<br><br><button class="btn pri" onclick="editInstr()"><i class="fas fa-plus"></i>Cadastrar</button></div>`}
function newFor(id){modal(`<div class="mh"><h3>Novo estudo para ${esc(S.instruments.find(i=>i.id===id).codigo)}</h3><button class="btn ic" onclick="closeModal()"><i class="fas fa-xmark"></i></button></div><div class="mb"><div class="types">${Object.entries(TYPES).map(([k,v])=>`<div class="type" onclick="closeModal();openNew('${k}');V.edit.instrumentoId='${id}';const i=instrOf(V.edit);V.edit.area=i.area||'';V.edit.unidade=i.unidade||'mm';rEditor()"><i class="fas ${v.ic}"></i><b>${v.n}</b></div>`).join('')}</div></div>`)}
function editInstr(id){const i=id?{...S.instruments.find(x=>x.id===id)}:{id:uid(),codigo:'',descricao:'',tipo:'',fabricante:'',serie:'',resolucao:'',unidade:'mm',area:'',ultCal:'',proxCal:'',status:'Ativo',obs:''};

function saveCfg(){const was=S.cfg.cloud;$$('[data-c]').forEach(e=>{const k=e.dataset.c;S.cfg[k]=e.type==='checkbox'?e.checked:e.type==='number'||k==='k'?+e.value:e.value});
  S.studies.forEach(s=>s.resultado=calc(s));persist();if(S.cfg.cloud&&!was)initCloud();if(!S.cfg.cloud&&was){db=null;setSync(false)}toast('Configurações salvas · estudos recalculados')}
function wipe(){confirmBox('Apagar <b>todos</b> os estudos e instrumentos? Recomendamos baixar um backup antes.',()=>{S.studies.forEach(s=>cloudDel('msapro_estudos',s.id));S.instruments.forEach(i=>cloudDel('msapro_instrumentos',i.id));S.studies=[];S.instruments=[];persist();toast('Dados apagados','fa-trash');render()})}

function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function exportJSON(){download(`msa_backup_${today()}.json`,JSON.stringify({versao:1,exportadoEm:new Date().toISOString(),...S},null,1),'application/json');toast('Backup baixado','fa-download')}
function exportCSV(ids){const L=ids?S.studies.filter(s=>ids.includes(s.id)):filtered();const cols=['Código','Tipo','Peça','Característica','Instrumento','Área','Data','Responsável','LIE','LSE','Status','Resultado','Mensagem'];
  const allM=[...new Set(L.flatMap(s=>Object.keys(s.resultado?.m||{})))];const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows=L.map(s=>[s.codigo,TYPES[s.tipo].n,s.nome,s.caracteristica,instrName(s),s.area,fdate(s.data),s.responsavel,s.lie,s.lse,s.resultado?.status,s.resultado?.chave,s.resultado?.msg,...allM.map(k=>{const v=s.resultado?.m?.[k];return ok(v)?String(+v.toFixed(6)).replace('.',','):''})].map(q).join(';'));
  download(`msa_estudos_${today()}.csv`,'\ufeff'+[cols.concat(allM).map(q).join(';'),...rows].join('\n'),'text/csv');toast(`${L.length} estudo(s) exportado(s)`,'fa-file-csv')}
function importJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.studies))throw 0;
  confirmBox(`Importar <b>${d.studies.length}</b> estudo(s) e <b>${(d.instruments||[]).length}</b> instrumento(s)? Itens com o mesmo identificador serão atualizados.`,()=>{(d.instruments||[]).forEach(saveInstr);d.studies.forEach(s=>saveStudy(s));if(d.cfg)Object.assign(S.cfg,d.cfg,{cloud:S.cfg.cloud});persist();toast('Backup importado');render()})}catch(x){toast('Arquivo inválido','fa-triangle-exclamation')}};r.readAsText(f);e.target.value=''}

function dataTable(s){const d=s.dados;const c=v=>esc(v===''?'':v);

  if(s.tipo==='lin')return`<table class="dt"><tr><th>Peça</th><th>Ref.</th>${Array.from({length:d.m},(_,j)=>`<th>L${j+1}</th>`).join('')}</tr>${d.v.map((r,i)=>`<tr><td>${i+1}</td><td><b>${c(d.refs[i])}</b></td>${r.map(v=>`<td>${c(v)}</td>`).join('')}</tr>`).join('')}</table>`;

  if(s.tipo==='atr'){const per=s.resultado?.ser?.per||[];return`<table class="dt"><tr><th>Avaliador</th><th>Eficácia</th><th>Perda</th><th>Falso alarme</th><th>Kappa</th></tr>${per.map(p=>`<tr><td>${esc(p.nome)}</td><td>${pct(p.eff)}</td><td>${pct(p.miss)}</td><td>${pct(p.fa)}</td><td>${fmt(p.k,3)}</td></tr>`).join('')}</table>

function printStudies(ids){const L=ids.map(id=>S.studies.find(s=>s.id===id)).filter(Boolean);if(!L.length){toast('Nenhum estudo para imprimir','fa-triangle-exclamation');return}
  toast('Gerando relatório...','fa-print');setTimeout(()=>openWin(L.length===1?L[0].codigo:`Relatórios MSA (${L.length})`,L.map(s=>reportPage(JSON.parse(JSON.stringify(s)))).join('')),30)}
function printSummary(){const L=dashSet().sort((a,b)=>(b.data||'').localeCompare(a.data||''));const c=st=>L.filter(s=>(s.resultado?.status||'Incompleto')===st).length;
  const st=STATUS.map(c);const img=chartImg({c:{type:'bar',data:{labels:STATUS,datasets:[{data:st,backgroundColor:STATUS.map(x=>SCOL[x])}]},options:{plugins:{legend:{display:false}}}}});
  const tk=Object.keys(TYPES);const img2=chartImg({c:{type:'bar',data:{labels:tk.map(t=>TYPES[t].n),datasets:STATUS.map(x=>({label:x,data:tk.map(t=>L.filter(s=>s.tipo===t&&(s.resultado?.status||'Incompleto')===x).length),backgroundColor:SCOL[x]}))},options:{scales:{x:{stacked:true},y:{stacked:true}}}}});
  openWin('Relatório gerencial MSA',`<div class="pg"><div class="hd"><div><small>${esc(S.cfg.empresa)}</small><h1>Relatório gerencial MSA</h1></div><small>${{30:'Últimos 30 dias',90:'Últimos 90 dias',365:'Últimos 12 meses',0:'Todo o período'}[V.dash.periodo]}${V.dash.area?' · '+esc(V.dash.area):''} · ${new Date().toLocaleString('pt-BR')}</small></div>
  <div class="mt"><div><span>Total</span><b>${L.length}</b></div><div><span>Aprovados</span><b style="color:#2E9E4F">${st[0]}</b></div><div><span>Condicionais</span><b style="color:#9A6A00">${st[1]}</b></div><div><span>Reprovados</span><b style="color:#D23B3B">${st[2]}</b></div><div><span>Incompletos</span><b>${st[3]}</b></div></div>
  <div class="charts"><img src="${img}"><img src="${img2}"></div><h3>Estudos</h3><table><tr><th>Código</th><th>Tipo</th><th>Peça / Característica</th><th>Instrumento</th><th>Data</th><th>Responsável</th><th>Resultado</th><th>Status</th></tr>${L.map(s=>`<tr><td><b>${esc(s.codigo)}</b></td><td>${TYPES[s.tipo].n}</td><td>${esc(s.nome)} ${esc(s.caracteristica)}</td><td>${esc(instrName(s))}</td><td>${fdate(s.data)}</td><td>${esc(s.responsavel)}</td><td>${esc(s.resultado?.chave)}</td><td class="${s.resultado?.status}">${s.resultado?.status}</td></tr>`).join('')}</table><div class="ft">MSA Pro</div></div>`)}

/* ---------------- modais ---------------- */
function modal(h){$('#modal').innerHTML=h;$('#ov').classList.add('show')}
function closeModal(){$('#ov').classList.remove('show')}
$('#ov').onclick=e=>{if(e.target.id==='ov')closeModal()};
function confirmBox(msg,yes){modal(`<div class="mh"><h3>Confirmar</h3></div><div class="mb">${msg}</div><div class="mf"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="cYes">Confirmar</button></div>`);$('#cYes').onclick=()=>{closeModal();yes()}}

/* ---------------- início ---------------- */
load();S.studies.forEach(s=>{if(!s.resultado)s.resultado=calc(s)});render();initCloud();
</script>
</body>
</html>
