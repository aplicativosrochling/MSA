   <div class="grid g3"><div class="card"><h3><i class="fas fa-chart-area c-brand"></i>Gráficos</h3><div id="chs"></div></div><div class="card"><h3><i class="fas fa-calculator c-brand"></i>Resultado</h3><div id="res"></div></div></div></div>`;
  const inp=(k,l,t='text',ex='')=>`<div><label class="l">${l}</label><input class="f" data-f="${k}" type="${t}" value="${esc(s[k])}" ${ex}></div>`;
  $('#info').innerHTML=inp('codigo','Código')+inp('nome','Peça / Descrição')+inp('caracteristica','Característica')+
   inp('instrumentoTxt','Instrumento')+
   inp('unidade','Unidade')+inp('lie','LIE (tol. inferior)','text','inputmode="decimal"')+inp('lse','LSE (tol. superior)','text','inputmode="decimal"')+inp('responsavel','Responsável')+inp('padrao','Padrão de referência')+inp('freq','Frequência (meses / evento)')+
   `<div><label class="l">Área / Setor</label><input class="f" data-f="area" list="dlArea" value="${esc(s.area)}"><datalist id="dlArea">${areas().map(a=>`<option>${esc(a)}</option>`).join('')}</datalist></div>`+inp('data','Data','date')+
   `<div><label class="l">Casas decimais deste estudo</label><select class="f" data-f="decimais">${Array.from({length:9},(_,i)=>`<option value="${i}" ${decimalPlaces(s)===i?'selected':''}>${i} ${i===1?'casa':'casas'}</option>`).join('')}</select><small class="legend">Aplica-se aos resultados, relatórios e dados simulados. Medições já digitadas não são arredondadas.</small></div>`+
   `<div style="grid-column:1/-1"><label class="l">Observações / Ações</label><textarea class="f" data-f="obs" rows="2">${esc(s.obs)}</textarea></div>`;
  $$('#info [data-f]').forEach(e=>{const update=()=>{s[e.dataset.f]=e.dataset.f==='decimais'?+e.value:e.value;markDirty();if(['lie','lse','decimais'].includes(e.dataset.f))recalc()};if(e.tagName==='SELECT')e.onchange=update;else e.oninput=update});
  rParams();rGrid();recalc();
}
 function markDirty(){V.dirty=true;const d=$('#dirty');if(d)d.innerHTML='· <b class="c-warn">alterações não salvas</b>'}
function rParams(){const s=V.edit,d=s.dados;const ni=(k,l,mn,mx)=>`<label class="row" style="gap:6px"><span class="l" style="margin:0">${l}</span><input class="f" style="width:74px" type="number" min="${mn}" max="${mx}" value="${d[k]}" onchange="V.edit.dados.${k}=Math.min(${mx},Math.max(${mn},+this.value||${mn}));normalize(V.edit);markDirty();rParams();rGrid();recalc()"></label>`;
  let h='';if(s.tipo==='est')h=ni('n','Tamanho do subgrupo',2,10)+ni('g','Nº subgrupos',2,60)+`<label class="row" style="gap:6px"><span class="l" style="margin:0">Valor de referência</span><input class="f" style="width:110px" value="${esc(d.ref)}" oninput="V.edit.dados.ref=this.value;markDirty()"></label>`;
  if(s.tipo==='bias')h=`<label class="row" style="gap:6px"><span class="l" style="margin:0">Valor de referência</span><input class="f" style="width:120px" inputmode="decimal" value="${esc(d.ref)}" oninput="V.edit.dados.ref=this.value;markDirty();recalc()"></label>`+ni('n','Nº leituras',2,100);
  if(s.tipo==='lin')h=ni('g','Nº peças de referência',5,10)+ni('m','Leituras por peça',2,20);
  if(s.tipo==='rr')h=ni('ops','Operadores',2,3)+ni('parts','Peças',2,10)+ni('trials','Ciclos',2,3);
  if(s.tipo==='atr')h=ni('ops','Avaliadores',2,5)+ni('parts','Peças',5,100)+ni('trials','Ciclos',2,5)+`<span class="legend">Clique nas células para alternar: <b class="c-ok">A = Aceito</b> · <b class="c-bad">R = Reprovado</b> · vazio</span>`;
  $('#params').innerHTML=h}
function cell(path,val){return`<td><input data-p="${path}" value="${esc(val)}" inputmode="decimal" enterkeyhint="next"></td>`}
function rGrid(){const s=V.edit,d=s.dados;let h='';
  if(s.tipo==='est'){h=`<table class="dg"><thead><tr><th>Subgrupo</th><th>Data</th><th>Hora</th>${Array.from({length:d.n},(_,j)=>`<th>x${j+1}</th>`).join('')}<th>X̄</th><th>R</th></tr></thead><tbody>${d.m.map((r,i)=>`<tr><td class="h">${i+1}</td><td><input data-p="dts.${i}" value="${esc((d.dts||[])[i]||'')}" placeholder="dd/mm/aa"></td><td><input data-p="hrs.${i}" value="${esc((d.hrs||[])[i]||'')}" placeholder="hh:mm"></td>${r.map((v,j)=>cell(`m.${i}.${j}`,v)).join('')}<td class="c" id="cx${i}"></td><td class="c" id="cr${i}"></td></tr>`).join('')}</tbody></table>`}
  if(s.tipo==='bias'){h=`<table class="dg"><thead><tr><th>Leitura</th>${d.v.map((_,i)=>`<th>${i+1}</th>`).join('')}</tr></thead><tbody><tr><td class="h">Valor</td>${d.v.map((v,i)=>cell(`v.${i}`,v)).join('')}</tr><tr><td class="h">Bias</td>${d.v.map((_,i)=>`<td class="c" id="bb${i}"></td>`).join('')}</tr></tbody></table>`}
  if(s.tipo==='lin'){h=`<table class="dg"><thead><tr><th>Peça</th><th>Referência</th>${Array.from({length:d.m},(_,j)=>`<th>L${j+1}</th>`).join('')}<th>Bias médio</th></tr></thead><tbody>${d.v.map((r,i)=>`<tr><td class="h">${i+1}</td>${cell(`refs.${i}`,d.refs[i]).replace('<td>','<td style="background:#EEF5FC">')}${r.map((v,j)=>cell(`v.${i}.${j}`,v)).join('')}<td class="c" id="lb${i}"></td></tr>`).join('')}</tbody></table>`}
  if(s.tipo==='rr'){h=`<table class="dg"><thead><tr><th>Operador</th><th>Ciclo</th>${Array.from({length:d.parts},(_,p)=>`<th>Peça ${p+1}</th>`).join('')}<th>Média</th></tr></thead><tbody>`;
    d.v.forEach((o,oi)=>{o.forEach((r,t)=>{h+=`<tr>${t===0?`<td class="h" rowspan="${d.trials+1}"><input data-op="${oi}" value="${esc(d.opNames[oi])}" style="font-weight:700;width:70px"></td>`:''}<td class="h">${t+1}</td>${r.map((v,p)=>cell(`v.${oi}.${t}.${p}`,v)).join('')}<td class="c" id="rm${oi}_${t}"></td></tr>`});
      h+=`<tr><td class="h" style="color:var(--warn)">R</td>${Array.from({length:d.parts},(_,p)=>`<td class="c" id="rr${oi}_${p}" style="background:#FFFBEF"></td>`).join('')}<td class="c" id="rb${oi}" style="background:#FFF4CE"></td></tr>`});
    h+=`<tr><td class="h" colspan="2">Média peça</td>${Array.from({length:d.parts},(_,p)=>`<td class="c" id="pm${p}"></td>`).join('')}<td class="c" id="pmT"></td></tr></tbody></table>`}
  if(s.tipo==='atr'){const oph=d.v.map((o,oi)=>`<th colspan="${d.trials}"><input data-op="${oi}" value="${esc(d.opNames[oi])}" title="Nome do avaliador"></th>`).join('');
    const trh=d.v.map(o=>o.map((_,t)=>`<th>${t+1}</th>`).join('')).join('');
    h=`<table class="dg"><thead><tr><th rowspan="2">Peça</th>${oph}<th rowspan="2">Ref.</th><th rowspan="2">Conc.</th></tr><tr>${trh}</tr></thead><tbody>${d.ref.map((rv2,p)=>`<tr><td class="h">${p+1}</td>${d.v.map((o,oi)=>o.map((r,t)=>tg(`v.${oi}.${t}.${p}`,r[p])).join('')).join('')}${tg('ref.'+p,rv2)}<td class="c" id="ag${p}"></td></tr>`).join('')}</tbody></table>
    <div class="row" style="padding:10px;gap:10px"><button class="btn sm" onclick="fillCol('A')"><i class="fas fa-check c-ok"></i> Referência: tudo A</button><button class="btn sm" onclick="fillCol('R')"><i class="fas fa-xmark c-bad"></i> Referência: tudo R</button><span class="legend">Células: clique para alternar <b class="c-ok">A</b> → <b class="c-bad">R</b> → vazio · A = Aceito (passa) · R = Reprovado (não passa)</span></div>`}
  $('#grid').innerHTML=h;
  $$('#grid input[data-p]').forEach(e=>{e.oninput=()=>{setPath(V.edit.dados,e.dataset.p,e.value);markDirty();recalcSoon()};e.onkeydown=navKey;e.onpaste=pasteGrid});
  $$('#grid input[data-op]').forEach(e=>e.onchange=()=>{V.edit.dados.opNames[+e.dataset.op]=e.value||String.fromCharCode(65+ +e.dataset.op);markDirty();if(s.tipo==='atr')rGrid();recalc()});
  $$('#grid td.tg').forEach(e=>e.onclick=()=>{const cur=getPath(V.edit.dados,e.dataset.p);const nx=cur===''||cur==null?'A':(cur==='A'||cur===1||cur==='1')?'R':'';setPath(V.edit.dados,e.dataset.p,nx);e.className='tg '+(nx===''?'vn':nx==='A'?'v1':'v0');e.textContent=nx===''?'·':nx;markDirty();recalcSoon()});
}
const tg=(p,v)=>{const t=String(v??'');const cls=t==='A'||t==='1'?'v1':(t==='R'||t==='0'?'v0':'vn');const lbl=t==='A'||t==='1'?'A':(t==='R'||t==='0'?'R':'·');return`<td class="tg ${cls}" data-p="${p}">${lbl}</td>`};
function fillCol(v){V.edit.dados.ref=V.edit.dados.ref.map(()=>String(v));markDirty();rGrid();recalc()}
function getPath(o,p){return p.split('.').reduce((a,k)=>a[k],o)}
function setPath(o,p,v){const k=p.split('.');const last=k.pop();k.reduce((a,x)=>a[x],o)[last]=v}
function navKey(e){if(e.key!=='Enter'&&!e.key.startsWith('Arrow'))return;const all=$$('#grid input[data-p]');const i=all.indexOf(e.target);const td=e.target.closest('td'),tr=td.parentNode;
  if(e.key==='Enter'||e.key==='ArrowDown'||e.key==='ArrowUp'){const col=[...tr.children].indexOf(td)-(tr.children.length-[...tr.parentNode.rows[0].children].length);let r=e.key==='ArrowUp'?tr.previousElementSibling:tr.nextElementSibling;
    while(r){const cells=[...r.children];const off=cells.length-[...tr.parentNode.rows[0].children].length;const c=cells[col+off];const inp=c&&c.querySelector('input[data-p]');if(inp){e.preventDefault();inp.focus();inp.select();return}r=e.key==='ArrowUp'?r.previousElementSibling:r.nextElementSibling}
    if(e.key==='Enter'&&all[i+1]){e.preventDefault();all[i+1].focus();all[i+1].select()}}
  else if(e.key==='ArrowRight'&&e.target.selectionStart===e.target.value.length&&all[i+1]){e.preventDefault();all[i+1].focus()}
  else if(e.key==='ArrowLeft'&&e.target.selectionStart===0&&all[i-1]){e.preventDefault();all[i-1].focus()}}
function pasteGrid(e){const txt=(e.clipboardData||window.clipboardData).getData('text');if(!/[\t\n]/.test(txt.trim()))return;e.preventDefault();
  const rows=txt.replace(/\r/g,'').split('\n').filter(r=>r.length).map(r=>r.split('\t'));const td=e.target.closest('td'),tr=td.parentNode;let ci=[...tr.children].indexOf(td);let r=tr,n=0;
  rows.forEach(vals=>{if(!r)return;vals.forEach((v,j)=>{const c=r.children[ci+j];const inp=c&&c.querySelector('input[data-p]');if(inp){inp.value=v.trim();setPath(V.edit.dados,inp.dataset.p,v.trim());n++}});r=r.nextElementSibling;while(r&&!r.querySelector('input[data-p]'))r=r.nextElementSibling});
  markDirty();recalc();toast(`${n} valores colados`,'fa-paste')}
let rt;function recalcSoon(){clearTimeout(rt);rt=setTimeout(recalc,180)}
function recalc(){const s=V.edit,R=calc(s);s.resultado=R;const d=s.dados;
  // valores calculados na grade
  if(s.tipo==='est')d.m.forEach((r,i)=>{const a=r.map(num);const full=a.every(ok);const cx=$('#cx'+i),cr=$('#cr'+i);if(!cx)return;cx.textContent=full?fxd(mean(a),decimalPlaces(s)):'';cr.textContent=full?fxd(rng(a),decimalPlaces(s)):'';const fi=R.ser?d.m.slice(0,i).filter(rr=>rr.map(num).every(ok)).length:-1;cx.classList.toggle('out',!!(full&&R.ser&&R.ser.outX.includes(fi)));cr.classList.toggle('out',!!(full&&R.ser&&R.ser.outR.includes(fi)))});
  if(s.tipo==='bias'){const ref=num(d.ref);d.v.forEach((v,i)=>{const e=$('#bb'+i);if(e)e.textContent=ok(num(v))&&ok(ref)?fmt(num(v)-ref,decimalPlaces(s)):''})}
  if(s.tipo==='lin')d.v.forEach((r,i)=>{const R0=num(d.refs[i]);const e=$('#lb'+i);if(e)e.textContent=ok(R0)?fmt(mean(r.map(num).filter(ok).map(x=>x-R0)),decimalPlaces(s)):''});
  if(s.tipo==='rr'){const uclR=R.ser?.uclR;d.v.forEach((o,oi)=>{o.forEach((r,t)=>{const e=$(`#rm${oi}_${t}`);if(e)e.textContent=fmt(mean(r.map(num)),decimalPlaces(s))});const rs=[];for(let p=0;p<d.parts;p++){const c=o.map(r=>num(r[p]));const e=$(`#rr${oi}_${p}`);const v=c.every(ok)?rng(c):NaN;rs.push(v);if(e){e.textContent=ok(v)?fmt(v,decimalPlaces(s)):'';e.classList.toggle('out',ok(uclR)&&v>uclR)}}const e=$('#rb'+oi);if(e)e.textContent=fmt(mean(rs),decimalPlaces(s))});
    for(let p=0;p<d.parts;p++){const e=$('#pm'+p);if(e)e.textContent=fmt(mean(d.v.flatMap(o=>o.map(r=>num(r[p])))),decimalPlaces(s))}$('#pmT').textContent=fmt(mean(d.v.flat(2).map(num)),decimalPlaces(s))}
  if(s.tipo==='atr')d.ref.forEach((rv,p)=>{const e=$('#ag'+p);if(!e)return;const calls=d.v.flatMap(o=>o.map(r=>r[p]));if(rv===''||calls.some(c=>c===''))e.textContent='';else{const a=calls.every(c=>String(c)===String(rv));e.innerHTML=a?'<span class="c-ok">✔</span>':'<span class="c-bad">✘</span>'}});
  // painel de resultado
  const vc={Aprovado:['bg-ok c-ok','fa-circle-check'],Condicional:['bg-warn c-warn','fa-triangle-exclamation'],Reprovado:['bg-bad c-bad','fa-circle-xmark'],Incompleto:['bg-inc','fa-hourglass-half']}[R.status];
   let extra='';if(s.tipo==='atr'&&R.ser){extra=`<table class="t" style="margin-top:12px;font-size:12.5px"><thead><tr><th>Avaliador</th><th>Eficácia</th><th>Perda</th><th>F. alarme</th><th>Kappa vs ref.</th></tr></thead><tbody>${R.ser.per.map(p=>`<tr><td><b>${esc(p.nome)}</b></td><td class="${p.eff>=S.cfg.effOk?'c-ok':p.eff>=S.cfg.effCond?'c-warn':'c-bad'}">${pct(p.eff,decimalPlaces(s))}</td><td class="${p.miss<=S.cfg.missOk?'c-ok':'c-bad'}">${pct(p.miss,decimalPlaces(s))}</td><td class="${p.fa<=S.cfg.faOk?'c-ok':'c-bad'}">${pct(p.fa,decimalPlaces(s))}</td><td class="${p.k>=S.cfg.kappaOk?'c-ok':p.k>=.4?'c-warn':'c-bad'}">${fmt(p.k,decimalPlaces(s))}</td></tr>`).join('')}</tbody></table>`;
   if(R.ser.pairs&&R.ser.pairs.length)extra+=`<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 4px">Kappa entre avaliadores (tabulação cruzada)</div><table class="t" style="font-size:12.5px"><thead><tr><th></th>${R.ser.per.map(p=>`<th>${esc(p.nome)}</th>`).join('')}</tr></thead><tbody>${R.ser.per.map((a,i2)=>`<tr><td><b>${esc(a.nome)}</b></td>${R.ser.per.map((b,j2)=>{const kk=pairK(R.ser,i2,j2);return`<td class="${i2===j2?'':kk>=S.cfg.kappaOk?'c-ok':kk>=.4?'c-warn':'c-bad'}">${i2===j2?'—':fmt(kk,decimalPlaces(s))}</td>`}).join('')}</tr>`).join('')}</tbody></table>`}
   $('#res').innerHTML=`<div class="verdict ${vc[0]}"><i class="fas ${vc[1]}"></i><div><b>${R.status}</b><small>${esc(R.msg||'')}</small></div></div><div class="res">${Object.entries(R.m||{}).map(([k,v])=>`<div class="m"><div class="k">${k}</div><div class="x">${fmtM(k,v,s)}</div>`).join('')}</div>${extra}<div class="legend" style="margin-top:12px">${criteria(s.tipo)}</div>`;

 function simulate(s,q='good'){
   normalize(s);const d=s.dados,lo=num(s.lie),hi=num(s.lse),T=tol(s),mid=ok(T)?(lo+hi)/2:NaN;
    const digits=decimalPlaces(s),resolution=10**-digits;
    const r=x=>Number.isFinite(x)?x.toFixed(digits):'';
   const offsets=(n,a)=>Array.from({length:n},(_,i)=>n<2?0:((2*i)/(n-1)-1)*a);
   const fail=msg=>{toast(msg,'fa-triangle-exclamation');return false};
   const refFor=()=>{
     const entered=num(d.ref),ref=ok(entered)?entered:mid;

   };
   if(s.tipo==='est'){
     const ref=refFor();if(!ok(ref))return fail('Informe um valor de referência ou limites LIE/LSE válidos antes de simular.');
      const amp=Math.max(ok(T)&&T>0?T*.0005:Math.max(Math.abs(ref),1)*1e-7,resolution);
     const group=[0,1,-1,.35,-.35,.7,-.7,.2,-.2,.55,-.55];
     d.m=d.m.map((row,i)=>row.map((_,j)=>r(ref+group[i%group.length]*amp*.08+offsets(row.length,amp)[j])));
   }
   if(s.tipo==='bias'){
     const ref=refFor();if(!ok(ref))return fail('Informe o valor de referência ou limites LIE/LSE válidos antes de simular.');
      const amp=Math.max(ok(T)&&T>0?T*.0005:Math.max(Math.abs(ref),1)*1e-7,resolution*.55),off=offsets(d.n,amp);
     d.v=d.v.map((_,i)=>r(ref+off[i]));
   }
   if(s.tipo==='lin'){
     const refs=d.refs.map(num),valid=refs.filter(ok);
     if(valid.length>=2&&new Set(valid).size<2)return fail('A linearidade exige pelo menos duas referências diferentes; revise os valores informados.');
     if(valid.length<2&&!ok(T))return fail('Informe ao menos duas referências ou LIE/LSE válidos antes de simular linearidade.');
     const min=valid.length>=2?Math.min(...valid):lo,max=valid.length>=2?Math.max(...valid):hi;
      d.refs=d.refs.map((v,i)=>ok(num(v))?v:(valid.length>=2?r(min+(max-min)*i/(d.g-1)):r(lo+T*i/(d.g-1))));
      const amp=Math.max(ok(T)&&T>0?T*.0005:Math.max(Math.abs(max-min),Math.abs(mean(d.refs.map(num))),1)*1e-7,resolution*.55);
     d.v=d.v.map((row,i)=>{const ref=num(d.refs[i]),off=offsets(row.length,amp);return row.map((_,j)=>r(ref+off[j]))});
   }
   if(s.tipo==='rr'){
     if(!ok(T)||T<=0)return fail('Informe limites LIE e LSE válidos antes de simular R&R variável.');

        const jitter=Math.sin((oi+1)*17+(trial+1)*11+(p+1)*7)*Math.max(T*.0002,resolution*.55);

     })));
   }

     d.ref=d.ref.map((v,i)=>(v==='A'||v==='R')?v:(i%4===3?'R':'A'));

     d.v=d.v.map(o=>o.map(row=>row.map((_,p)=>Math.random()<perr?(d.ref[p]==='A'?'R':'A'):d.ref[p])));
   }
   return s}

  else if(s.tipo==='est'){let rows=R.map(nums).filter(r=>r.length>=2);if(rows.length<2)return impErr('Preciso de pelo menos 2 linhas (subgrupos) com 2 números');

      if(ops.length<2||ops.length>3)return impErr('R&R aceita 2 ou 3 operadores — o arquivo tem '+ops.length);

      if(T<2||T>3)return impErr('R&R aceita 2 ou 3 repetições — o arquivo tem '+T);
      const v=ops.map(()=>Array.from({length:T},()=>Array(pts.length).fill(''))),seen={};
      lg.forEach(r=>{const k=r[0]+'|'+r[1],t=seen[k]=(seen[k]||0)+1;v[ops.indexOf(r[0])][t-1][pts.indexOf(r[1])]=tn(r[r.length-1])});
      d.ops=ops.length;d.parts=pts.length;d.trials=T;d.opNames=ops;d.v=v;msg=ops.length+' operadores × '+pts.length+' peças × '+T+' repetições'}
    else{const rows=R.map(nums).filter(r=>r.length>=2),T=+d.trials||3;if(!rows.length||rows.length%T)return impErr('Formato por linhas: uma linha por operador×ciclo ('+T+' ciclos por operador). Encontrei '+rows.length+' linhas');
      const O=rows.length/T,P=rows[0].length;if(O<2||O>3)return impErr('R&R aceita 2 ou 3 operadores — encontrei '+O);if(P<2||P>10)return impErr('R&R aceita de 2 a 10 peças — encontrei '+P);
      d.ops=O;d.trials=T;d.parts=P;d.v=Array.from({length:O},(_,o)=>rows.slice(o*T,o*T+T).map(r=>padTo(r,P)));msg=O+' operadores × '+P+' peças × '+T+' ciclos'}}
  else if(s.tipo==='atr'){const rows=R.map(r=>r.map(cvA).filter(Boolean)).filter(r=>r.length>=5),T=+d.trials||3;
    if(rows.length<1+T||(rows.length-1)%T)return impErr('Formato: 1ª linha = referência (A/R), depois '+T+' linhas por avaliador. Encontrei '+rows.length+' linhas válidas');
    const O=(rows.length-1)/T,P=rows[0].length;if(O<2||O>5)return impErr('Atributo aceita de 2 a 5 avaliadores — encontrei '+O);
    d.ops=O;d.trials=T;d.parts=P;d.ref=rows[0];d.v=Array.from({length:O},(_,o)=>rows.slice(1+o*T,1+o*T+T).map(r=>padTo(r,P)));msg=O+' avaliadores × '+P+' peças × '+T+' ciclos'}
  normalize(s);markDirty();rParams();rGrid();recalc();closeModal();toast('Importado: '+msg);return true}
const IMPH={rr:'<b>Formato A (exportação de CMM/planilha):</b> colunas <i>Operador; Peça; Repetição; Valor</i>, uma linha por medição.<br><b>Formato B:</b> uma linha por operador×ciclo (na ordem do formulário AIAG), uma coluna por peça.',

function importModal(){const s=V.edit;modal(`<div class="mh"><h3>Importar medições</h3><button class="btn ic" onclick="closeModal()"><i class="fas fa-xmark"></i></button></div><div class="mb">

function impFile(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#impT').value=r.result;toast('Arquivo lido — confira e clique em Importar')};r.readAsText(f)}
function impTpl(){const s=V.edit,d=s.dados;let L=[];
  if(s.tipo==='rr'){L.push(['Operador','Peça','Repetição','Valor']);d.opNames.forEach(o=>{for(let p=1;p<=d.parts;p++)for(let t=1;t<=d.trials;t++)L.push([o,p,t,''])})}
  else if(s.tipo==='atr'){L.push(Array.from({length:d.parts},()=>'A'));d.opNames.forEach(()=>{for(let t=0;t<d.trials;t++)L.push(Array.from({length:d.parts},()=>''))})}
  else if(s.tipo==='est'){for(let g=0;g<d.g;g++)L.push(Array.from({length:d.n},()=>''))}

const TRK={dados:'medições',data:'data',codigo:'código',nome:'peça',caracteristica:'característica',instrumentoId:'instrumento',instrumentoTxt:'instrumento',responsavel:'responsável',lie:'LIE',lse:'LSE',unidade:'unidade',area:'área',obs:'observações',decimais:'casas decimais',revMeses:'periodicidade',revBase:'base da revalidação'};
const ADM=['revMeses','revalidadoPor','revBase','revOrigem'],NOLOG=['atualizadoEm','resultado','hist','aprov','criadoPor','criadoEm'];
function traceLog(s,old){const u=curUser()||'Não identificado',now=new Date().toISOString();s.hist=(s.hist||[]).slice(-59);

  s.hist.push({em:now,por:u,acao:'Alterado',det:[...new Set(ch.map(k=>TRK[k]||k))].join(', ')});

function dataTable(s){const d=s.dados;const c=v=>esc(v===''?'':v);
  if(s.tipo==='est')return`<table class="dt"><tr><th>#</th>${Array.from({length:d.n},(_,j)=>`<th>x${j+1}</th>`).join('')}<th>X̄</th><th>R</th></tr>${d.m.map((r,i)=>`<tr><td>${i+1}</td>${r.map(c).join('<td>').replace(/^/,'<td>')}<td>${fmt(mean(r.map(num)),decimalPlaces(s))}</td><td>${r.map(num).every(ok)?fmt(rng(r.map(num)),decimalPlaces(s)):''}</td></tr>`).join('')}</table>`;
  if(s.tipo==='bias')return`<table class="dt"><tr><th>Leitura</th>${d.v.map((_,i)=>`<th>${i+1}</th>`).join('')}</tr><tr><td>Valor</td>${d.v.map(v=>`<td>${c(v)}</td>`).join('')}</tr></table><div>Valor de referência: <b>${esc(d.ref)}</b></div>`;
  if(s.tipo==='lin')return`<table class="dt"><tr><th>Peça</th><th>Ref.</th>${Array.from({length:d.m},(_,j)=>`<th>L${j+1}</th>`).join('')}</tr>${d.v.map((r,i)=>`<tr><td>${i+1}</td><td><b>${c(d.refs[i])}</b></td>${r.map(v=>`<td>${c(v)}</td>`).join('')}</tr>`).join('')}</table>`;
  if(s.tipo==='rr'){const dp=decimalPlaces(s),f=x=>ok(x)?fxd(x,dp):'',c=v=>{const n=num(v);return v===''||v==null?'':ok(n)?fxd(n,dp):esc(v)},P=d.parts,T=d.trials,uc=s.resultado?.ser?.uclR;
    const V=d.v.map(o=>o.map(r=>r.map(num)));const pm=[],pr=[];
    V.forEach((o,oi)=>{pm[oi]=[];pr[oi]=[];for(let p=0;p<P;p++){const col=o.map(r=>r[p]);pm[oi][p]=mean(col);pr[oi][p]=rng(col)}});
    const pc=Array.from({length:P},(_,p)=>mean(pm.map(o=>o[p]))),Xg=mean(pc),Rp=rng(pc);
    const head=`<thead><tr><th rowspan="2" class="opn0">Op.</th><th rowspan="2">Repetição</th><th colspan="${P}">AMOSTRAS</th><th rowspan="2">Médias</th></tr><tr>${Array.from({length:P},(_,p)=>`<th>${p+1}</th>`).join('')}</tr></thead>`;
    const body=V.map((o,oi)=>{const L=String.fromCharCode(97+oi),Xo=mean(pm[oi]),Ro=mean(pr[oi]);
      const rows=o.map((r,t)=>`<tr>${t?'':`<td class="opn" rowspan="${T+2}"><div class="vt">${esc(d.opNames[oi])}</div></td>`}<td class="rl">${t+1}</td>${r.map((_,p)=>`<td>${c(d.v[oi][t][p])}</td>`).join('')}<td class="mc">${f(mean(r))}</td></tr>`).join('');
      const med=`<tr class="rm"><td class="rl">Média</td>${pm[oi].map(x=>`<td>${f(x)}</td>`).join('')}<td class="mc">X̄<sub>${L}</sub> ${f(Xo)}</td></tr>`;
      const amp=`<tr class="ra"><td class="rl">Amplitude</td>${pr[oi].map(x=>`<td${ok(uc)&&ok(x)&&x>uc?' class="bad"':''}>${f(x)}</td>`).join('')}<td class="mc">R̄<sub>${L}</sub> ${f(Ro)}</td></tr>`;
      return`<tbody class="opg">${rows}${med}${amp}</tbody>`}).join('');
    const foot=`<tbody class="opg"><tr class="rp"><td colspan="2">Média da peça</td>${pc.map(x=>`<td>${f(x)}</td>`).join('')}<td class="mc">X̿ ${f(Xg)}<br>R<sub>p</sub> ${f(Rp)}</td></tr></tbody>`;
    return`<table class="dt rr">${head}${body}${foot}</table>`}
  if(s.tipo==='atr'){const per=s.resultado?.ser?.per||[];return`<table class="dt"><tr><th>Avaliador</th><th>Eficácia</th><th>Perda</th><th>Falso alarme</th><th>Kappa</th></tr>${per.map(p=>`<tr><td>${esc(p.nome)}</td><td>${pct(p.eff,decimalPlaces(s))}</td><td>${pct(p.miss,decimalPlaces(s))}</td><td>${pct(p.fa,decimalPlaces(s))}</td><td>${fmt(p.k,decimalPlaces(s))}</td></tr>`).join('')}</table>
    <table class="dt"><tr><th>Peça</th><th>Ref</th>${d.v.map((o,oi)=>o.map((_,t)=>`<th>${esc(d.opNames[oi])}${t+1}</th>`).join('')).join('')}</tr>${d.ref.map((r,p)=>`<tr><td>${p+1}</td><td><b>${c(r)}</b></td>${d.v.map(o=>o.map(rr=>`<td>${c(rr[p])}</td>`).join('')).join('')}</tr>`).join('')}</table>`}}
function rrCharts(s,R){const X=R.ser,d=s.dados,P=d.parts,dp=decimalPlaces(s),ft=v=>fxd(+v,dp),cols=['#118DFF','#E66C37','#107C10'],lb=Array.from({length:P},(_,i)=>String(i+1));
  const pr=d.v.map(o=>Array.from({length:P},(_,p)=>rng(o.map(r=>num(r[p]))))),bs={maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12}}}},flat=pr.flat();
  const A={type:'line',data:{labels:lb.map(x=>'P'+x),datasets:X.pm.map((o,i)=>({label:d.opNames[i],data:o,borderColor:cols[i],backgroundColor:cols[i],pointRadius:3,tension:.2}))},options:{...bs,scales:{y:{ticks:{callback:ft}}}}};
  const B={type:'bar',data:{labels:lb,datasets:pr.map((o,i)=>({label:d.opNames[i],data:o,backgroundColor:cols[i]}))},options:{...bs,scales:{y:{beginAtZero:true,ticks:{callback:ft}}}}};
  const C={type:'line',data:{labels:flat.map((_,i)=>String(i%P+1)),datasets:[{label:'Amplitude',data:flat,borderColor:'#118DFF',backgroundColor:'#118DFF',pointRadius:2.5,borderWidth:1.5},{label:'LSC',data:flat.map(()=>X.uclR),borderColor:'#D13438',borderDash:[6,4],pointRadius:0,borderWidth:1.5}]},
    options:{maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{boxWidth:12}}},layout:{padding:{bottom:18}},scales:{y:{beginAtZero:true,ticks:{callback:ft}},x:{ticks:{autoSkip:false,maxRotation:0,font:{size:10}}}}},
    plugins:[{id:'opn',afterDraw(ch){const a=ch.chartArea,w=(a.right-a.left)/d.ops,x=ch.ctx;x.save();x.strokeStyle='#C9D6E2';x.setLineDash([3,3]);for(let i=1;i<d.ops;i++){const xx=a.left+w*i;x.beginPath();x.moveTo(xx,a.top);x.lineTo(xx,a.bottom);x.stroke()}x.fillStyle='#252423';x.font="bold 13px 'Segoe UI',Arial";x.textAlign='center';d.opNames.forEach((n,i)=>x.fillText(n,a.left+w*(i+.5),ch.height-3));x.restore()}}]};
  const ft2=v=>fxd(+v,dp+1);[B,C].forEach(c=>c.options.scales.y.ticks.callback=ft2);
  const cb=(t,c,w,h)=>{c.options.layout=c.options.layout||{};c.options.layout.padding=Object.assign({},c.options.layout.padding,{top:40,left:6,right:10});c.plugins=[...(c.plugins||[]),{id:'ban',afterDraw(ch){const x=ch.ctx;x.save();x.fillStyle='#005A9E';x.fillRect(0,0,ch.width,30);x.fillStyle='#fff';x.font="bold 14px 'Segoe UI',Arial";x.textAlign='center';x.textBaseline='middle';x.fillText(t,ch.width/2,15);x.restore()}}];return`<div class="cb"><img src="${chartImg({c},w,h,14)}" alt="${t}"></div>`};
  return`<div class="rch2">${cb('Gráfico das médias por operador',A,760,440)}${cb('Gráfico de amplitudes — superpostas',B,760,440)}</div>${cb('Gráfico de amplitudes — não superpostas (tracejado = LSC R)',C,1500,434).replace('class="cb"','class="cb wide"')}`}
const sigBlock=(s,sig)=>`<div class="sig"><div>Executado por<br><b>${esc(s.responsavel)}</b></div><div>Verificado por${sig&&sig.v?`<br><b>${esc(sig.v)}</b>`:''}</div><div>Aprovado por${sig&&sig.a?`<br><b>${esc(sig.a)}</b>`:s.aprov?`<br><b>${esc(s.aprov.por)}</b><br><small>${fdt(s.aprov.em)}</small>`:''}</div></div>`;
function reportRR(s,R,sig){const m=R.m,X=R.ser,d=s.dados,O=d.ops,P=d.parts,T=d.trials,dp=decimalPlaces(s),f=v=>fsig(v,dp),pc=v=>ok(v)?pct(v,2):'—',i=instrOf(s),C=S.cfg,un=esc(s.unidade||'');
  const adq=(v,a,b)=>!ok(v)?['—','Incompleto']:v<=a?['SISTEMA DE MEDIÇÃO ADEQUADO','Aprovado']:v<=b?['SISTEMA CONDICIONAL','Condicional']:['SISTEMA DE MEDIÇÃO NÃO ADEQUADO','Reprovado'];
  const rv=adq(m['%GRR (VT)'],C.grrOk,C.grrCond),rt=adq(m['%GRR (Tol)'],C.grrOk,C.grrCond),rn=m.ndc>=C.ndcMin?['SISTEMA DE MEDIÇÃO ADEQUADO','Aprovado']:['SISTEMA DE MEDIÇÃO NÃO ADEQUADO','Reprovado'];
  const kv=(K,n)=>K&&ok(+K[n])?fxd(+K[n],4):'—',ns=[2,3,4,5,6,7,8,9,10],hl=(n,u)=>n==u?' class="u"':'';
  const kt=`<table class="cal k"><thead><tr><th>n</th><th>D<sub>4</sub><br><small>rep.</small></th><th>K<sub>1</sub><br><small>rep.</small></th><th>K<sub>2</sub><br><small>oper.</small></th><th>K<sub>3</sub><br><small>peças</small></th></tr></thead><tbody>${ns.map(n=>`<tr><td><b>${n}</b></td><td${hl(n,T)}>${n<=3?kv(D4,n):''}</td><td${hl(n,T)}>${n<=3?kv(K1,n):''}</td><td${hl(n,O)}>${n<=3?kv(K2,n):''}</td><td${hl(n,P)}>${kv(K3,n)}</td></tr>`).join('')}</tbody></table><div class="kn">Destacado: constante utilizada (r = ${T}, o = ${O}, n = ${P}).</div>`;
  const cr=(a,b,v)=>`<tr><td class="sy">${a}</td><td>${b}</td><td class="vl">${v}</td></tr>`;
  const hd=t=>`<div class="hd"><div><small>${esc(C.empresa)}</small><h1>Estudo de Repetibilidade e Reprodutibilidade (R&amp;R)${t}</h1></div><div class="hdr"><b>${esc(s.codigo)}</b><small>Emitido em ${new Date().toLocaleString('pt-BR')}</small></div></div>`;
  const info=`<table class="info"><tr><td>Peça</td><td>${esc(s.nome)||'—'}</td><td>Característica</td><td>${esc(s.caracteristica)||'—'}</td><td>Data</td><td>${fdate(s.data)}</td><td>Área</td><td>${esc(s.area)||'—'}</td></tr><tr><td>Instrumento</td><td>${esc(instrName(s))||'—'}</td><td>Nº série / Resol.</td><td>${esc(i?.serie||'—')}${i?.resolucao?' · '+esc(i.resolucao):''}</td><td>Tolerância</td><td>${esc(s.lie)} – ${esc(s.lse)} ${un}</td><td>Peças · Oper. · Rep.</td><td>${P} · ${O} · ${T}</td></tr></table>`;
  const ban=`<div class="v ${R.status}"><span>RESULTADO: ${R.status.toUpperCase()}</span><span class="vm">${esc(R.msg||'')}</span></div>`;
  const vr=[['%VE','Repetibilidade (equipamento)',m['%EV'],X.EVt],['%VO','Reprodutibilidade (operador)',m['%AV'],X.AVt],['%R&amp;R','Repetib. + Reprodutib.',m['%GRR (VT)'],X.GRRt],['%VP','Variação da peça',m['%PV'],X.PVt]];
  return`<div class="pg land fill">${hd('')}${info}${ban}<h3>Dados de medição <small>(${un||'valores'} · ${dp} ${dp===1?'casa decimal':'casas decimais'})</small></h3><div class="fillT">${dataTable(s)}</div></div>
  <div class="pg land fill3">${hd(' — gráficos')}${info}${rrCharts(s,R)}</div>
  <div class="pg land fill4">${hd(' — cálculos e resultado')}<div class="rrc"><div><table class="cal"><thead><tr><th colspan="3">Cálculos</th></tr></thead><tbody>
  ${cr('R̿','(R̄<sub>a</sub> + R̄<sub>b</sub> + R̄<sub>c</sub>) / nº operadores',f(m['R̄̄']))}${cr('X̄<sub>DIFF</sub>','máx(X̄) − mín(X̄)',f(m['X diff']))}${cr('LSC<sub>R</sub>','R̿ × D<sub>4</sub>',f(m['LSC R']))}
  ${cr('VE','R̿ × K<sub>1</sub> — repetibilidade',f(m.EV))}${cr('VO','√[(X̄<sub>DIFF</sub> × K<sub>2</sub>)² − VE²/(n·r)] — reprodutibilidade',f(m.AV))}${cr('R&amp;R','√(VE² + VO²)',f(m.GRR))}
  ${cr('R<sub>p</sub>','máx(X̄ peça) − mín(X̄ peça)',f(m.Rp))}${cr('VP','R<sub>p</sub> × K<sub>3</sub> — variação da peça',f(m.PV))}${cr('VT','√(R&amp;R² + VP²) — variação total',f(m.TV))}${cr('ndc','1,41 × VP / R&amp;R',ok(m.ndc)?m.ndc:'∞')}</tbody></table></div>
  <div>${kt}</div>
  <div><table class="cal"><thead><tr><th rowspan="2">Variação</th><th>% Var. total</th><th>% Tolerância</th></tr><tr><th class="sm">base 6σ (VT)</th><th class="sm">${esc(String(C.k||6))}σ / (LSE − LIE)</th></tr></thead><tbody>${vr.map(r=>`<tr><td><b>${r[0]}</b><br><small>${r[1]}</small></td><td class="vl">${pc(r[2])}</td><td class="vl">${pc(r[3])}</td></tr>`).join('')}<tr class="nd"><td><b>ndc</b><br><small>nº de categorias distintas</small></td><td class="vl" colspan="2">${ok(m.ndc)?m.ndc:'∞'}</td></tr></tbody></table></div></div>
  <table class="res"><thead><tr><th colspan="3">RESULTADO DA ANÁLISE</th></tr></thead><tbody><tr><td class="rb">Variação total</td><td class="rv">${pc(m['%GRR (VT)'])}</td><td class="${rv[1]}">${rv[0]}</td></tr><tr><td class="rb">Tolerância</td><td class="rv">${pc(m['%GRR (Tol)'])}</td><td class="${rt[1]}">${rt[0]}</td></tr><tr><td class="rb">ndc</td><td class="rv">${ok(m.ndc)?m.ndc:'∞'}</td><td class="${rn[1]}">${rn[0]}</td></tr></tbody></table>
  <div class="crit">${criteria(s.tipo)}</div>${s.obs?`<div class="obs"><b>Observações / ações</b><div>${esc(s.obs).replace(/\n/g,'<br>')}</div></div>`:''}
  ${sigBlock(s,sig)}</div>`}

function estTable(s,R){const X=R.ser,d=s.dados,g=d.g,n=d.n,dp=decimalPlaces(s),f=v=>ok(v)?fxd(v,dp):'',c=v=>esc(v===''?'':v);
  const dts=d.dts||[],hrs=d.hrs||[],hasD=dts.some(v=>String(v).trim()!==''),hasH=hrs.some(v=>String(v).trim()!=='');
  const cls=g<=20?' e10':g<=24?' e9':' e8';
  if(g<=28){const rows=[];
    if(hasD)rows.push(`<tr><th class="lbl">Data</th>${dts.map(v=>`<td class="dh">${c(v)}</td>`).join('')}</tr>`);
    if(hasH)rows.push(`<tr><th class="lbl">Hora</th>${hrs.map(v=>`<td class="dh">${c(v)}</td>`).join('')}</tr>`);
    for(let j=0;j<n;j++)rows.push(`<tr><th class="lbl">Medida ${j+1}</th>${d.m.map(r=>`<td>${c(r[j])}</td>`).join('')}</tr>`);
    rows.push(`<tr><th class="lbl">Média</th>${X.xb.map((v,k)=>`<td class="rm${X.outX.includes(k)?' bad':''}">${f(v)}</td>`).join('')}</tr>`);
    rows.push(`<tr><th class="lbl">Amplitude</th>${X.rr.map((v,k)=>`<td class="ra${X.outR.includes(k)?' bad':''}">${f(v)}</td>`).join('')}</tr>`);
    return`<table class="dt estX${cls}"><thead><tr><th class="lbl">AMOSTRA</th>${Array.from({length:g},(_,k)=>`<th>${k+1}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`}
  const head=`<thead><tr><th>#</th><th>Data</th><th>Hora</th>${Array.from({length:n},(_,j)=>`<th>x${j+1}</th>`).join('')}<th>X̄</th><th>R</th></tr></thead>`;
  const body=d.m.map((r,i)=>`<tr><td class="lbl">${i+1}</td><td class="dh">${c(dts[i])}</td><td class="dh">${c(hrs[i])}</td>${r.map(c).join('<td>').replace(/^/,'<td>')}<td class="rm${X.outX.includes(i)?' bad':''}">${f(X.xb[i])}</td><td class="ra${X.outR.includes(i)?' bad':''}">${f(X.rr[i])}</td></tr>`).join('');
  return`<table class="dt estX e9${g>45?' e8':''}">${head}<tbody>${body}</tbody></table>`}
function reportEst(s,R,sig){const X=R.ser,d=s.dados,n=d.n,g=d.g,dp=decimalPlaces(s),i=instrOf(s),C=S.cfg,un=esc(s.unidade||'');
  const f=v=>ok(v)?fxd(v,dp):'—',dts=d.dts||[],hrs=d.hrs||[],hasDH=dts.concat(hrs).some(v=>String(v).trim()!==''),hasRef=esc(d.ref)!=='';
  const hd=t=>`<div class="hd"><div><small>${esc(C.empresa)}</small><h1>Estudo de Estabilidade${t}</h1></div><div class="hdr"><b>${esc(s.codigo)}</b><small>Emitido em ${new Date().toLocaleString('pt-BR')}</small></div></div>`;
  const esp=(s.lie||s.lse)?`${esc(s.lie)} – ${esc(s.lse)} ${un}`:'—';
  const info=`<table class="info"><tr><td>Part nº</td><td>${esc(s.nome)||'—'}</td><td>Nome do equipamento</td><td>${esc(i?i.descricao:(s.instrumentoTxt||'—'))}</td><td>Valor de referência</td><td>${hasRef?esc(d.ref)+' '+un:'—'}</td></tr>
  <tr><td>Característica</td><td>${esc(s.caracteristica)||'—'}</td><td>Nº do equipamento</td><td>${esc(i?i.codigo:'—')}${i&&i.serie?' · S/N '+esc(i.serie):''}</td><td>Nº de medições</td><td>${n}</td></tr>
  <tr><td>Especificação</td><td>${esp}</td><td>Capacidade / Resolução</td><td>${esc(i&&i.resolucao?i.resolucao:'—')}</td><td>Nº de amostras</td><td>${g}</td></tr>
  <tr><td>Responsável</td><td>${esc(s.responsavel)||'—'}</td><td>Data</td><td>${fdate(s.data)}</td><td>Erro amostral</td><td>5%</td></tr></table>`;
  const ban=`<div class="v ${R.status}"><span>RESULTADO: ${R.status.toUpperCase()}</span><span class="vm">${esc(R.msg||'')}</span></div>`;
  const cr2=(a,b)=>`<tr><td class="sy">${a}</td><td class="vl">${b}</td></tr>`;
  const kt=`<table class="cal"><thead><tr><th colspan="2">Limites de controle</th></tr></thead><tbody>${cr2('X̄̄ — média das médias',f(X.X))}${cr2('R̄ — amplitude média',f(X.R))}${cr2('σ = R̄ / d<sub>2</sub>',f(X.R/d2[n]))}${cr2('LSC X̄ = X̄̄ + A<sub>2</sub>·R̄',f(X.ucl))}${cr2('LIC X̄ = X̄̄ − A<sub>2</sub>·R̄',f(X.lcl))}${cr2('LSC R = D<sub>4</sub>·R̄',f(X.uclR))}${cr2('LIC R = D<sub>3</sub>·R̄',f(X.lclR))}</tbody></table>`;
  const kc=`<table class="cal"><thead><tr><th colspan="2">Constantes e pontos fora (n = ${n})</th></tr></thead><tbody>${cr2('A<sub>2</sub>',fxd(A2[n],4))}${cr2('D<sub>3</sub> / D<sub>4</sub>',fxd(D3[n],3)+' / '+fxd(D4[n],3))}${cr2('d<sub>2</sub>',fxd(d2[n],4))}${cr2('Pontos fora — carta X̄',X.outX.length)}${cr2('Pontos fora — carta R',X.outR.length)}${cr2('Sequência de 7 pontos',`<span class="${X.trend?'bgc':'okc'}">${X.trend?'Sim — investigar':'Não'}</span>`)}</tbody></table>`;
  const vered={Aprovado:'O sistema é adequado quanto à estabilidade',Condicional:esc(R.msg||'Estudo condicional — verificar antes de liberar'),Reprovado:'O sistema não é adequado quanto à estabilidade'}[R.status]||'';
  const ana=`<div class="ana"><div class="at">ANÁLISE DE ESTABILIDADE</div><p>Foram analisadas ${g} amostras de ${n} medições consecutivas ao longo do tempo, com carta X̄ e carta R conforme AIAG MSA 4ª edição${hasRef?', usando peça padrão de valor de referência '+esc(d.ref)+' '+un:''}.</p><p>Pontos fora dos limites: <b>${X.outX.length}</b> na carta X̄ e <b>${X.outR.length}</b> na carta R · sequência de 7+ pontos do mesmo lado da média: <b>${X.trend?'sim':'não'}</b>.</p><p><span class="verd ${R.status}">${vered}</span></p></div>`;
  const cbE=(t,cfg,cls)=>{cfg.options=cfg.options||{};cfg.options.layout=cfg.options.layout||{};cfg.options.layout.padding=Object.assign({},cfg.options.layout.padding,{top:40,left:6,right:10});cfg.plugins=[...(cfg.plugins||[]),{id:'ban',afterDraw(ch){const x=ch.ctx;x.save();x.fillStyle='#005A9E';x.fillRect(0,0,ch.width,30);x.fillStyle='#fff';x.font="bold 14px 'Segoe UI',Arial";x.textAlign='center';x.textBaseline='middle';x.fillText(t,ch.width/2,15);x.restore()}}];return`<div class="cb ${cls}"><img src="${chartImg({c:cfg},760,560,14)}" alt="${esc(t)}"></div>`};
  const cc=chartCfgs(s,R);
  const charts2=cc.length===2?`<div class="rch2">${cbE(cc[0].t+' — médias por amostra',cc[0].c,'t72')}${cbE(cc[1].t+' — amplitudes por amostra',cc[1].c,'t72')}</div>`:cc.map(c2=>cbE(c2.t,c2.c,'wide')).join('');
  return`<div class="pg land fill">${hd('')}${info}${ban}<h3>Amostras medidas <small>· ${g} amostras × ${n} medições · ${dp} ${dp===1?'casa decimal':'casas decimais'}${hasDH?'':' · registre data e hora de cada amostra no editor, se desejar'}</small></h3>${g<=28?`<div class="fillT">${estTable(s,R)}</div>`:estTable(s,R)}
  <div class="rrc estK">${kt}${kc}${ana}</div><div class="crit">${criteria('est')}</div></div>
  <div class="pg land fill2">${hd(' — cartas de controle')}${info}${charts2}${s.obs?`<div class="obs"><b>Observações / ações</b><div>${esc(s.obs).replace(/\n/g,'<br>')}</div></div>`:''}
  ${sigBlock(s,sig)}</div>`}
function reportAtr(s,R,sig){const X=R.ser,d=s.dados,O=d.ops,P=d.parts,T=d.trials,dp=decimalPlaces(s),i=instrOf(s),C=S.cfg,un=esc(s.unidade||'');
  const fk=v=>ok(v)?fxd(+v,4):'—',fn=v=>ok(v)?(+v).toLocaleString('pt-BR',{maximumFractionDigits:2}):'—';
  const kc=v=>!ok(v)?'':v>=C.kappaOk?'okc':v>=.4?'wrc':'bgc';
  const hd=t=>`<div class="hd"><div><small>${esc(C.empresa)}</small><h1>Estudo de Atributos — Análise de Riscos (R&amp;R Atributo)${t}</h1></div><div class="hdr"><b>${esc(s.codigo)}</b><small>Emitido em ${new Date().toLocaleString('pt-BR')}</small></div></div>`;
  const info=`<table class="info"><tr><td>Part Number</td><td>${esc(s.nome)||'—'}</td><td>Características</td><td>${esc(s.caracteristica)||'—'}</td><td>Tolerância</td><td>${esc(s.lie)||'—'} – ${esc(s.lse)||'—'} ${un}</td><td>Data</td><td>${fdate(s.data)}</td></tr><tr><td>Equipamento</td><td>${esc(i?i.descricao:(s.instrumentoTxt||'—'))}</td><td>TAG / Código</td><td>${esc(i?i.codigo:(s.instrumentoTxt||'—'))}</td><td>Modelo</td><td>Passa / Não Passa (A/R)</td><td>Responsável</td><td>${esc(s.responsavel)||'—'}</td></tr></table>`;
  const ban=`<div class="v ${R.status}"><span>RESULTADO: ${R.status.toUpperCase()}</span><span class="vm">${esc(R.msg||'')}</span></div>`;
  const cell=v=>v==='A'?'<td class="ok">A</td>':v==='R'?'<td class="nok">R</td>':'<td>·</td>';
  const rcell=v=>v==='A'?'<td class="ok"><b>A</b></td>':v==='R'?'<td class="nok"><b>R</b></td>':'<td>·</td>';
  const acell=p=>{const cs=d.v.flatMap(o=>o.map(r=>r[p]));if(d.ref[p]===''||cs.some(c=>c===''))return'<td></td>';return cs.every(c=>c===d.ref[p])?'<td class="ok">✔</td>':'<td class="nok">✘</td>'};
  const thA=`<thead><tr><th rowspan="2" style="width:24px">Peça</th>${d.opNames.map(n=>`<th class="op" colspan="${T}">${esc(n)}</th>`).join('')}<th rowspan="2">Ref.</th><th rowspan="2" style="width:26px">Conc.</th></tr><tr>${Array.from({length:O},()=>Array.from({length:T},(_,t)=>`<th>${t+1}</th>`).join('')).join('')}</tr></thead>`;
  const rows=(a,b)=>Array.from({length:b-a},(_,k)=>{const p=a+k;return`<tr><td>${p+1}</td>${d.v.map(o=>o.map(r=>cell(r[p])).join('')).join('')}${rcell(d.ref[p])}${acell(p)}</tr>`}).join('');
  const half=Math.ceil(P/2);
  const rowsPer=P<=26?P:half;
  const fcls=rowsPer<=13?'f10':rowsPer<=17?'f9':rowsPer<=21?'f8':rowsPer<=26?'f7':rowsPer<=30?'f6':'';
  const fill=rowsPer>=8&&rowsPer<=26?' fill':'';
  const tab=(a,b)=>`<table class="dt a${fcls?' '+fcls:''}">${thA}<tbody>${rows(a,b)}</tbody></table>`;
  const grid=P<=26?`<div class="dgA one">${tab(0,P)}</div>`:`<div class="dgA">${tab(0,half)}${tab(half,P)}</div>`;
  const xtT=(t,ct)=>`<div class="xt"><div class="tits">${t}</div><table><thead><tr><th colspan="2"></th><th>R</th><th>A</th><th>Total</th><th></th></tr></thead><tbody><tr><td class="lb" rowspan="2">R</td><td class="ob">Obs.</td><td>${fn(ct.RR)}</td><td>${fn(ct.RA)}</td><td><b>${fn(ct.totR)}</b></td><td class="kv" rowspan="2">Po ${fk(ct.po)}</td></tr><tr><td class="ob">Esp.</td><td class="esp">${fn(ct.eRR)}</td><td class="esp">${fn(ct.eRA)}</td><td></td></tr><tr><td class="lb" rowspan="2">A</td><td class="ob">Obs.</td><td>${fn(ct.AR)}</td><td>${fn(ct.AA)}</td><td><b>${fn(ct.totA)}</b></td><td class="kv" rowspan="2">Pe ${fk(ct.pe)}</td></tr><tr><td class="ob">Esp.</td><td class="esp">${fn(ct.eAR)}</td><td class="esp">${fn(ct.eAA)}</td><td></td></tr><tr class="tt"><td class="lb">Total</td><td></td><td>${fn(ct.colR)}</td><td>${fn(ct.colA)}</td><td><b>${fn(ct.n)}</b></td><td class="kv">κ ${fk(ct.k)}</td></tr></tbody></table></div>`;
  const pairBlocks=(X.pairs||[]).map(p=>xtT(`Avaliador ${esc(p.a)} × ${esc(p.b)}`,p)).join('');
  const refBlocks=(X.refs||[]).map(r=>xtT(`Avaliador ${esc(r.a)} × Referência`,r)).join('');
  const kMat=`<table class="cal k km"><thead><tr><th>Kappa</th>${d.opNames.map(n=>`<th>${esc(n)}</th>`).join('')}<th>Ref.</th></tr></thead><tbody>${d.opNames.map((n,i2)=>`<tr><td class="lb"><b>${esc(n)}</b></td>${d.opNames.map((m,j2)=>`<td class="${i2===j2?'':kc(pairK(X,i2,j2))}">${i2===j2?'—':fk(pairK(X,i2,j2))}</td>`).join('')}<td class="${kc(X.per[i2].k)}">${fk(X.per[i2].k)}</td></tr>`).join('')}</tbody></table><div class="kn">Kappa de Cohen: ≥ ${fk(C.kappaOk)} boa concordância · 0,40–${fk(C.kappaOk)} moderada · &lt; 0,40 insuficiente.</div>`;
  const efT=`<table class="dt ef"><thead><tr><th rowspan="2">Avaliador</th><th colspan="6">Concordância com a referência — nº de peças (100% dos ciclos)</th><th colspan="4">Métricas por avaliador</th></tr><tr><th>100% acerto<br>Bom (A/A)</th><th>100% perda<br>(ref. R → A)</th><th>100% falso alarme<br>(ref. A → R)</th><th>Misto</th><th>100% acerto<br>Ruim (R/R)</th><th>100% acerto<br>Bom + Ruim</th><th>Eficácia</th><th>Taxa de perda</th><th>Falso alarme</th><th>Kappa</th></tr></thead><tbody>${X.per.map(p=>`<tr><td class="lb">${esc(p.nome)}</td><td>${p.matchGood}</td><td>${p.missed}</td><td>${p.faParts}</td><td>${p.mixed}</td><td>${p.matchBad}</td><td><b>${p.matchGood+p.matchBad}</b></td><td class="${p.eff>=C.effOk?'okc':p.eff>=C.effCond?'wrc':'bgc'}">${pct(p.eff,2)}</td><td class="${p.miss<=C.missOk?'okc':'bgc'}">${pct(p.miss,2)}</td><td class="${p.fa<=C.faOk?'okc':'bgc'}">${pct(p.fa,2)}</td><td class="${kc(p.k)}">${fk(p.k)}</td></tr>`).join('')}</tbody></table>`;
  const minPairK=(X.pairs||[]).length?Math.min(...X.pairs.map(x=>x.k)):NaN;
  const concorda=ok(minPairK)?minPairK>=C.kappaOk:true;
  const verd={Aprovado:'SISTEMA DE MEDIÇÃO ADEQUADO',Condicional:'SISTEMA DE MEDIÇÃO CONDICIONAL — usar com restrições',Reprovado:'SISTEMA DE MEDIÇÃO NÃO ADEQUADO'}[R.status]||R.status;
  const ana=`<div class="ana"><div class="at">ANÁLISE</div><p>${concorda?`Existe boa concordância entre os avaliadores (Kappa mínimo entre avaliadores ${fk(minPairK)}).`:`A concordância entre avaliadores é insuficiente (Kappa mínimo ${fk(minPairK)} &lt; ${fk(C.kappaOk)}) — treinar os avaliadores e repetir o estudo.`}</p><p>Eficácia do sistema (todos os avaliadores corretos em todos os ciclos): <b>${pct(X.sysEff,2)}</b> — ${X.allAgree} de ${P} peças.</p><p><span class="verd ${R.status}">${verd}</span></p></div>`;
  return`<div class="pg land${fill}">${hd('')}${info}${ban}<h3>Resultados das avaliações <small>· A = Aceito (passa) · R = Reprovado (não passa) · Ref. = valor de referência · ✔ = 100% de concordância com a referência</small></h3>${grid}</div>
  <div class="pg land at2">${hd(' — tabulação cruzada e resultado')}${info}${ban}
  <h3>Tabulação cruzada <small>· avaliador × avaliador e avaliador × referência — observado e esperado por ciclo de avaliação (n = ${P*T} comparações)</small></h3><div class="xts">${pairBlocks}${refBlocks}</div>
  <div class="ef2"><div><h3 style="margin-top:2px">Eficácia e concordância <small>· conforme planilha de análise de atributos</small></h3>${efT}</div><div><h3 style="margin-top:2px">Matriz de Kappa</h3>${kMat}</div></div>
  ${ana}<div class="crit">${criteria(s.tipo)}</div>${s.obs?`<div class="obs"><b>Observações / ações</b><div>${esc(s.obs).replace(/\n/g,'<br>')}</div></div>`:''}
  ${sigBlock(s,sig)}</div>`}
function reportPage(s,sig){const R=calc(s);s.resultado=R;if(s.tipo==='rr'&&R.ser)return reportRR(s,R,sig);if(s.tipo==='atr'&&R.ser)return reportAtr(s,R,sig);if(s.tipo==='est'&&R.ser)return reportEst(s,R,sig);const cc=chartCfgs(s,R),one=cc.length===1;const imgs=cc.map(c=>`<div><div style="font-weight:700;font-size:11.5px;margin-bottom:3px">${c.t}</div><img src="${one?chartImg(c,900,380,13):chartImg(c,520,400,15)}"></div>`).join('');const i=instrOf(s);
  return`<div class="pg"><div class="hd"><div><small>${esc(S.cfg.empresa)}</small><h1>Relatório MSA — ${TYPES[s.tipo].n}</h1></div><div style="text-align:right"><b style="font-size:14px">${esc(s.codigo)}</b><br><small>Emitido em ${new Date().toLocaleString('pt-BR')}</small></div></div>
  <table class="info"><tr><td>Peça</td><td>${esc(s.nome)}</td><td>Característica</td><td>${esc(s.caracteristica)}</td><td>Data</td><td>${fdate(s.data)}</td></tr><tr><td>Instrumento</td><td>${esc(instrName(s))}</td><td>Nº série / Resolução</td><td>${esc(i?.serie||'')} ${i?.resolucao?'· '+esc(i.resolucao):''}</td><td>Área</td><td>${esc(s.area)}</td></tr><tr><td>Tolerância</td><td>${esc(s.lie)} — ${esc(s.lse)} ${esc(s.unidade)}</td><td>Responsável</td><td>${esc(s.responsavel)}</td><td>Calibração</td><td>${i?fdate(i.proxCal):'—'}</td></tr></table>
  <div class="v ${R.status}">RESULTADO: ${R.status.toUpperCase()} — ${esc(R.msg||'')}</div><div class="legend">Precisão exibida neste estudo: ${decimalPlaces(s)} ${decimalPlaces(s)===1?'casa decimal':'casas decimais'}.</div><div class="mt">${Object.entries(R.m||{}).map(([k,v])=>`<div><span>${k}</span><b>${fmtM(k,v,s)}</b></div>`).join('')}</div>
  ${imgs?`<div class="charts">${imgs}</div>`:''}<h3>Dados de medição</h3>${dataTable(s).replace(/<table class="dt"><tr>(.*?)<\/tr>/g,'<table class="dt"><thead><tr>$1</tr></thead>')}<div class="crit">${criteria(s.tipo)}</div>${s.obs?`<h3>Observações / ações</h3><div class="obs">${esc(s.obs).replace(/\n/g,'<br>')}</div>`:''}
  ${sigBlock(s,sig)}<div class="ft">MSA Pro · Metodologia AIAG MSA 4ª edição</div></div>`}
function openWin(title,body){const w=window.open('','_blank');if(!w){toast('Permita pop-ups para imprimir','fa-triangle-exclamation');return}
  w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(title)}</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><style>${RPT_CSS}</style></head><body><div class="np"><button onclick="print()">🖨 Imprimir / Salvar PDF</button></div>${body}<script>window.onload=()=>{(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(()=>print(),400))}<\/script></body></html>`);w.document.close()}
function printStudies(ids){const L=ids.map(id=>S.studies.find(s=>s.id===id)).filter(Boolean);if(!L.length){toast('Nenhum estudo para imprimir','fa-triangle-exclamation');return}
  modal(`<div class="mh"><h3>Assinaturas do relatório</h3><button class="btn ic" onclick="closeModal()"><i class="fas fa-xmark"></i></button></div><div class="mb">
  <label class="l">Verificado por</label><input class="f" id="sigV" value="${esc(S.cfg.verificadoPor||'')}" placeholder="Nome de quem verificou" onkeydown="if(event.key==='Enter')document.getElementById('sigGo').click()">
  <label class="l" style="margin-top:10px">Aprovado por</label><input class="f" id="sigA" value="${esc(S.cfg.aprovadoPor||'')}" placeholder="Nome de quem aprovou" onkeydown="if(event.key==='Enter')document.getElementById('sigGo').click()">
  <small class="legend" style="display:block;margin-top:10px">Os nomes entram no bloco de assinaturas de todos os estudos impressos e ficam salvos para as próximas impressões. Deixe em branco para imprimir somente as linhas.</small></div>
  <div class="mf"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="sigGo"><i class="fas fa-print"></i>Imprimir ${L.length>1?L.length+' estudos':'estudo'}</button></div>`);
  $('#sigGo').onclick=()=>{S.cfg.verificadoPor=document.getElementById('sigV').value.trim();S.cfg.aprovadoPor=document.getElementById('sigA').value.trim();persist();const sig={v:S.cfg.verificadoPor,a:S.cfg.aprovadoPor};closeModal();toast('Gerando relatório...','fa-print');setTimeout(()=>openWin(L.length===1?L[0].codigo:`Relatórios MSA (${L.length})`,L.map(s=>reportPage(JSON.parse(JSON.stringify(s)),sig)).join('')),30)};
  setTimeout(()=>{const el=document.getElementById('sigV');if(el)el.focus()},60)}
function printSummary(){const L=dashSet().sort((a,b)=>(b.data||'').localeCompare(a.data||''));const c=st=>L.filter(s=>(s.resultado?.status||'Incompleto')===st).length;
  const st=STATUS.map(c);const img=chartImg({c:{type:'bar',data:{labels:STATUS,datasets:[{data:st,backgroundColor:STATUS.map(x=>SCOL[x])}]},options:{plugins:{legend:{display:false}}}}});
  const tk=Object.keys(TYPES);const img2=chartImg({c:{type:'bar',data:{labels:tk.map(t=>TYPES[t].n),datasets:STATUS.map(x=>({label:x,data:tk.map(t=>L.filter(s=>s.tipo===t&&(s.resultado?.status||'Incompleto')===x).length),backgroundColor:SCOL[x]}))},options:{scales:{x:{stacked:true},y:{stacked:true}}}}});
  openWin('Relatório gerencial MSA',`<div class="pg"><div class="hd"><div><small>${esc(S.cfg.empresa)}</small><h1>Relatório gerencial MSA</h1></div><small>${{30:'Últimos 30 dias',90:'Últimos 90 dias',365:'Últimos 12 meses',0:'Todo o período'}[V.dash.periodo]}${V.dash.area?' · '+esc(V.dash.area):''} · ${new Date().toLocaleString('pt-BR')}</small></div>
  <div class="mt"><div><span>Total</span><b>${L.length}</b></div><div><span>Aprovados</span><b style="color:#107C10">${st[0]}</b></div><div><span>Condicionais</span><b style="color:#8A6B00">${st[1]}</b></div><div><span>Reprovados</span><b style="color:#D13438">${st[2]}</b></div><div><span>Incompletos</span><b>${st[3]}</b></div></div>
   <div class="charts"><img src="${img}"><img src="${img2}"></div><h3>Estudos</h3><table><thead><tr><th>Código</th><th>Tipo</th><th>Peça / Característica</th><th>Instrumento</th><th>Data</th><th>Responsável</th><th>Resultado</th><th>Status</th></tr></thead>${L.map(s=>`<tr><td><b>${esc(s.codigo)}</b></td><td>${TYPES[s.tipo].n}</td><td>${esc(s.nome)} ${esc(s.caracteristica)}</td><td>${esc(instrName(s))}</td><td>${fdate(s.data)}</td><td>${esc(s.responsavel)}</td><td>${esc(s.resultado?.chave)}</td><td class="${s.resultado?.status}">${s.resultado?.status}</td></tr>`).join('')}</table><div class="ft">MSA Pro</div></div>`)}

/* ---------------- modais ---------------- */
function modal(h){$('#modal').innerHTML=h;$('#ov').classList.add('show')}
function closeModal(){$('#ov').classList.remove('show')}
$('#ov').onclick=e=>{if(e.target.id==='ov')closeModal()};
function confirmBox(msg,yes){modal(`<div class="mh"><h3>Confirmar</h3></div><div class="mb">${msg}</div><div class="mf"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="cYes">Confirmar</button></div>`);$('#cYes').onclick=()=>{closeModal();yes()}}

/* ---------------- início ---------------- */
load();S.studies.forEach(s=>{if(!s.resultado||s.tipo==='atr')s.resultado=calc(s)});migrateAll(false);render();initCloud();
/* pop-up automático de criar os 28 estudos removido; use Procedimento > Criar estudos */
</script>
<script>
(function(){var mode='auto';try{mode=localStorage.getItem('msa-theme')||'auto'}catch(e){}
function day(){var h=new Date().getHours();return h>=6&&h<18}
function apply(re){var t=mode==='auto'?(day()?'light':'dark'):mode,r=document.documentElement,ch=r.getAttribute('data-theme')!==t;r.setAttribute('data-theme',t);
 var l=document.getElementById('thmL');if(l)l.innerHTML=(t==='light'?'☀ Modo dia':'☾ Modo noite')+'<small>'+(mode==='auto'?'automático · dia 06h–18h':'escolha manual')+'</small>';
 document.querySelectorAll('.thm .sg button').forEach(function(b){b.classList.toggle('on',b.dataset.m===mode)});
 if(re&&ch&&typeof render==='function'){try{render()}catch(e){}}}
document.querySelectorAll('.thm .sg button').forEach(function(b){b.onclick=function(){mode=b.dataset.m;try{localStorage.setItem('msa-theme',mode)}catch(e){}apply(true)}});
setInterval(function(){if(mode==='auto')apply(true)},30000);apply(false);showUser()})();
</script>
