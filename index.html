<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSA Pro · Precision Lab — Análise de Sistemas de Medição</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script>(function(){var m="auto";try{m=localStorage.getItem("msa-theme")||"auto"}catch(e){}var h=new Date().getHours();document.documentElement.setAttribute("data-theme",m==="auto"?(h>=6&&h<18?"light":"dark"):m)})()</script>
<style>
/* ============================================================
   MSA PRO · PRECISION LAB — Design System v19
   Inspiração: Linear · Vercel · Stripe (quiet chrome, 1 accent,
   dark-first, números tabulares, alta densidade)
   ============================================================ */
:root{
  --bg:#F1F3F8;--bg2:#E8ECF4;--bg3:#F6F8FC;--bd2:#C7D0E2;--card:#FFFFFF;
  --brand:#165A9C;--brand-d:#0E4576;--brand-l:#4E8FCB;--brand-solid:#165A9C;--brand-t:#EEF4FA;
  --text:#0F1728;--muted:#5D6B87;--border:#E2E7F1;--ring:rgba(22,90,156,.16);
  --ok:#079455;--ok-bg:#E2F5EB;--warn:#B54708;--warn-bg:#FCF0E1;--bad:#D92D20;--bad-bg:#FDECEB;
  --inc:#5D6B87;--inc-bg:#E8ECF4;
  --r:12px;--rs:10px;
  --sh:0 1px 2px rgba(15,23,40,.05),0 2px 6px rgba(15,23,40,.05);
  --sh2:0 12px 32px -8px rgba(15,23,40,.16),0 2px 6px rgba(15,23,40,.06);
  --side:#0B1D32;--side2:#0F2740;
  --toast:#0F1728;--dot:rgba(15,23,40,.05);
  color-scheme:light}
:root[data-theme="dark"]{
  --bg:#0A0D13;--bg2:#131722;--bg3:#0D1119;--bd2:#2C3547;--card:#11151E;
  --brand:#7FB2E0;--brand-d:#B7D4EE;--brand-l:#4E8FCB;--brand-solid:#2F8DFC;--brand-t:rgba(47,141,252,.17);
  --text:#E7EBF4;--muted:#8C97AE;--border:#1F2632;--ring:rgba(78,143,203,.26);
  --ok:#2FD08C;--ok-bg:rgba(18,183,106,.15);--warn:#FDB022;--warn-bg:rgba(247,144,9,.15);--bad:#FF6E63;--bad-bg:rgba(240,68,56,.15);
  --inc:#8C97AE;--inc-bg:rgba(140,151,174,.14);
  --sh:0 1px 2px rgba(0,0,0,.42),0 2px 8px rgba(0,0,0,.30);
  --sh2:0 16px 40px -8px rgba(0,0,0,.60),0 2px 8px rgba(0,0,0,.40);
  --toast:#1C2332;--dot:rgba(148,163,184,.055);
  color-scheme:dark}
body,.card,.side,.btn,.search,select.f,input.f,textarea.f,.tabs,.tab,.chip,.tw,.m{transition:background-color .35s,color .35s,border-color .35s}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{letter-spacing:-.02em;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--brand-solid);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:99px;border:2.5px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);border:2.5px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
button:focus-visible,.chip:focus-visible,.tab:focus-visible,.type:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}
input[type="checkbox"],input[type="radio"]{accent-color:var(--brand-solid);width:15px;height:15px;cursor:pointer}

/* ---------- Estrutura ---------- */
.app{display:flex;min-height:100vh}

/* ---------- Sidebar Onyx (sempre escura) ---------- */
.side{width:256px;flex-shrink:0;background:linear-gradient(180deg,var(--side) 0%,var(--side2) 100%);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px 16px;overflow-y:auto}
.side::-webkit-scrollbar{width:6px}
.side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border:none}
.logo{display:flex;align-items:center;gap:12px;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px}
.logo .ic{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#2F8DFC 0%,#1E6FBE 55%,#165A9C 115%);display:grid;place-items:center;box-shadow:0 4px 16px rgba(47,141,252,.5),inset 0 1px 0 rgba(255,255,255,.28);flex-shrink:0}
.logo .ic svg{width:24px;height:24px;display:block}
.logo b{font-family:'Space Grotesk','Inter',sans-serif;font-size:17.5px;font-weight:700;display:block;letter-spacing:.02em;color:#fff;line-height:1.15}
.logo small{color:#76819B;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.nav-s{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#5D6880;padding:15px 10px 7px;font-weight:700}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;cursor:pointer;color:#9AA4BC;font-weight:600;font-size:13.5px;transition:all .15s ease;border:0;background:none;width:100%;text-align:left;position:relative}
.nav i{width:18px;text-align:center;font-size:14px;transition:.15s}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.nav.on{background:linear-gradient(90deg,rgba(47,141,252,.24),rgba(47,141,252,.05));color:#fff}
.nav.on i{color:#7FB2E0}
.nav.on:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:99px;background:linear-gradient(180deg,#7FB2E0,#1E6FBE);box-shadow:0 0 12px rgba(47,141,252,.9)}
.nav .cnt{margin-left:auto;font-size:10.5px;background:rgba(255,255,255,.12);padding:2px 8px;border-radius:99px;font-variant-numeric:tabular-nums;font-weight:700}
.nav.on .cnt{background:var(--brand-solid);color:#fff;box-shadow:0 0 14px rgba(47,141,252,.55)}
.thm{margin:auto 0 10px;padding:12px;border-radius:14px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08)}
.thm .tl{margin-bottom:8px;font-weight:600;font-size:11.5px;color:#B9C2D8}
.thm .tl small{display:block;font-weight:500;opacity:.62;font-size:10px;margin-top:2px}
.thm .sg{display:flex;background:rgba(255,255,255,.08);border-radius:9px;padding:3px;gap:2px}
.thm .sg button{flex:1;border:0;background:none;color:#AEB8CF;font-size:11.5px;padding:5.5px 4px;border-radius:7px;cursor:pointer;font-weight:600;transition:.15s}
.thm .sg button:hover{color:#fff}
.thm .sg button.on{background:#fff;color:#0B0E16;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.side-foot{margin-top:0;font-size:11.5px;color:#8B93A7;padding:10px 12px;border-top:1px solid rgba(255,255,255,.07);border-radius:10px;line-height:1.5;transition:.15s}
.side-foot:hover{background:rgba(255,255,255,.05);color:#C6CEDF}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#5D6880;flex-shrink:0}
.dot.on{background:#2FD08C;box-shadow:0 0 0 3px rgba(47,208,140,.22)}

/* ---------- Área principal ---------- */
.main{flex:1;min-width:0;padding:26px 30px 48px;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-family:'Space Grotesk','Inter',sans-serif;font-size:25px;color:var(--text)}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.top .sp{flex:1}
.search{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--bd2);border-radius:10px;padding:8px 13px;min-width:250px;box-shadow:var(--sh)}
.search input{border:0;outline:0;flex:1;background:none;font-size:13.5px;min-width:120px}
.search:focus-within{border-color:var(--brand-solid);box-shadow:0 0 0 3px var(--ring)}

/* ---------- Botões ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--card);padding:8.5px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px;transition:all .16s ease;white-space:nowrap;color:var(--text);box-shadow:var(--sh)}
.btn i{font-size:12.5px;opacity:.85}
.btn:hover{border-color:var(--bd2);background:var(--bg3);transform:translateY(-1px);box-shadow:var(--sh2)}
.btn:active{transform:translateY(0);box-shadow:var(--sh)}
.btn.pri{background:linear-gradient(180deg,#1E6FBE,#165A9C);border-color:transparent;color:#fff;box-shadow:0 2px 10px -2px rgba(22,90,156,.55),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.pri i{opacity:1}
.btn.pri:hover{background:linear-gradient(180deg,#2377C9,#0E4576);border-color:transparent;color:#fff;box-shadow:0 8px 20px -4px rgba(22,90,156,.6),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.dan{color:var(--bad)}
.btn.dan:hover{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn.ic{padding:8px 9.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none}
.mbtn{display:none}

/* ---------- Cards / KPIs ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card h3{font-size:14.5px;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.card h3 .hint{margin-left:auto;font:500 11px 'Inter',sans-serif;color:var(--muted)}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(175px,1fr))}
.kpi{cursor:pointer;position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s}
.kpi:hover{transform:translateY(-3px);border-color:var(--brand-l);box-shadow:var(--sh2)}
.kpi:after{content:"";position:absolute;top:0;left:0;right:0;height:2.5px;background:linear-gradient(90deg,#2F8DFC,#165A9C);opacity:0;transition:opacity .2s}
.kpi:hover:after{opacity:1}
.kpi .lb{font-size:11px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:9px;text-transform:uppercase;letter-spacing:.06em}
.kpi .lb i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:13px}
.kpi .v{font:700 29px 'Space Grotesk','Inter',sans-serif;margin-top:10px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted);margin-top:3px}
.kpi .bar{height:4px;border-radius:99px;background:var(--inc-bg);margin-top:12px;overflow:hidden}
.kpi .bar span{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.16,1,.3,1)}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}.c-brand{color:var(--brand)}
.bg-ok{background:var(--ok-bg);color:var(--ok)}.bg-warn{background:var(--warn-bg);color:var(--warn)}
.bg-bad{background:var(--bad-bg);color:var(--bad)}.bg-brand{background:var(--brand-t);color:var(--brand)}
.bg-inc{background:var(--inc-bg);color:var(--inc)}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.g3{grid-template-columns:2fr 1fr}
.chart{position:relative;height:260px}

/* ---------- Badges / tags ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3.5px 11px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge i{font-size:10px}
.b-Aprovado{background:var(--ok-bg);color:var(--ok)}
.b-Condicional{background:var(--warn-bg);color:var(--warn)}
.b-Reprovado{background:var(--bad-bg);color:var(--bad)}
.b-Incompleto{background:var(--inc-bg);color:var(--inc)}
.tag{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--brand-t);color:var(--brand);font-weight:600;display:inline-flex;align-items:center;gap:5px}
.tag i{font-size:10px}

/* ---------- Tabelas ---------- */
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:1;cursor:pointer;user-select:none;font-weight:700;white-space:nowrap}
table.t td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
table.t tr.cl:hover td{background:var(--brand-t);cursor:pointer}
.tw{overflow:auto;border:1px solid var(--border);border-radius:var(--rs);background:var(--card)}

/* ---------- Chips de filtro ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.chip{padding:6px 13px;border-radius:99px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);transition:.15s;display:inline-flex;align-items:center}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.on{background:var(--brand-solid);color:#fff;border-color:var(--brand-solid);box-shadow:0 2px 10px -2px rgba(22,90,156,.5)}
.chip .dot{margin-right:6px}

/* ---------- Formulários ---------- */
select.f,input.f,textarea.f{border:1px solid var(--bd2);border-radius:10px;padding:8.5px 12px;background:var(--card);outline:0;width:100%;font-size:13.5px}
select.f:focus,input.f:focus,textarea.f:focus{border-color:var(--brand-solid);box-shadow:0 0 0 3px var(--ring)}
label.l{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.07em}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.empty{text-align:center;color:var(--muted);padding:44px 12px;border:1.5px dashed var(--bd2);border-radius:var(--r);background:var(--bg3)}
.empty i{font-size:30px;opacity:.4;display:block;margin-bottom:10px}
.empty .btn{margin-top:6px}

/* ---------- Grade de dados (medições) ---------- */
.dg{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.dg th,.dg td{border:1px solid var(--border);padding:0;text-align:center;min-width:62px}
.dg th{background:var(--bg2);padding:7px 6px;font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.03em}
.dg td.h{background:var(--bg3);font-weight:700;padding:7px}
.dg td.c{background:var(--bg3);padding:7px;font-weight:700;color:var(--brand)}
.dg input{width:100%;border:0;padding:7.5px 4px;text-align:center;background:transparent;outline:0;font-family:'JetBrains Mono','Segoe UI',monospace;font-size:11.5px}
.dg input:focus{background:var(--brand-t);box-shadow:inset 0 0 0 1.5px var(--brand-solid)}
.dg td.out{background:var(--bad-bg)!important;color:var(--bad)}
.dg td.tg{cursor:pointer;font-weight:700;padding:8px;user-select:none;font-size:12px}
.dg td.tg.v1{background:var(--ok-bg);color:var(--ok)}
.dg td.tg.v0{background:var(--bad-bg);color:var(--bad)}
.dg td.tg.vn{color:var(--muted);opacity:.5}
.dg th input{width:100%;min-width:72px;border:1px dashed var(--bd2);background:var(--card);border-radius:7px;padding:3px 4px;font-weight:700;color:var(--brand);text-align:center;outline:0;font-family:'Inter','Segoe UI',sans-serif}
.dg th input:focus{border-color:var(--brand-solid);background:var(--brand-t);border-style:solid}

/* ---------- Resultados ---------- */
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.m{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:11px 13px}
.m:hover{border-color:var(--bd2)}
.m .k{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.m .x{font:700 18px 'Space Grotesk','Inter',sans-serif;margin-top:5px;font-variant-numeric:tabular-nums}
.verdict{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:var(--r);margin-bottom:14px;border:1px solid transparent}
.verdict i{font-size:24px}
.verdict b{font:700 19px 'Space Grotesk','Inter',sans-serif;display:block}
.verdict small{font-size:12.5px;opacity:.85}
/* ---------- v54 · Justificativa para o auditor ---------- */
.qa{margin-top:8px;display:grid;gap:10px}
.qa-i{border:1px solid var(--border);border-radius:var(--rs);padding:10px 13px;background:var(--bg3)}
.qa-q{font-weight:700;font-size:13px;color:var(--brand);display:flex;gap:9px;align-items:baseline;line-height:1.4}
.qa-q .qn{flex-shrink:0;min-width:21px;height:21px;display:inline-grid;place-items:center;background:var(--brand-solid);color:#fff;border-radius:99px;font-size:10.5px;font-weight:800}
.qa-a{font-size:12.5px;margin-top:6px;line-height:1.6;padding-left:30px;color:var(--text)}
.qa-a b{color:var(--brand)}

/* ---------- Abas — controle segmentado ---------- */
.tabs{display:inline-flex;gap:4px;background:var(--bg2);border:1px solid var(--border);padding:4px;border-radius:12px;margin-bottom:18px}
.tab{padding:7.5px 16px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);border:1px solid transparent;border-radius:9px;transition:.16s;user-select:none}
.tab:hover{color:var(--text)}
.tab.on{background:var(--card);color:var(--brand);border-color:var(--border);box-shadow:0 1px 4px rgba(15,23,40,.08)}

/* ---------- Listas ---------- */
.list-i{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px dashed var(--border);cursor:pointer;border-radius:8px}
.list-i:last-child{border:0}
.list-i:hover{background:var(--bg3)}
.list-i .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.list-i .tx{flex:1;min-width:0}
.list-i .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.list-i .tx small{color:var(--muted)}

/* ---------- Modais ---------- */
.ov{position:fixed;inset:0;background:rgba(6,9,17,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ov.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:640px;max-height:90vh;overflow:auto;box-shadow:0 32px 80px -12px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.2);animation:pop .24s cubic-bezier(.16,1,.3,1)}
.modal .mh{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--card);z-index:2;border-radius:16px 16px 0 0}
.modal .mh h3{flex:1;font-size:16.5px}
.modal .mb{padding:22px}
.modal .mf{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:9px;position:sticky;bottom:0;background:var(--card)}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:11px}
.type{border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:.16s;background:var(--card)}
.type:hover{border-color:var(--brand-solid);background:var(--brand-t);transform:translateY(-2px);box-shadow:0 8px 20px -8px rgba(22,90,156,.35)}
.type i{font-size:18px;color:var(--brand-solid);margin-bottom:9px;width:38px;height:38px;border-radius:10px;background:var(--brand-t);display:grid;place-items:center}
.type b{display:block;font-size:13.5px}
.type small{color:var(--muted);font-size:12px;line-height:1.45;display:block;margin-top:3px}

/* ---------- Toast / dropdown / diversos ---------- */
.toast{position:fixed;bottom:24px;right:24px;background:var(--toast);color:#fff;padding:13px 19px;border-radius:12px;font-weight:600;z-index:90;transform:translateY(130px);transition:transform .35s cubic-bezier(.16,1,.3,1);display:flex;gap:10px;align-items:center;box-shadow:0 16px 40px -8px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.09);font-size:13.5px;max-width:min(92vw,480px)}
.toast i{color:#2FD08C}
.toast.show{transform:none}
.dd{position:relative}
.dd-m{position:absolute;right:0;top:110%;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 16px 40px -8px rgba(15,23,40,.28);min-width:235px;padding:6px;display:none;z-index:30}

    if(first&&snap.metadata.fromCache)return;
    const remote=snap.docs.map(d=>{const x=d.data();try{return x.json?JSON.parse(x.json):x}catch(e){return x}});const ids=new Set(remote.map(r=>r.id));

  const cd=String(s.instrumentoCod||'').toUpperCase().trim();
  if(cd){const i=S.instruments.find(x=>String(x.codigo||'').toUpperCase()===cd);if(i)return i}

  if(t&&!t.startsWith('FAM')){const hit=S.instruments.find(x=>{const c=String(x.codigo||'').toUpperCase(),ds=String(x.descricao||'').toUpperCase();return t===c||t===ds||t===c+' — '+ds||t.startsWith(c+' —')||t.startsWith(c+' ')});if(hit)return hit}

/* ================= v54 · JUSTIFICATIVA PARA O AUDITOR (perguntas e respostas) =================
   Gera, para qualquer estudo (ou caso de validação), um relatório em formato de perguntas e
   respostas explicando por que o sistema segue os cálculos do Minitab (ANOVA) e onde/por que
   difere do exemplo impresso do manual AIAG — exibido no sistema e imprimível para auditoria. */
function auditorQA(s,R){
  const qas=[],C=S.cfg,m=(R&&R.m)||{},ser=(R&&R.ser)||{},dp=decimalPlaces(s);
  if(!R||R.status==='Incompleto')return qas;
  const f=(v,d)=>ok(v)?fxd(v,typeof d==='number'?d:dp):'—';
  const pc=(v,d)=>ok(v)?pct(v,typeof d==='number'?d:2):'—';
  const push=(q,a)=>qas.push({q,a});
  const kS=String((R.ser&&ok(+R.ser.kEff))?+R.ser.kEff:(+C.k||6)).replace('.',',');
  push('Os cálculos do sistema foram validados contra o manual AIAG e o Minitab?',
   'Sim. A aba <b>Validação do sistema</b> reproduz o exemplo oficial do AIAG MSA 4ª edição (10 peças × 3 avaliadores × 3 tentativas), os exemplos do manual de tendência, linearidade e R&amp;R por atributos, as tabelas de constantes A₂, D₃, D₄, d₂, K₁, K₂ e K₃, o t crítico conferido contra SciPy e a ANOVA dois fatores conferida contra o Minitab. Além da matemática, cada tipo de estudo tem <b>três casos de classificação — Aprovado, Condicional e Reprovado</b> (R&amp;R variável, tendência, linearidade, estabilidade e R&amp;R por atributos) — com status e indicadores-chave conferidos contra o valor de referência (manual ou implementação independente). A evidência completa pode ser impressa pelo botão “Imprimir evidência” da própria aba.');
  if(s.tipo==='rr'&&ser.an){
    const useA=ser.metodo==='anova',gA=ok(m['%GRR (ANOVA)'])?pct(m['%GRR (ANOVA)'],2):'—',gX=ok(m['%GRR (X̄-R)'])?pct(m['%GRR (X̄-R)'],2):'—',ref=ok(R.kv)?pct(R.kv,2):pc(m['%GRR (VT)']);
    const base=C.base==='tol'?'tolerância (LSE − LIE)':'variação total (VT) do estudo',al=ok(+ser.an.alpha)?+ser.an.alpha:.05;
    push('Por que o sistema calcula pelo método do Minitab (ANOVA) e não pelo exemplo do manual (médias e amplitudes)?',
     `O AIAG MSA 4ª edição descreve dois métodos: <b>médias e amplitudes (X̄-R)</b> e <b>ANOVA</b>. O exemplo numérico impresso no manual está no método X̄-R; o Minitab — software de referência dos laboratórios certificados — calcula o Gage R&amp;R por <b>ANOVA de dois fatores</b> por padrão e remove a interação Operador×Peça quando p > α (aqui: α = ${fxd(al,2)} · p = ${ok(ser.an.pInt)?fxd(ser.an.pInt,4):'—'} → interação ${ser.an.inter?(al>=1?'SEMPRE mantida (α = 1)':'mantida (p ≤ α)'):'removida e agrupada ao erro'}). O sistema calcula <b>pelos dois métodos</b> e classifica pelo método ativo (${rrNome(ser.metodo)}${(s.rrMetodo||s.rrK)?', definido neste estudo':' — padrão do sistema'}), prática alinhada ao software certificado usado na auditoria. Neste estudo: %GRR (ANOVA) = ${gA} · %GRR (X̄-R) = ${gX} — a diferença é metodológica (componentes de variância vs. amplitudes), não erro de cálculo.`);

    const st=R.status,go=+C.grrOk,gc=+C.grrCond;

        :`Critério híbrido adotado: o zero está dentro do IC 95% (t = ${f(m['t calculado'],3)} &lt; t crítico ${f(m['t crítico (95%)'],3)} — viés não significativo estatisticamente), mas o <b>%Tendência = ${ptb}</b> atingiu o limite do procedimento (${C.biasMax}%) — aprovação condicionada ao plano de ação e à ciência do cliente/engenharia.`)

    const stl=R.status,linOK=ok(m['t (a)'])&&ok(m['t crítico'])&&Math.abs(m['t (a)'])<=m['t crítico']&&ok(m['t (b)'])&&Math.abs(m['t (b)'])<=m['t crítico']&&ser.bandOK,limOKl=ok(m['%Bias máx/Tol'])&&m['%Bias máx/Tol']<C.biasMax&&ok(m['%Linearidade'])&&m['%Linearidade']<C.biasMax;

      :`O estudo ficou fora dos dois blocos do critério: <b>bloco estatístico</b> — inclinação significativa (t = ${f(m['t (a)'],3)} vs t crítico ${f(m['t crítico'],3)}) e/ou linha bias = 0 fora das bandas 95% (o viés varia com o nível medido); <b>bloco do procedimento</b> — %Linearidade = ${pc(m['%Linearidade'],2)} e/ou %Bias máx/Tol = ${pc(m['%Bias máx/Tol'],2)} atingiram o limite (${C.biasMax}%). O instrumento não é adequado nesta faixa sem ajuste/calibração por pontos de uso (e novo estudo).`);

        :`O estudo é <b>preliminar: ${m['Subgrupos']} subgrupos</b> preenchidos — nenhum ponto fora dos limites (LSC X̄ = ${f(ser.ucl,Math.max(dp,4))} · LSC R = ${f(ser.uclR,Math.max(dp,4))}) e nenhuma sequência de 7 pontos, mas o AIAG recomenda <b>20 ou mais subgrupos</b> para avaliar estabilidade com confiança estatística. Continue coletando subgrupos; a classificação será reavaliada com a série completa.`)
      :`O estudo reprova o critério local porque apresentou <b>${outE} ponto(s) fora dos limites de controle</b>${ser.outX.length?` — carta X̄: subgrupo(s) ${(ser.outX.map(i=>i+1)).join(', ')}`:''}${ser.outR.length?` — carta R: subgrupo(s) ${(ser.outR.map(i=>i+1)).join(', ')} (amplitude acima de LSC R = ${f(ser.uclR,Math.max(dp,4))})`:''}. Ponto fora indica <b>causa especial</b> (ajuste, desgaste, operador, ambiente) que invalida a premissa de estabilidade: investigue com ação registrada e repita/amplie o estudo antes de liberar o instrumento.`);

  if(s.tipo==='atr'&&ser.per&&ser.per.length){

    push(`Por que o estudo de atributos foi classificado como “${st}”?`,

    const mistos=ser.per.filter(p=>p.mixed>0);
    if(mistos.length)push(`O que significam as ${mistos.reduce((a,p)=>a+p.mixed,0)} peça(s) com avaliações “mistas” (veredito trocado entre tentativas)?`,

     `Contagem no nível de cada chamada (avaliação × tentativa): <b>taxa de perda</b> = aceites (A) em peças de referência ruim ÷ chamadas em peças ruins; <b>falso alarme</b> = rejeites (R) em peças de referência boa ÷ chamadas em peças boas — por avaliador e globais. O AIAG também publica a visão por peça com 100% dos ciclos (100% acerto bom/ruim, perda, falso alarme e misto) — a tela e o relatório mostram as duas visões. Perda alta = risco de aceitar produto defeituoso (risco do cliente); falso alarme alto = retrabalho e descarte indevido (custo).`);
    push('Por que o estudo de atributos não tem %GRR, ndc, EV ou AV?',
     `Porque o dado é binário (aceito/reprovado) — não há variância contínua para decompor em repetibilidade/reprodutibilidade nem “número de categorias distintas”. A discriminação do sistema de medição é avaliada pela capacidade de separar peças boas e ruins: eficácia, taxa de perda, falso alarme e kappa (AIAG MSA 4ª ed., cap. IV — análise de sistemas de medição por atributos), a mesma abordagem do Minitab Attribute Agreement Analysis. Para medir com números use o R&amp;R variável; para decisões go/no-go, este estudo é o correto.`);
  }
  return qas;
}
/* ---- renderização na tela (aplicação) ---- */
function qaHTML(qas){return qas&&qas.length?`<div class="qa">${qas.map((x,i)=>`<div class="qa-i"><div class="qa-q"><span class="qn">${i+1}</span><span>${x.q}</span></div><div class="qa-a">${x.a}</div></div>`).join('')}</div>`:''}
function toggleQAid(id){const b=document.getElementById(id);if(!b)return;b.style.display=b.style.display==='none'?'':'none'}
let QA_HIDDEN=false;
function audBlock(s,R,id='qaBody'){const qas=auditorQA(s,R);if(!qas.length)return'';
  return`<div style="margin-top:16px;border-top:1px dashed var(--border);padding-top:12px"><div class="row" style="justify-content:space-between;margin-bottom:2px"><b style="font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)"><i class="fas fa-clipboard-question" style="margin-right:6px"></i>Justificativa para o auditor · perguntas e respostas</b><span class="row" style="gap:6px"><button class="btn sm" onclick="toggleQAid('${id}')"><i class="fas fa-eye"></i>Mostrar/ocultar</button><button class="btn sm" onclick="printJustStudy()"><i class="fas fa-print"></i>Imprimir</button></span></div><div id="${id}" style="display:${QA_HIDDEN?'none':''}">${qaHTML(qas)}<small class="legend" style="display:block;margin-top:8px">Gerado automaticamente a partir do cálculo real deste estudo · critérios AIAG MSA 4ª ed. + prática Minitab · limites ajustáveis em Configurações.</small></div></div>`}
function valStudyResult(c){if(!c||!c.build)return null;return valWithCfg(c.cfg,()=>{const s=c.build();return{s,R:calc(s)}})}
function audBlockVal(c){const v=valStudyResult(c);if(!v)return'';
  return`<div style="margin-top:12px;border-top:1px dashed var(--border);padding-top:10px"><div class="row" style="justify-content:space-between;margin-bottom:2px"><b style="font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)"><i class="fas fa-clipboard-question" style="margin-right:6px"></i>Justificativa para o auditor</b><span class="row" style="gap:6px"><button class="btn sm" onclick="toggleQAid('qav-${esc(c.id)}')"><i class="fas fa-eye"></i>Mostrar/ocultar</button><button class="btn sm" onclick="valJustOne('${esc(c.id)}')"><i class="fas fa-print"></i>Imprimir</button></span></div><div id="qav-${esc(c.id)}">${qaHTML(auditorQA(v.s,v.R))}</div></div>`}
/* ---- relatório impresso (retrato A4) ---- */
function qaPrintHTML(qas){return qas&&qas.length?`<div class="qa">${qas.map((x,i)=>`<div class="qa-i"><div class="qa-q"><span class="qn">${i+1}</span>${x.q}</div><div class="qa-a">${x.a}</div></div>`).join('')}</div>`:''}
function justMetrics(s,R){const m=(R&&R.m)||{};const fx=(v,d)=>ok(v)?fxd(v,d||decimalPlaces(s)):'—',pc2=v=>ok(v)?pct(v,2):'—';
  if(s.tipo==='rr')return[['%GRR',ok(R.kv)?pct(R.kv,2):'—'],['ndc',ok(m.ndc)?m.ndc:'∞'],['%EV',pc2(m['%EV'])],['%AV',pc2(m['%AV'])],['%PV',pc2(m['%PV'])]];
  if(s.tipo==='bias')return[['Tendência',fx(m['Tendência'])],['%Tendência/Tol',pc2(m['%Tendência/Tol'])],['t calculado',fx(m['t calculado'],3)],['p-valor',fx(m['p-valor'],4)],['Leituras (n)',m['n']??'—']];
  if(s.tipo==='lin')return[['%Linearidade',pc2(m['%Linearidade'])],['Inclinação (a)',fx(m['Inclinação (a)'],5)],['R²',fx(m['R²'],3)],['%Bias máx/Tol',pc2(m['%Bias máx/Tol'])],['Pontos',m['Pontos']??'—']];
  if(s.tipo==='est')return[['Pontos fora',m['Pontos fora']??0],['Subgrupos',m['Subgrupos']??'—'],['X̄̄',fx(m['X̄̄'])],['R̄',fx(m['R̄'])],['%Var/Tol',pc2(m['%Var/Tol'])]];
  if(s.tipo==='atr')return[['Eficácia mín.',pc2(m['Eficácia mín.'])],['Kappa mín. vs ref',fx(m['Kappa mín. vs ref'],2)],['Perda máx.',pc2(m['Taxa de perda máx.'])],['F. alarme máx.',pc2(m['Falso alarme máx.'])],['Peças',m['Peças']??'—']];
  return[]}
function justPageHTML(s,R,annex,extraQAs){
  try{const qas=auditorQA(s,R).concat(extraQAs||[]);if(!qas.length)return'';
  const C=S.cfg,fx=v=>ok(v)?fxd(v,decimalPlaces(s)):'—',pc2=v=>ok(v)?pct(v,2):'—';
  const mts=justMetrics(s,R);
  const hd=`<div class="hd"><div><small>${esc(C.empresa)}</small><h1>${annex?'Anexo — Justificativa para auditoria':'Relatório de justificativa para auditoria'}</h1></div><div class="hdr"><b>${esc(s.codigo)}</b><small>${annex?'Anexo do relatório do estudo':'MSA · Análise dos sistemas de medição'} · emitido em ${new Date().toLocaleString('pt-BR')}</small></div></div>`;
  const info=`<table class="info"><tr><td>Estudo</td><td>${esc(s.codigo)} · ${esc(s.nome||'—')}</td><td>Tipo</td><td>${TYPES[s.tipo]?TYPES[s.tipo].n:esc(s.tipo)}</td><td>Data</td><td>${fdate(s.data)}</td><td>Emitido em</td><td>${new Date().toLocaleString('pt-BR')}</td></tr>
  <tr><td>Instrumento</td><td>${esc(instrName(s))||'—'}</td><td>Característica</td><td>${esc(s.caracteristica)||'—'}</td><td>Tolerância</td><td>${esc(s.lie||'—')} – ${esc(s.lse||'—')} ${esc(s.unidade||'')}</td><td>Responsável</td><td>${esc(s.responsavel)||'—'}</td></tr></table>`;
  const ban=`<div class="v ${R.status}"><span>RESULTADO: ${R.status.toUpperCase()}</span><span class="vm"> — ${esc(R.msg||'')}</span></div>`;
  return`<div class="pg">${hd}${info}${ban}${mts.length?`<h3>Indicadores-chave do estudo</h3><div class="mt">${mts.map(x=>`<div><b>${x[1]}</b><span>${esc(x[0])}</span></div>`).join('')}</div>`:''}
  <h3>Perguntas que o auditor pode fazer — respostas preparadas</h3>
  ${qaPrintHTML(qas)}
  <p class="legend">Documento gerado automaticamente pelo MSA Pro a partir do cálculo real deste estudo. Critérios: AIAG MSA 4ª edição (limites, constantes e exemplo oficial) e ANOVA dois fatores conforme o Minitab; limites de aceitação configuráveis — %GRR ≤ ${C.grrOk}% aceitável · ${C.grrOk}–${C.grrCond}% condicional · ndc ≥ ${C.ndcMin} · multiplicador ${String(C.k).replace('.',',')}σ.</p>
  ${sigBlock(s,null)}</div>`}catch(e){console.error(e);return''}}
function valEvidenceHTML(rows){if(!rows||!rows.length)return'';
  return`<h3 style="margin-top:8px">Evidência — comparação com a referência (${rows.filter(x=>x.ok).length}/${rows.length} idênticas)</h3><table><tr><th style="text-align:left">Grandeza</th><th>Referência</th><th>Sistema</th><th>Dif.</th><th>Fonte</th><th>Resultado</th></tr>${rows.map(x=>`<tr><td style="text-align:left">${esc(x.n)}</td><td style="text-align:right">${valFmt(x.esp,x.dec)}</td><td style="text-align:right">${valFmt(x.got,x.dec+1)}</td><td style="text-align:right">${valFmt(x.got-x.esp,x.dec+1)}</td><td>${esc(x.fonte||'')}</td><td style="text-align:center;color:${x.ok?'#067647':'#B42318'}"><b>${x.ok?'OK':'DIVERGE'}</b></td></tr>`).join('')}</table><p class="legend">Tolerância = arredondamento do valor impresso na referência. “Fonte” indica a origem do valor de referência (Manual AIAG, SciPy/Minitab ou cálculo à mão).</p>`}
/* ---- ações de impressão da justificativa ---- */
function printJust(ids){const L=(ids||[]).map(id=>S.studies.find(s=>s.id===id)).filter(Boolean);if(!L.length){toast('Nenhum estudo para justificar','fa-triangle-exclamation');return}
  const pages=L.map(s=>{const R=calc(s);s.resultado=R;return justPageHTML(s,R,false)}).filter(Boolean);
  if(!pages.length){toast('Nenhum estudo concluído — complete os dados para gerar a justificativa','fa-triangle-exclamation');return}
  openWin(L.length===1?('Justificativa · '+L[0].codigo):`Justificativas MSA (${L.length})`,pages.join(''))}
function printJustStudy(){const s=V.edit;if(!s)return;const R=calc(s);s.resultado=R;const pg=justPageHTML(s,R,false);
  if(!pg){toast('Preencha os dados do estudo para gerar a justificativa','fa-triangle-exclamation');return}
  openWin('Justificativa · '+(s.codigo||'estudo'),pg)}
function valDivQA(rows){const dv=(rows||[]).filter(x=>!x.ok);
  return dv.length?[{q:`Por que ${dv.length} verificação(ões) aparecem como “DIVERGE” na evidência?`,
   a:`As linhas marcadas (${dv.map(x=>x.n).slice(0,8).join('; ')}${dv.length>8?'…':''}) devem ser lidas assim: cada teste fixa um método (X̄-R ou ANOVA) e compara o sistema com os valores publicados na referência. Causas típicas de divergência: (1) arredondamento do valor impresso na referência — a tolerância do teste é o próprio arredondamento; (2) comparação entre métodos diferentes (ex.: valor do manual em X̄-R contra resultado em ANOVA); (3) transcrição dos dados do exemplo. O motor de cálculo é validado pelas demais linhas idênticas; se uma divergência persistir, confira a referência com a sua edição do manual.`}]:[]}
function valJustOne(id){const c=valCases().find(x=>x.id===id);if(!c)return;if(!c.build){toast('Este teste é de constantes — use a evidência padrão','fa-circle-info');return}
  valExec(id,true);const rows=(V.val&&V.val.res[id]||{}).rows||[];const v=valStudyResult(c);if(!v){toast('Não foi possível montar o estudo do teste','fa-triangle-exclamation');return}
  const pg=justPageHTML(v.s,v.R,false,valDivQA(rows))+valEvidenceHTML(rows);
  openWin('Justificativa · '+c.nome,pg)}
function valJustAll(){const cs=valCases().filter(c=>c.build),exec=cs.filter(c=>V.val&&V.val.res[c.id]);
  if(!exec.length){toast('Execute os testes primeiro — a justificativa usa os resultados comparados','fa-triangle-exclamation');return}
  const pages=exec.map(c=>{const rows=V.val.res[c.id].rows,v=valStudyResult(c);return v?justPageHTML(v.s,v.R,false,valDivQA(rows))+valEvidenceHTML(rows):''}).filter(Boolean);
  if(!pages.length){toast('Nenhum teste com estudo para justificar','fa-triangle-exclamation');return}
  openWin(`Justificativa para auditor — validação do sistema (${exec.length} testes)`,pages.join(''))}

e IATF 16949:2016, assegurando que as medições, calibrações, ensaios e estudos realizados atendam aos requisitos dos clientes e tenham rastreabilidade a padrões nacionais e/ou internacionais. Isso garante a confiabilidade dos resultados obtidos na validação da conformidade do produto acabado para os diferentes números de peça.<\/p>\n<h3 class=\"s1\">Escopo:<\/h3>\n<p>Este procedimento aplica-se à área de Metrologia da Röchling Automotive AM-N.<\/p>\n<h3 class=\"s1\">Responsabilidades:<\/h3>\n<p>Metrologia da Qualidade<\/p>\n<p>Técnicos da Qualidade<\/p>\n<p>Engenheiros da Qualidade<\/p>\n<p>Gestão da Qualidade<\/p>\n<h3 class=\"s1\">Abreviações e terminologia: <\/h3>\n<p><strong>MSA – Análise do Sistema de Medição<\/strong><\/p>\n\n<h3 class=\"s1\">1 - ANÁLISE E SELEÇÃO DE EQUIPAMENTOS DE MEDIÇÃO E ENSAIO<\/h3>\n<h4 class=\"s2\">1.1 Responsável pela seleção dos equipamentos<\/h4>\n<p>A área de Metrologia é responsável pela seleção dos equipamentos de medição e ensaio, bem como pelas atividades descritas nos itens 1 a 4. Essa seleção é validada pelo Gerente da Qualidade, responsável pela área.<\/p>\n<h4 class=\"s2\">1.2 Requisitos técnicos<\/h4>\n<p>Os requisitos técnicos (especificações) são definidos com base em:<\/p>\n<p>• Quantidade de peças a serem medidas, faixa de aplicação e classe de precisão ou exatidão do equipamento de medição necessário.<br />\n• Limitações de instalação e uso do equipamento: condições ambientais, metodologia do cliente, manuseio, manutenção etc.<br />\n• Possibilidade de evolução dos equipamentos de medição para minimizar o risco de obsolescência.<br />\n• Requisitos específicos relacionados à calibração ou verificação.<br />\n• Condições de aceitação.<\/p>\n<h4 class=\"s2\">1.3 Condições comerciais<\/h4>\n<p>São considerados os seguintes fatores:<\/p>\n<p>• Prazo de entrega.<br />\n• Contrato de manutenção, verificação e/ou suporte técnico (relevância técnica e custo).<br />\n• Condições de suporte técnico do fornecedor.<\/p>\n<h4 class=\"s2\">1.4 Seleção de equipamentos de medição ou ensaio<\/h4>\n<p>A escolha do equipamento também deve considerar as lições aprendidas e os requisitos específicos do cliente.<\/p>\n<h3 class=\"s1\">2 - RECEBIMENTO E ACEITAÇÃO DOS EQUIPAMENTOS<\/h3>\n<p>Ao receber um novo equipamento de medição, após verificar se a entrega está em boas condições, a equipe de Metrologia realiza as seguintes operações:<\/p>\n<h4 class=\"s2\">2.1 Identificação do equipamento<\/h4>\n<p>Todos os equipamentos são registrados com um ID de referência, incluído no banco de dados de gerenciamento de equipamentos.<\/p>\n<h4 class=\"s2\">2.2 Arquivo mestre do equipamento<\/h4>\n<p>O arquivo mestre inclui todos os equipamentos de medição e ensaio. A documentação ou os certificados correspondentes a cada equipamento são arquivados individualmente.<\/p>\n<h4 class=\"s2\">2.3 Calibração / ensaio antes da utilização<\/h4>\n<p>Antes de o equipamento de medição ser colocado em serviço, é obrigatório verificar se ele está calibrado:<\/p>\n<ol type=\"a\">\n<li><p>pelo fornecedor ou por uma organização externa acreditada conforme a ISO/IEC 17025 ou equivalente nacional.<\/p><\/li>\n<li><p>internamente, de acordo com as instruções de calibração/verificação e as operações descritas no processo de calibração. O equipamento de referência (padrão) deve ser calibrado/verificado por uma organização acreditada conforme a ISO/IEC 17025 ou equivalente nacional.<\/p><\/li>\n<\/ol>\n<h4 class=\"s2\">2.4 Análise do Sistema de Medição (MSA)<\/h4>\n<p>É necessário realizar estudos estatísticos para analisar as variações nos resultados dos equipamentos de medição e ensaio. Esse requisito aplica-se aos equipamentos utilizados nas atividades de liberação incluídas nos planos de controle do produto.<\/p>\n<p>Para isso, é utilizado o software estatístico interno da Röchling para realizar a respectiva Análise do Sistema de Medição.<\/p>\n<p>Os critérios de aceitação dos estudos estatísticos são os seguintes:<\/p>\n<p>Estudo R&amp;R por variável.<\/p>\n<table class=\"pt2\">\n\n<thead>\n<tr class=\"header\">\n<th>% GRR &lt;10%<\/th>\n<th>Aceitável<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>% GRR 10% - 20%<\/td>\n<td>Aceitável sob avaliação<\/td>\n<\/tr>\n<tr>\n<td>% GRR &gt;20%<\/td>\n<td>Não aceitável<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Estudo R&amp;R por atributo.<\/p>\n<table class=\"pt2\">\n\n<thead>\n<tr class=\"header\">\n<th>% GRR &gt;90%<\/th>\n<th>Aceitável<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>% GRR 70% - 90%<\/td>\n<td>Aceitável sob avaliação<\/td>\n<\/tr>\n<tr>\n<td>% GRR &lt;70%<\/td>\n<td>Não aceitável<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Estudo de tendência (Bias) e linearidade: o resultado deve ser &lt;10%.<\/p>\n<p>Em caso de qualquer alteração no equipamento/dispositivo, incluindo mudança do pessoal responsável pela liberação de produtos, deve ser realizado o estudo estatístico correspondente para garantir o atendimento aos requisitos estabelecidos.<\/p>\n<p>O Programa de Calibração deve especificar o tipo de estudo de MSA aplicável a cada equipamento envolvido no processo de liberação de produtos. A tabela a seguir apresenta os tipos de estudos de MSA aplicáveis ​​aos equipamentos gerenciados na Röchling AM-N, bem como sua periodicidade<\/p>\n<table class=\"pt2\">\n\n<thead>\n<tr class=\"header\">\n<th><strong>Equipamento de medição<\/strong><\/th>\n<th><strong>Padrão de referência<\/strong><\/th>\n<th><strong>Tipo de estudo<\/strong><\/th>\n<th><strong>Frequência (meses)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Micrômetro interno<\/td>\n<td>Bloco-padrão<\/td>\n<td>R&amp;R<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Chave de torque digital<\/td>\n<td>Analisador de torque<\/td>\n<td>Estudo de tendência (Bias) e linearidade<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Balanças<\/td>\n<td>Peso-padrão<\/td>\n<td>Estudo de tendência (Bias) e linearidade<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Durômetro<\/td>\n<td>Placa-padrão<\/td>\n<td>Estudo de tendência (Bias) e linearidade<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Paquímetros<\/td>\n<td>Bloco-padrão<\/td>\n<td>Estudo de tendência (Bias) e linearidade<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Relógios comparadores digitais<\/td>\n<td>Bloco-padrão<\/td>\n<td>Estudo de tendência (Bias) e linearidade<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Dispositivo de controle passa/não passa<\/td>\n<td>Peças de produção verificadas por CMM<\/td>\n<td>R&amp;R<\/td>\n<td>No recebimento<\/td>\n<\/tr>\n<tr>\n<td>Dispositivo de controle com SPC<\/td>\n<td>Indicador digital<\/td>\n<td>R&amp;R<\/td>\n<td>No recebimento<\/td>\n<\/tr>\n<tr>\n<td>CMM<\/td>\n<td>Dispositivo de calibração certificado (Tetra, Ball Bar)<\/td>\n<td>R &amp; R<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Máquina universal de ensaios<\/td>\n<td>Leituras realizadas com padrão do fornecedor<\/td>\n<td>Estudo de tendência (Bias) e linearidade<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Plastômetro<\/td>\n<td>Leituras realizadas com padrão do fornecedor<\/td>\n<td>Estudo de tendência (Bias) e linearidade<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Medidor de altura<\/td>\n<td>Bloco-padrão<\/td>\n<td>Estudo de tendência (Bias) e linearidade<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Medidor de espessura<\/td>\n<td>Bloco-padrão<\/td>\n<td>Estudo de tendência (Bias) e linearidade<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Micrômetro<\/td>\n<td>Bloco-padrão<\/td>\n<td>Estudo de tendência (Bias) e linearidade<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Testador de vazamento<\/td>\n<td>Leituras realizadas com padrão do fornecedor<\/td>\n<td>Estudo de tendência (Bias) e linearidade<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>Dinamômetros<\/td>\n<td>Leituras realizadas com padrão do fornecedor<\/td>\n<td>Estudo de tendência (Bias) e linearidade<\/td>\n<td>12<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Quando um equipamento de medição é adaptado a uma estação de trabalho, mesa ou outro dispositivo, ele passa a ser considerado um dispositivo de controle; portanto, o estudo MSA aplicável deve ser R&amp;R.<\/p>\n<h3 class=\"s1\">3 - Novos equipamentos de medição e ensaio<\/h3>\n<h4 class=\"s2\">3.1 Registro de equipamentos de medição e ensaio<\/h4>\n<p>Todos os equipamentos de medição e teste são registrados pelo Departamento de Metrologia no banco de dados de calibração de equipamentos, o qual apresenta, no mínimo, as seguintes informações:<\/p>\n<p>- Designação<\/p>\n<p>- Marca e tipo<\/p>\n<p>- ID do equipamento<\/p>\n<p>- Características (faixa de medição, erro máximo etc.)<\/p>\n<p>- Frequência de calibração/verificação: definida com base na importância da medição, na frequência e no tipo de uso.<\/p>\n<p>- Data da última/próxima calibração<\/p>\n<p>- Data de início de utilização<\/p>\n<p>Todos os equipamentos de medição e ensaio devem possuir uma etiqueta com o código interno de identificação e outra indicando a data prevista para a próxima calibração/verificação (etiqueta anual ou mensal), para que essa informação possa ser conferida antes do uso.<\/p>\n<h3 class=\"s1\">4 - GERENCIAMENTO DOS EQUIPAMENTOS DE MEDIÇÃO E ENSAIO<\/h3>\n<h4 class=\"s2\">4.1 Calibração/verificação<\/h4>\n<p>Existem diferentes formas de realizar calibrações ou verificações.<\/p>\n<p>A área de Metrologia deve:<\/p>\n<p>- garantir a validade dos documentos de acreditação dos laboratórios externos.<\/p>\n<p>- obter os certificados de calibração ou relatórios de verificação dos equipamentos.<\/p>\n<p>- definir a frequência de calibração dos equipamentos registrados no banco de dados, considerando, entre outros fatores, a frequência de uso, o local de armazenamento e/ou as condições do local onde são normalmente utilizados. As frequências de calibração e/ou verificação são especificadas no Banco de Dados de Calibração de Equipamentos.<\/p>\n<h4 class=\"s2\">4.2 Banco de dados de verificação/calibração<\/h4>\n<p>Cada área ou pessoa designada como responsável por equipamentos de medição e teste deve garantir que eles estejam em conformidade com a próxima data de calibração/verificação indicada no equipamento.<\/p>\n<p>Para isso, o departamento de metrologia deve consultar o Banco de Dados de Calibração de Equipamentos a fim de identificar os equipamentos que precisam ser calibrados/verificados no mês vigente.<\/p>\n<p>É permitida uma tolerância de +1 mês em relação à periodicidade de calibração/verificação, de modo a assegurar o atendimento aos requisitos do serviço.<\/p>\n<p>Após a realização da calibração/verificação, o departamento de metrologia valida e registra as ações executadas, as intervenções (histórico) e o respectivo status no banco de dados de equipamentos.<\/p>\n<p>Caso ocorra um atraso na calibração/verificação (seja planejado ou acidental), o uso do equipamento deve ser avaliado com cautela, sendo necessário consultar os registros de calibração do item para analisar seu desempenho.<\/p>\n<p>O departamento de metrologia informa a equipe responsável sobre a situação do equipamento, para que se decida se ele pode ser utilizado além do prazo de validade da calibração. Essa autorização deve ser sinalizada no próprio equipamento por meio de uma etiqueta adicional, assinada pelo Gerente da Qualidade e contendo a nova data de calibração.<\/p>\n<p>.<\/p>\n<p>Quando for realizada uma verificação e/ou calibração, devem ser asseguradas as condições de temperatura do laboratório, que devem atender a 20 °C ± 2 °C.<\/p>\n<h4 class=\"s2\">4.3 Gerenciamento de equipamentos defeituosos ou não conformes (calibração/verificação)<\/h4>\n<blockquote>\n<h4 class=\"s2\">4.3.1. Equipamento defeituoso após uma ocorrência<\/h4>\n<\/blockquote>\n<p>Em caso de mau funcionamento ou dano ao equipamento, o laboratório realiza uma análise, determina se o reparo pode ser feito interna ou externamente e valida essa decisão junto à área ou ao responsável pelo equipamento, bem como ao Gerente da Qualidade. Caso o reparo não seja possível, o equipamento é declarado \"fora de serviço\", com a devida justificativa.<\/p>\n<p>Se o equipamento for reparado, ele deve passar por uma nova calibração/verificação, e o banco de dados de equipamentos deve ser atualizado, mantendo-se a sua rastreabilidade documentada.<\/p>\n<blockquote>\n<h4 class=\"s2\">4.3.2. Equipamento não conforme durante a validação<\/h4>\n<\/blockquote>\n<p>O equipamento considerado \"em não conformidade\" no momento da verificação deve ser reparado, seja internamente ou externamente.<\/p>\n<p>Na sequência, ele deve ser novamente calibrado/verificado, e o banco de dados de equipamentos deve ser atualizado, mantendo-se a sua rastreabilidade documentada.<\/p>\n<p>Caso o equipamento não possa ser reparado, seu status deve ser alterado para \"Inativo\", registrando-se no banco de dados o motivo dessa alteração.<\/p>\n<p>Se for identificada uma questão significativa no equipamento durante a calibração/verificação, a área de Metrologia, em acordo com o Gerente da Qualidade, aumentará imediatamente a frequência de calibração/verificação e tomará as medidas necessárias em relação a outros produtos potencialmente suspeitos.<\/p>\n<p>Em caso de ferramentas ou equipamentos defeituosos, deverá ser realizada uma auditoria do produto no lote de produção atual.<\/p>\n<h4 class=\"s2\">4.4 Registros e armazenamento<\/h4>\n<p>O registro do equipamento é atualizado no banco de dados pelo responsável da Metrologia após cada calibração/verificação.<\/p>\n<p>Os documentos são arquivados na unidade de rede.<\/p>\n<h4 class=\"s2\">4.5. Lista de equipamentos de medição e ensaio<\/h4>\n<p>O banco de dados de equipamentos de medição e ensaio deve conter:<\/p>\n<ul>\n<li><p>ID do equipamento<\/p><\/li>\n<li><p>Produto<\/p><\/li>\n<li><p>Uso correspondente<\/p><\/li>\n<li><p>Características (faixa de medição, dimensões, resoluções etc.)<\/p><\/li>\n<li><p>Frequência de calibração e/ou verificação<\/p><\/li>\n<li><p>Estudos MSA aplicáveis conforme o tipo de dispositivo e sua utilização.<\/p><\/li>\n<\/ul>\n<h3 class=\"s1\">5 - AUTORIZAÇÃO E QUALIFICAÇÃO DO PESSOAL<\/h3>\n<p>O processo de autorização e qualificação do pessoal que realiza ensaios na área de Metrologia é o seguinte:<\/p>\n<ul>\n<li><p>O pessoal é contratado com base em seu nível inicial de formação (qualificação/experiência profissional).<\/p><\/li>\n<li><p>O profissional desenvolve gradualmente suas competências de acordo com a descrição de seu cargo, sob a supervisão de uma pessoa qualificada (com conhecimento teórico e prático dos equipamentos de ensaio utilizados).<\/p><\/li>\n<\/ul>\n<h3 class=\"s1\">Revisões<\/h3>\n<table class=\"pt2\">\n\n<thead>\n<tr class=\"header\">\n<th>Data<\/th>\n<th>Anterior<\/th>\n<th>Atual<\/th>\n<th>Comentários<\/th>\n<th>Responsável<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>01-10-2025<\/td>\n<td>-<\/td>\n<td>A<\/td>\n<td>Nova emissão<\/td>\n<td>P. Sobti<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n";
const PROC_ID='P08_05WI 25A';
/* Tabela do item 2.4 do procedimento. est: tipos de estudo exigidos (bias+lin = "Tendência (Bias) e linearidade") */
const PROG=[
 {k:'micint',eq:'Micrômetro interno',pad:'Bloco-padrão',est:['rr'],freq:'12',un:'mm'},
 {k:'torque',eq:'Chave de torque digital',pad:'Analisador de torque',est:['bias','lin'],freq:'12',un:'N·m'},
 {k:'balanca',eq:'Balanças',pad:'Peso-padrão',est:['bias','lin'],freq:'12',un:'g'},
 {k:'duro',eq:'Durômetro',pad:'Placa-padrão',est:['bias','lin'],freq:'12',un:''},
 {k:'paq',eq:'Paquímetros',pad:'Bloco-padrão',est:['bias','lin'],freq:'12',un:'mm'},
 {k:'relogio',eq:'Relógios comparadores digitais',pad:'Bloco-padrão',est:['bias','lin'],freq:'12',un:'mm'},
 {k:'passa',eq:'Dispositivo de controle passa/não passa',pad:'Peças de produção verificadas por CMM',est:['atr'],freq:'No recebimento',un:''},
 {k:'spc',eq:'Dispositivo de controle com SPC',pad:'Indicador digital',est:['rr'],freq:'No recebimento',un:'mm'},
 {k:'cmm',eq:'CMM',pad:'Dispositivo de calibração certificado (Tetra, Ball Bar)',est:['rr'],freq:'12',un:'mm'},
 {k:'uni',eq:'Máquina universal de ensaios',pad:'Leituras realizadas com padrão do fornecedor',est:['bias','lin'],freq:'12',un:'N'},
 {k:'plasto',eq:'Plastômetro',pad:'Leituras realizadas com padrão do fornecedor',est:['bias','lin'],freq:'12',un:''},
 {k:'altura',eq:'Medidor de altura',pad:'Bloco-padrão',est:['bias','lin'],freq:'12',un:'mm'},
 {k:'espess',eq:'Medidor de espessura',pad:'Bloco-padrão',est:['bias','lin'],freq:'12',un:'mm'},
 {k:'micro',eq:'Micrômetro',pad:'Bloco-padrão',est:['bias','lin'],freq:'12',un:'mm'},
 {k:'vazam',eq:'Testador de vazamento',pad:'Leituras realizadas com padrão do fornecedor',est:['bias','lin'],freq:'12',un:''},
 {k:'dinam',eq:'Dinamômetros',pad:'Leituras realizadas com padrão do fornecedor',est:['bias','lin'],freq:'12',un:'N'}
];
const progId=(p,t)=>`${PROC_ID}|${p.k}|${t}`;
const progTxt=p=>p.est.includes('bias')?'Estudo de tendência (Bias) e linearidade':p.est.includes('atr')?'R&R por atributo':'R&R por variável';
const progMissing=()=>PROG.flatMap(p=>p.est.filter(t=>!S.studies.some(s=>s.progId===progId(p,t))).map(t=>[p,t]));
function genProg(){
  const miss=progMissing();if(!miss.length){toast('Todos os estudos do programa já existem','fa-circle-info');return 0}
  miss.forEach(([p,t])=>{const s=newStudy(t);
    while(S.studies.some(x=>x.codigo===s.codigo)){const m=s.codigo.match(/^(.*-)(\d+)$/);s.codigo=m[1]+String(+m[2]+1).padStart(3,'0')}
    Object.assign(s,{id:'prog_'+p.k+'_'+t,progId:progId(p,t),instrumentoTxt:p.eq,padrao:p.pad,freq:p.freq,unidade:p.un,
      obs:`Gerado do procedimento ${PROC_ID} (item 2.4). Equipamento: ${p.eq}. Padrão de referência: ${p.pad}. Frequência: ${/^\d+$/.test(p.freq)?p.freq+' meses':p.freq}. Atualizar identificação (instrumento, peça, característica, LIE/LSE, responsável, data).`});
    saveStudy(normalize(s))});
  toast(`${miss.length} estudo(s) do procedimento criados e enviados ao Firebase`);if(typeof refresh==='function')refresh();return miss.length}
/* ---------- deduplicação e vínculo com o programa (anti-duplicação) ---------- */
const dataFill=s=>{let n=0;const walk=v=>{if(Array.isArray(v))v.forEach(walk);else if(v!==''&&v!=null)n++};if(s.dados)Object.values(s.dados).forEach(walk);return n};
function progCandidates(p,t){const pid=progId(p,t);
  const exact=S.studies.filter(s=>s.tipo===t&&(s.progId===pid||s.id==='prog_'+p.k+'_'+t));
  const loose=S.studies.filter(s=>s.tipo===t&&!s.progId&&s.instrumentoTxt===p.eq&&(s.padrao===p.pad||/procedimento/i.test(s.obs||'')));
  const seen=new Set(),all=[];exact.concat(loose).forEach(s=>{if(!seen.has(s.id)){seen.add(s.id);all.push(s)}});
  return all}
function migrateProg(){
  let removed=0,fixed=0;
  const recency=s=>String(s.atualizadoEm||s.criadoEm||'');
  // 1) programa do procedimento: no máximo uma cópia por item; mantém a mais preenchida
  PROG.forEach(p=>p.est.forEach(t=>{const pid=progId(p,t),canon='prog_'+p.k+'_'+t;
    const cand=progCandidates(p,t);if(!cand.length)return;
    cand.sort((a,b)=>dataFill(b)-dataFill(a)||recency(b).localeCompare(recency(a)));
    const keep=cand[0];
    cand.slice(1).forEach(s=>{S.studies=S.studies.filter(x=>x.id!==s.id);cloudDel('msapro_estudos',s.id);removed++});
    if(keep.progId!==pid){keep.progId=pid;fixed++}
    if(keep.id!==canon&&!S.studies.some(x=>x.id===canon)){const i=S.studies.findIndex(x=>x.id===keep.id);keep.id=canon;if(i>=0)S.studies[i]=keep;fixed++}}));
  // 2) duplicatas exatas fora do programa (mesmo tipo+codigo): mantém a melhor cópia
  const groups=new Map();
  S.studies.forEach(s=>{const k=s.tipo+'|'+s.codigo;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(s)});
  groups.forEach(g=>{if(g.length<2)return;
    const filled=g.filter(s=>dataFill(s)>0),empty=g.filter(s=>!dataFill(s));const drop=new Set();
    if(filled.length){const best=filled.sort((a,b)=>dataFill(b)-dataFill(a)||recency(b).localeCompare(recency(a)))[0];
      filled.slice(1).forEach(s=>{if(JSON.stringify(s.dados||{})===JSON.stringify(best.dados||{}))drop.add(s)});
      empty.forEach(s=>drop.add(s));
    }else{empty.sort((a,b)=>(b.progId?1:0)-(a.progId?1:0)||recency(b).localeCompare(recency(a)));empty.slice(1).forEach(s=>drop.add(s))}
    drop.forEach(s=>{S.studies=S.studies.filter(x=>x.id!==s.id);cloudDel('msapro_estudos',s.id);removed++})});
  return{removed,fixed}}
function migrateAll(report){const r=migrateProg();
  if(r.removed||r.fixed){persist();if(report||r.removed)toast(`${r.removed} duplicado(s) removido(s) · ${r.fixed} estudo(s) vinculado(s) ao programa`,'fa-broom')}
  else if(report)toast('Nenhuma duplicidade encontrada','fa-circle-info');
  return r}
/* v40: estudos SIMULADOS criados por versões antigas podiam sair com valores implausíveis
   (ex.: R&R com medições quase idênticas → %GRR<1% e ndc>100). No boot, estudos marcados
   como simulado são recalculados e, se implausíveis, REGENERADOS com o gerador corrigido
   (com registro no histórico de rastreabilidade). Estudos reais nunca são alterados. */
function repairSim(){let n=0;const fix=[];
  S.studies.forEach(s=>{if(!s.simulado||s.tipo!=='rr')return;let R=null;try{R=calc(s)}catch(e){return}
    if(!R||!R.m||R.status==='Incompleto')return;
    const g=+R.m['%GRR (VT)'],ndc=+R.m.ndc;
    if((ok(ndc)&&ndc>40)||(ok(g)&&(g<2||g>28))){simApprove(s,'good');logHist(s,'Regenerado (v40)',`dados simulados implausíveis (ndc=${ok(ndc)?ndc:'∞'}, %GRR=${ok(g)?pct(g,2):'—'}) recriados com o gerador corrigido`);saveStudy(s);n++;fix.push(s.codigo)}});
  if(n)setTimeout(()=>toast(`${n} estudo(s) R&R simulado(s) com valores fora da realidade foram regenerados automaticamente: ${fix.slice(0,4).join(', ')}${fix.length>4?'…':''}`,'fa-wand-magic-sparkles'),1800);
  return n}
function askGenProg(){const n=progMissing().length;if(!n){toast('Todos os estudos do programa já existem','fa-circle-info');return}
  confirmBox(`Criar <b>${n}</b> estudo(s) em branco com base na tabela do procedimento <b>${PROC_ID}</b>?<br><small>Estudos já gerados não são duplicados. Depois é só abrir cada um e atualizar os campos de identificação.</small>`,()=>{genProg();if(V.view==='procedimento')rProc();else refresh()})}
function procPrint(){openWin('Procedimento '+PROC_ID,`<style>${PROC_CSS}</style><div class="proc">${PROC_HTML}</div>`)}
const PROC_CSS=`.proc{font:12px/1.5 'Segoe UI',Arial,sans-serif;color:#252423}.proc h3.s1{font:700 14px 'Segoe UI',Arial;color:#165A9C;margin:16px 0 6px;border-bottom:2px solid #1E6FBE;padding-bottom:3px}.proc h4.s2{font:700 12.5px 'Segoe UI',Arial;margin:10px 0 3px}.proc p{margin:4px 0}.proc table{width:100%;border-collapse:collapse;margin:8px 0;font-size:11.5px}.proc td,.proc th{border:1px solid #999;padding:4px 7px;vertical-align:top;text-align:left}.proc .plogo{max-width:130px}`;
/* ---- geração de estudos POR FAMÍLIA a partir da tabela 2.4 do procedimento ---- */
const PROC_FAM={
 micint:{cod:'MIC',kw:['micrometro']},torque:{cod:'TOR',kw:['torque']},balanca:{cod:'BAL',kw:['balanca']},
 duro:{cod:'DUR',kw:['durometro']},paq:{cod:'PAQ',kw:['paquimetro']},relogio:{cod:'REL',kw:['relogio','apalpador']},
 passa:{cod:'DIS',kw:['dispositivo','gabarito']},spc:{cod:'DIS',kw:['dispositivo','gabarito']},
 cmm:{cod:'CMM',kw:['cmm','tridimensional','medicao 3d','mmc']},
 uni:{cod:'ENS',kw:['universal de ensaios']},plasto:{cod:'ENS',kw:['plastometro']},
 altura:{cod:'ALT',kw:['altura']},espess:{cod:'ESP',kw:['espess']},micro:{cod:'MIC',kw:['micrometro']},
 vazam:{cod:'ENS',kw:['vazamento']},dinam:{cod:'ENS',kw:['dinamometro']}};
function procFamMatch(p){const m=PROC_FAM[p.k];if(!m)return null;
 return S.fams.find(f=>f.cod===m.cod)||S.fams.find(f=>m.kw.some(k=>ivN(f.nome).includes(k))||f.tipos.some(t=>m.kw.some(k=>ivN(t).includes(k))))||null}
/* 0 = novo · 1 = já existe estudo do tipo nesta família · 2 = já existe no programa do procedimento (progId/prog_*) */
function procFamState(p,t,fid){
 if(fid&&S.studies.some(s=>s.tipo===t&&s.familiaId===fid))return 1;
 if(S.studies.some(s=>s.tipo===t&&(s.progId===progId(p,t)||s.id==='prog_'+p.k+'_'+t)))return 2;
 return 0}
function procFamCount(){let ex=0;const uni=new Set();PROG.forEach((p,i)=>{const el=$('#pfam-'+i);const fid=el?el.value:'';if(!fid)return;
  p.est.forEach(t=>{procFamState(p,t,fid)?ex++:uni.add(fid+'|'+t)})});return{n:uni.size,ex}}
function procFamRefresh(){const c=procFamCount(),b=$('#pfBtn');
 if(b){b.innerHTML=`<i class="fas fa-wand-magic-sparkles"></i>Criar ${c.n} estudo(s)`;b.disabled=!c.n;b.style.opacity=c.n?'1':'.5'}
 const t=$('#pfTag');if(t)t.textContent=c.ex?`${c.ex} estudo(s) já existem e serão mantidos — nada é duplicado`:''}
function procFamModal(){
 if(!S.fams.length){modal(`<div class="mh"><h3>Criar estudos do procedimento ${PROC_ID}</h3><button class="btn ic" onclick="closeModal()"><i class="fas fa-xmark"></i></button></div><div class="mb"><div class="empty"><i class="fas fa-layer-group"></i>Nenhuma família cadastrada.<br>A tabela 2.4 gera estudos <b>por família de instrumentos</b> — um estudo cobre todos os instrumentos similares.<br><br><button class="btn pri" onclick="closeModal();seedFams()"><i class="fas fa-wand-magic-sparkles"></i>Criar catálogo padrão (AIAG)</button></div></div>`);return}
 const rows=PROG.map((p,i)=>{const hit=procFamMatch(p);
  const tags=p.est.map(t=>{const st=hit?procFamState(p,t,hit.id):0;
   const L={0:['novo','color:var(--brand);background:var(--brand-t)'],1:['já existe nesta família','color:#1E7A3C;background:#E7F6EA'],2:['já existe (programa)','color:#605E5C;background:#F1F0EF']}[st];
   return `<span class="tag" style="${L[1]}"><i class="fas ${TYPES[t].ic}"></i> ${TYPES[t].n} · ${L[0]}</span>`}).join(' ');
  const opts=[`<option value="">— ignorar —</option>`];
  if(hit)opts.push(`<option value="${hit.id}" selected>${esc(hit.cod)} · ${esc(hit.nome)}</option>`);
  S.fams.slice().sort((a,b)=>a.cod.localeCompare(b.cod)).forEach(f=>{if(!hit||f.id!==hit.id)opts.push(`<option value="${f.id}">${esc(f.cod)} · ${esc(f.nome)}</option>`)});
  return `<tr><td><b>${esc(p.eq)}</b><div style="color:var(--muted);font-size:12px">Padrão: ${esc(p.pad)}</div></td><td>${tags}</td><td style="white-space:nowrap">${esc(p.freq)}</td><td><select class="f" id="pfam-${i}" style="width:100%;min-width:200px" onchange="procFamRefresh()">${opts.join('')}</select></td></tr>`}).join('');
 modal(`<div class="mh"><h3>Criar estudos da tabela 2.4 — ${PROC_ID}</h3><button class="btn ic" onclick="closeModal()"><i class="fas fa-xmark"></i></button></div>
 <div class="mb"><p class="legend" style="margin-top:0"><i class="fas fa-circle-info"></i> Cada linha da tabela do procedimento gera os estudos MSA exigidos na <b>família vinculada</b> (AIAG MSA 4ª ed.: um estudo por família cobre todos os instrumentos similares). A frequência preenche o <b>Cronograma</b> de recálculos automaticamente. Estudos já existentes não são duplicados.</p>
 <div class="tw" style="max-height:50vh;overflow:auto"><table class="t"><thead><tr><th>Equipamento (item 2.4)</th><th>Estudos gerados</th><th>Frequência</th><th>Família vinculada</th></tr></thead><tbody>${rows}</tbody></table></div>
 <p class="legend" id="pfTag" style="margin:8px 0 0"></p></div>
 <div class="mf"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="pfBtn" onclick="procFamCreate()"></button></div>`);
 procFamRefresh()}
function procFamCreate(){
 const t0=today(),out=[];
 PROG.forEach((p,i)=>{const el=$('#pfam-'+i);const fid=el?el.value:'';if(!fid)return;
  const fam=S.fams.find(f=>f.id===fid);if(!fam)return;
  p.est.forEach(t=>{if(procFamState(p,t,fid))return;
   const s=newStudy(t);
   while(S.studies.some(x=>x.codigo===s.codigo)){const m=s.codigo.match(/^(.*-)(\d+)$/);if(!m)break;s.codigo=m[1]+String(+m[2]+1).padStart(3,'0')}
   s.familiaId=fam.id;s.instrumentoId='';s.instrumentoCod='';
   s.instrumentoTxt=`Família ${fam.cod} — ${fam.nome} (família)`;
   s.nome=`${TYPES[t].n} — ${fam.nome}`;s.peca='';s.caracteristica='';
   if(p.un)s.unidade=p.un;
   s.responsavel=fam.resp||userName();s.area='';s.data=t0;
   if(/^\d+$/.test(p.freq)){s.freqMeses=+p.freq;s.proxima=addMonthsISO(t0,+p.freq)}else{s.freqMeses=0;s.proxima=''}
   s.obs=`Procedimento ${PROC_ID} (item 2.4) · Equipamento: ${p.eq} · Padrão de referência: ${p.pad} · Frequência: ${/^\d+$/.test(p.freq)?p.freq+' meses':p.freq} · Estudo por família (AIAG MSA 4ª ed.) — cobre todos os instrumentos similares.`;
   saveStudy(normalize(s));out.push(s)})});
 closeModal();
 toast(out.length?`${out.length} estudo(s) criado(s) da tabela 2.4 e vinculados às famílias`:'Nenhum estudo novo — tudo já existe','fa-table-list');
 if(out.length){V.view='estudos';V.f={q:'',tipo:'',status:'',instr:'',periodo:'',area:'',fam:''};render()}}
function rProc(){
  $('#main').innerHTML=`<div class="fade"><div class="top"><div><h1>Procedimento ${PROC_ID}</h1><div class="sub">Metrologia de Equipamentos de Teste · Rev. A · 10-jan-2025</div></div><div class="sp"></div>
   <button class="btn pri" onclick="procFamModal()"><i class="fas fa-table-list"></i>Criar estudos 2.4</button>
   <button class="btn" onclick="procPrint()"><i class="fas fa-print"></i>Imprimir</button></div>

/* ---------------- CRONOGRAMA DE RECÁLCULOS MSA ---------------- */
const FREQ_LBL={0:'Sem recorrência',1:'Mensal',2:'Bimestral',3:'Trimestral',4:'Quadrimestral',6:'Semestral',12:'Anual',24:'Bienal'};
const freqLbl=m=>FREQ_LBL[+m]||(+m?`A cada ${+m} meses`:'Sem recorrência');
function addMonthsISO(iso,m){if(!iso)return'';const d=new Date(iso+'T12:00:00');if(isNaN(d))return'';const day=d.getDate();d.setMonth(d.getMonth()+(+m||0));if(d.getDate()<day)d.setDate(0);return d.toISOString().slice(0,10)}
function addDaysISO(iso,n){if(!iso)return'';const d=new Date(iso+'T12:00:00');if(isNaN(d))return'';d.setDate(d.getDate()+(+n||0));return d.toISOString().slice(0,10)}
function schedProx(s){let p=(s.proxima||'').slice(0,10);if(!p&&+s.freqMeses>0)p=addMonthsISO(s.data,+s.freqMeses);return p}
function schedState(p){if(!p)return'none';const d=daysTo(p);return d<0?'over':(d<=(+S.cfg.diasAviso||30)?'soon':'future')}
function schedItems(){return S.studies.map(s=>{const p=schedProx(s);const rv=!!s.revalObr;let st=schedState(p);if(rv&&st!=='over')st='over';return{s,p,days:daysTo(p),st,rv}}).filter(x=>x.p||x.rv)}
function updCnts(){const e=$('#cntE');if(e)e.textContent=S.studies.length;const c=$('#cntC');if(c){const n=schedItems().filter(x=>x.st==='over'||x.st==='soon').length;c.textContent=n;c.style.display=n?'':'none'}const fb=$('#cntF');if(fb){const n=S.fams.filter(fd=>S.studies.some(s=>s.familiaId===fd.id&&(s.revalObr||!s.proxima||schedState(s.proxima)==='over'))).length;fb.textContent=n;fb.style.display=n?'':'none'}}
function inMonth(y,m,dstr){if(!dstr)return false;const dt=new Date(dstr+'T12:00:00');return dt.getFullYear()===y&&dt.getMonth()===m}
function isoOf(y,m,d){const dt=new Date(y,m,d);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}
function monthEvents(y,m){const out=[];
  schedItems().forEach(x=>{const f=+x.s.freqMeses||0;let d=x.p,k=0;
    while(d&&k<240){if(inMonth(y,m,d))out.push({d,kind:'est',s:x.s,st:k===0?x.st:'future'});
      if(!f)break;const n=addMonthsISO(d,f);if(!n||n===d)break;d=n;k++}});
  return out}
function dueTxt(p,st){const d=daysTo(p)??0;return st==='over'?`vencido há ${Math.abs(d)} d`:(st==='soon'?`vence em ${d} d`:`em ${d} d`)}
function duePill(p,st){return `<span class="due d-${st}"><i class="fas ${st==='over'?'fa-triangle-exclamation':st==='soon'?'fa-clock':'fa-calendar-day'}"></i>${dueTxt(p,st)}</span>`}
function upcomingCards(){const ev=[
   ...schedItems().map(x=>({p:x.p||x.s.revalObr?.em,st:x.st,rv:x.rv,ic:TYPES[x.s.tipo].ic,t:`${x.s.codigo} · ${x.s.nome||x.s.caracteristica||TYPES[x.s.tipo].n}`,sid:x.s.id})),
   ].sort((a,b)=>(a.p||'').localeCompare(b.p||'')).slice(0,6);
 if(!ev.length)return'<div class="empty" style="padding:24px 10px"><i class="fas fa-calendar-check"></i>Sem vencimentos — agende os recálculos no Cronograma</div>';
 return ev.map(e=>`<div class="list-i" onclick="openStudy('${e.sid}')"><div class="ico ${e.st==='over'?'bg-bad c-bad':e.st==='soon'?'bg-warn c-warn':'bg-brand c-brand'}"><i class="fas ${e.ic}"></i></div><div class="tx"><b>${esc(e.t)}</b><small>${fdate(e.p)} · ${e.rv?`revalidação obrigatória — ${esc(e.s.revalObr.motivo)} em ${fdate(e.s.revalObr.em)}`:dueTxt(e.p,e.st)}</small></div></div>`).join('')}

function rCron(){const t=new Date();if(!V.cal)V.cal={y:t.getFullYear(),m:t.getMonth()};if(!V.ctab)V.ctab='prox';
  const items=schedItems().sort((a,b)=>a.p.localeCompare(b.p));
  const over=items.filter(x=>x.st==='over'),soon=items.filter(x=>x.st==='soon'),fut=items.filter(x=>x.st==='future');
  const insts=new Set();S.studies.forEach(s=>{if(s.familiaId)famCovList(s.familiaId).forEach(x=>insts.add('f'+x.id));else{if(s.instrumentoId)insts.add(s.instrumentoId);else{const c=String(s.instrumentoTxt||'').toUpperCase().trim();if(c)S.instruments.forEach(i=>{if(String(i.codigo||'').toUpperCase()===c)insts.add(i.id)})}}});
  const nFam=[...new Set(S.studies.filter(s=>s.familiaId).map(s=>s.familiaId))].length;
  const nInst=insts.size||S.instruments.length||S.inv.length;
  const av=+S.cfg.diasAviso||30;
  const stat=(lb,v,sub,ic,cls)=>`<div class="card kpi"><div class="lb"><i class="fas ${ic} bg-${cls} c-${cls}"></i>${lb}</div><div class="v">${v}</div><div class="s">${sub}</div></div>`;
  $('#main').innerHTML=`<div class="fade">
   <div class="top"><div><h1>Cronograma</h1><div class="sub">Agenda de recálculos MSA · aviso com ${av} dias de antecedência</div></div><div class="sp"></div>
   <button class="btn" onclick="mailDigest()" title="Envio manual — abre o seu cliente de e-mail com o resumo pronto (o automático dispara sozinho quando há vencidos, se ativado em Configurações)"><i class="fas fa-envelope"></i>Avisos por e-mail</button>
   <button class="btn" onclick="askNotify()" title="Notificações do navegador quando houver vencidos"><i class="fas fa-bell"></i>Notificações</button>
   <button class="btn" onclick="printSched()"><i class="fas fa-print"></i>Imprimir anual</button>
   <button class="btn pri" onclick="schedPicker()"><i class="fas fa-calendar-plus"></i>Agendar estudo</button></div>
  <div class="grid kpis" style="margin-bottom:16px">
   ${stat('Vencidos',over.length,'atrasados · inclui revalidação obrigatória','fa-triangle-exclamation','bad')}
   ${stat('Vencendo',soon.length,`próximos ${av} dias`,'fa-clock','warn')}
   ${stat('Em dia',fut.length,'agendados no futuro','fa-circle-check','ok')}
   ${stat('Instrumentos',nInst,nFam?`cobertura via ${nFam} família(s) · estudos MSA`:'monitorados por estudos MSA','fa-ruler-combined','brand')}
  </div>
  <div class="tabs"><div class="tab ${V.ctab==='prox'?'on':''}" onclick="V.ctab='prox';rCron()"><i class="fas fa-list-check"></i>Próximos</div><div class="tab ${V.ctab==='agenda'?'on':''}" onclick="V.ctab='agenda';rCron()"><i class="fas fa-calendar-days"></i>Agenda</div><div class="tab ${V.ctab==='tl'?'on':''}" onclick="V.ctab='tl';rCron()"><i class="fas fa-timeline"></i>Linha do Tempo</div><div class="tab ${V.ctab==='ex'?'on':''}" onclick="V.ctab='ex';rCron()"><i class="fas fa-diagram-project"></i>Execução</div><div class="tab ${V.ctab==='al'?'on':''}" onclick="V.ctab='al';rCron()"><i class="fas fa-bell"></i>Alertas</div></div>
  ${V.ctab==='agenda'?schedCal():V.ctab==='tl'?ganttTL(items):V.ctab==='ex'?ganttEX():V.ctab==='al'?ganttAL():schedList(items,over,soon,fut)}
 </div>`}

function schedList(items,over,soon,fut){
  const row=x=>{const s=x.s;return `<div class="list-i" onclick="openStudy('${s.id}')">
    <div class="ico ${x.st==='over'?'bg-bad c-bad':x.st==='soon'?'bg-warn c-warn':'bg-brand c-brand'}"><i class="fas ${TYPES[s.tipo].ic}"></i></div>
    <div class="tx"><b>${esc(s.codigo)} · ${esc(s.nome||s.caracteristica||TYPES[s.tipo].n)}</b><small>${TYPES[s.tipo].n} · ${esc(instrName(s))}${famCov(s.familiaId)?` · cobre ${famCov(s.familiaId)} instrumento(s)`:''} · ${freqLbl(s.freqMeses)} · ${x.p?`vence ${fdate(x.p)}`:'sem data programada'}${s.revalObr?` · <b class="c-bad">${esc(s.revalObr.motivo)} do instrumento em ${fdate(s.revalObr.em)}</b>`:''}${s.ciclo>1?` · ciclo ${s.ciclo}`:''}</small></div>
    ${x.rv?revalPill(s):duePill(x.p,x.st)}
    <span onclick="event.stopPropagation()" style="display:inline-flex;gap:4px;flex-shrink:0">
     <button class="btn ic sm" title="Registrar recálculo concluído" onclick="event.stopPropagation();openCycle('${s.id}')"><i class="fas fa-rotate"></i></button>
     ${instOf(s)?`<button class="btn ic sm" title="Evento do instrumento (reparo/substituição)" onclick="event.stopPropagation();regEv('${instOf(s).id}')"><i class="fas fa-screwdriver-wrench"></i></button>`:''}
     <button class="btn ic sm" title="Editar agendamento" onclick="event.stopPropagation();openSched('${s.id}')"><i class="fas fa-calendar-pen"></i></button>
     <button class="btn ic sm" title="Adiar 30 dias" onclick="event.stopPropagation();schedPost('${s.id}',30)"><i class="fas fa-forward"></i></button>
    </span></div>`};
  if(!items.length)return `<div class="card"><div class="empty"><i class="fas fa-calendar-plus"></i>Nenhum item agendado ainda.<br>Defina a periodicidade de recálculo dos estudos para montar o cronograma.<br><br><button class="btn pri" onclick="schedPicker()"><i class="fas fa-calendar-plus"></i>Agendar estudo</button></div></div>`;
  const sec=(title,cls,arr,ic)=>arr.length?`<div class="sg2 ${cls}"><div class="sgh"><i class="fas ${ic}"></i>${title}<span>${arr.length}</span></div>${arr.map(row).join('')}</div>`:'';
  return `<div class="card">
   ${sec('Vencidos','sg-bad',over,'fa-triangle-exclamation')}
   ${sec(`Vencendo em até ${+S.cfg.diasAviso||30} dias`,'sg-warn',soon,'fa-clock')}
   ${sec('Agendados','sg-ok',fut,'fa-calendar-check')}
  </div>`}

function schedCal(){const {y,m}=V.cal;
  const MN=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const first=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();
  const map={};const pin=(d,e)=>{(map[d]=map[d]||[]).push(e)};
  monthEvents(y,m).forEach(e=>{if(e.st==='over'){pin(today(),e);if(inMonth(y,m,e.d))pin(e.d,e)}else pin(e.d,e)});
  let cells='';
  for(let i=0;i<42;i++){
    const dn=i-first+1;let cls='dc',lbl,dstr;
    if(dn<1){cls+=' out';lbl=prev+dn+1;dstr=isoOf(y,m-1,lbl)}
    else if(dn>dim){cls+=' out';lbl=dn-dim;dstr=isoOf(y,m+1,lbl)}
    else{lbl=dn;dstr=isoOf(y,m,dn)}
    if(dstr===today())cls+=' today';
    const ev=(map[dstr]||[]).slice(0,3).map(e=>`<div class="ev k-${e.st}" onclick="openStudy('${e.s.id}')" title="${esc(e.s.codigo)} · ${freqLbl(e.s.freqMeses)}">${esc(e.s.codigo)}</div>`).join('');
    const more=(map[dstr]||[]).length>3?`<div class="ev more">+${map[dstr].length-3}</div>`:'';
    cells+=`<div class="${cls}"><span class="dn">${lbl}</span>${ev}${more}</div>`}
  return `<div class="card">
   <div class="calhead"><button class="btn ic" onclick="calNav(-1)"><i class="fas fa-chevron-left"></i></button>
    <h3 style="margin:0"><i class="fas fa-calendar-days c-brand"></i>${MN[m]} ${y}</h3>

/* ================= VALIDAÇÃO ANUAL DO SISTEMA DE MEDIÇÃO · v49 ================= */
const ANL_ORD={est:0,bias:1,lin:2,rr:3,atr:4};
const ANL_COL={CONFORME:'#12B76A','ATENÇÃO':'#F79009','NÃO CONFORME':'#F04438',VENCIDO:'#F04438',PENDENTE:'#8A8886'};
const ANL_IC={CONFORME:'fa-circle-check','ATENÇÃO':'fa-triangle-exclamation','NÃO CONFORME':'fa-circle-xmark',VENCIDO:'fa-hourglass-end',PENDENTE:'fa-circle-question'};
function anualVigencia(s){if(s.revalObr&&s.revalObr.em)return s.revalObr.em;const p=schedProx(s);return p||addMonthsISO(s.data,12)}
function anualCalc(s){let R=s.resultado;if(!R||!R.status||R.status==='Incompleto'){try{R=calc(s)}catch(e){R=null}}return R&&R.status&&R.status!=='Incompleto'?R:null}
function anualVerdict(s){const R=anualCalc(s),vig=anualVigencia(s),venc=!!s.revalObr||(!!vig&&vig<today());let k,why;
 if(!R){k='PENDENTE';why='Estudo sem dados suficientes para cálculo — preencha as medições'}
 else if(venc){k='VENCIDO';why='Vigência expirada em '+fdate(vig)+' — realize novo estudo/revalidação'}
 else if(R.status==='Aprovado'){k='CONFORME';why='Atende aos critérios do manual · válido até '+fdate(vig)}
 else if(R.status==='Condicional'){k='ATENÇÃO';why=(R.msg||'Aceitável com justificativa')+' — plano de ação recomendado'}
 else{k='NÃO CONFORME';why=R.msg||'Não atende aos critérios do manual — ação corretiva necessária'}
 return{k,vig,venc,st:R?R.status:'Incompleto',why}}
function anualRows(){return S.studies.map(s=>({s,r:anualVerdict(s)})).sort((a,b)=>(ANL_ORD[a.s.tipo]-ANL_ORD[b.s.tipo])||String(a.s.codigo).localeCompare(String(b.s.codigo)))}
function anualOverall(rows){const c={CONFORME:0,'ATENÇÃO':0,'NÃO CONFORME':0,VENCIDO:0,PENDENTE:0};rows.forEach(x=>c[x.r.k]++);
 if(!rows.length)return Object.assign(c,{k:'Incompleto',txt:'Nenhum estudo cadastrado no sistema'});
 if(c['NÃO CONFORME']+c.VENCIDO>0)return Object.assign(c,{k:'Reprovado',txt:(c['NÃO CONFORME']+c.VENCIDO)+' estudo(s) reprovado(s)/vencido(s) exigem ação'});
 if(c['ATENÇÃO']+c.PENDENTE>0)return Object.assign(c,{k:'Condicional',txt:c['ATENÇÃO']+' com ressalva(s) · '+c.PENDENTE+' pendente(s) de preenchimento'});
 return Object.assign(c,{k:'Aprovado',txt:'Todos os estudos atendem aos critérios do manual'})}
const anlChip=k=>`<span class="due" style="background:transparent;color:${ANL_COL[k]};font-size:12px"><i class="fas ${ANL_IC[k]}"></i> ${k}</span>`;
function rAnual(){const t=new Date();if(!V.anualY)V.anualY=t.getFullYear();
 const rows=anualRows(),O=anualOverall(rows);
 const ys=[];for(let y=t.getFullYear();y>=t.getFullYear()-6;y--)ys.push(y);
 const stat=(lb,v,sub,ic,cls)=>`<div class="card kpi"><div class="lb"><i class="fas ${ic} bg-${cls} c-${cls}"></i>${lb}</div><div class="v">${v}</div><div class="s">${sub}</div></div>`;
 const bc={Aprovado:['#E7F6EA','#1B7D25','SISTEMA ADEQUADO','fa-circle-check'],Condicional:['#FEF0E6','#B54708','ADEQUADO COM RESSALVAS','fa-triangle-exclamation'],Reprovado:['#FDECEB','#D13438','NÃO ADEQUADO','fa-circle-xmark'],Incompleto:['#E9EBF5','#8A8886','SEM ESTUDOS PARA VALIDAR','fa-circle-question']}[O.k];
 const row=x=>{const s=x.s,r=x.r;
  return `<div class="list-i" onclick="openStudy('${s.id}')"><div class="ico ${r.k==='CONFORME'?'bg-ok c-ok':(r.k==='ATENÇÃO'||r.k==='PENDENTE')?'bg-warn c-warn':'bg-bad c-bad'}"><i class="fas ${TYPES[s.tipo].ic}"></i></div><div class="tx"><b>${esc(s.codigo)} · ${esc(s.nome||s.caracteristica||TYPES[s.tipo].n)}</b><small>${TYPES[s.tipo].n} · ${esc(instrName(s))} · estudo em ${fdate(s.data)} · válido até ${fdate(r.vig)}</small><small style="display:block;color:${ANL_COL[r.k]}">${esc(r.why)}</small></div>${anlChip(r.k)}${badge(s)}</div>`};
 $('#main').innerHTML=`<div class="fade">
  <div class="top"><div><h1>Validação anual</h1><div class="sub">Auditoria do sistema de medição · critérios do manual (AIAG MSA 4ª ed.) · exercício ${V.anualY}</div></div><div class="sp"></div>
  <select class="f" style="width:auto" onchange="V.anualY=+this.value;rAnual()">${ys.map(y=>`<option value="${y}"${y===V.anualY?' selected':''}>Exercício ${y}</option>`).join('')}</select>
  <button class="btn pri" onclick="printAnual()"><i class="fas fa-certificate"></i>Relatório anual</button></div>
 <div class="grid kpis" style="margin-bottom:14px">
  ${stat('Estudos',rows.length,'cadastrados no sistema','fa-clipboard-list','brand')}
