  ${stat('Atenção / Pendentes',O['ATENÇÃO']+O.PENDENTE,'exigem acompanhamento','fa-triangle-exclamation','warn')}
  ${stat('Não conformes / Vencidos',O['NÃO CONFORME']+O.VENCIDO,'exigem ação imediata','fa-circle-xmark','bad')}
 </div>
 <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;font-weight:800;font-size:15px;border:1px solid ${bc[1]};background:${bc[0]};color:${bc[1]}"><span><i class="fas ${bc[3]}"></i> VALIDAÇÃO ANUAL: ${bc[2]}</span><span style="font-size:12px">${esc(O.txt)}</span></div>
 <div class="card" style="margin-top:14px"><h3><i class="fas fa-list-check c-brand"></i>Estudos do sistema<a class="hint" style="cursor:pointer;color:var(--brand)" onclick="printAnual()">gerar relatório →</a></h3>
  ${rows.length?rows.map(row).join(''):'<div class="empty" style="padding:24px 10px"><i class="fas fa-clipboard-check"></i>Nenhum estudo cadastrado — crie estudos para iniciar a validação anual</div>'}</div>
 <div class="card" style="margin-top:14px"><h3><i class="fas fa-book c-brand"></i>Critérios do manual aplicados (AIAG MSA 4ª edição)</h3>
  ${['est','bias','lin','rr','atr'].map(t=>`<p style="margin:7px 0;font-size:12.5px;color:var(--muted)"><b style="color:var(--text)">${TYPES[t].n}:</b> ${criteria(t)}</p>`).join('')}</div>
 </div>`}
function printAnual(){const y=V.anualY||new Date().getFullYear();
 modal(`<div class="mh"><h3>Relatório de validação anual — exercício ${y}</h3><button class="btn ic" onclick="closeModal()"><i class="fas fa-xmark"></i></button></div><div class="mb">
 <label class="l">Verificado por</label><input class="f" id="agV" value="${esc(S.cfg.verificadoPor||'')}">

 <div class="mf"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="agGo"><i class="fas fa-print"></i>Gerar relatório</button></div>`);
 $('#agGo').onclick=()=>{S.cfg.verificadoPor=$('#agV').value.trim();S.cfg.aprovadoPor=$('#agA').value.trim();persist();const sig={v:S.cfg.verificadoPor,a:S.cfg.aprovadoPor};closeModal();toast('Gerando relatório anual...','fa-certificate');setTimeout(()=>openWin('Validação anual '+y,reportAnual(y,sig)),30)}}
function reportAnual(y,sig){const rows=anualRows(),O=anualOverall(rows),C=S.cfg;
 const hd=`<div class="hd"><div><small>${esc(C.empresa)}</small><h1>Validação anual do sistema de medição</h1></div><div class="hdr"><b>Exercício ${y}</b><small>Emitido em ${new Date().toLocaleString('pt-BR')}</small></div></div>`;
 const info=`<table class="info"><tr><td>Empresa</td><td>${esc(C.empresa)||'—'}</td><td>Estudos avaliados</td><td>${rows.length}</td><td>Referência</td><td>AIAG MSA 4ª edição</td></tr>
 <tr><td>Responsável</td><td>${esc(userName())}</td><td>Emitido em</td><td>${fdate(today())}</td><td>Próxima validação anual</td><td>${fdate(addMonthsISO(today(),12))}</td></tr></table>`;
 const verd={Aprovado:'O SISTEMA DE MEDIÇÃO ESTÁ ADEQUADO',Condicional:'SISTEMA ADEQUADO COM RESSALVAS',Reprovado:'O SISTEMA DE MEDIÇÃO NÃO ESTÁ ADEQUADO',Incompleto:'SEM ESTUDOS SUFICIENTES PARA VALIDAÇÃO'}[O.k];
 const ban=`<div class="v ${O.k}"><span>VALIDAÇÃO ANUAL: ${verd}</span><span class="vm">${esc(O.txt)}</span></div>`;
 const kpis=`<table class="info"><tr><td>Conformes</td><td>${O.CONFORME}</td><td>Atenção / Pendentes</td><td>${O['ATENÇÃO']+O.PENDENTE}</td><td>Não conformes / Vencidos</td><td>${O['NÃO CONFORME']+O.VENCIDO}</td></tr></table>`;
 const tr=x=>{const s=x.s,r=x.r;return `<tr><td><b>${esc(s.codigo)}</b></td><td style="text-align:left">${esc(s.nome||s.caracteristica||'—')}</td><td style="text-align:left">${TYPES[s.tipo].n}</td><td style="text-align:left">${esc(instrName(s))}</td><td>${fdate(s.data)}</td><td>${fdate(r.vig)}</td><td style="color:${SCOL[r.st]||'#8A8886'};font-weight:700">${r.st}</td><td style="color:${ANL_COL[r.k]};font-weight:700">${r.k}</td></tr>`};
 const tbl=`<table class="dt"><thead><tr><th>Código</th><th>Estudo / peça</th><th>Tipo</th><th>Instrumento</th><th>Data do estudo</th><th>Válido até</th><th>Resultado</th><th>Veredito anual</th></tr></thead><tbody>${rows.map(tr).join('')||'<tr><td colspan="8">— nenhum estudo cadastrado —</td></tr>'}</tbody></table>`;
 const tipos=['est','bias','lin','rr','atr'].filter(t=>rows.some(x=>x.s.tipo===t));
 const crit=tipos.length?`<h3>Critérios de aceitação aplicados (AIAG MSA 4ª edição)</h3>${tipos.map(t=>`<div class="crit"><b>${TYPES[t].n}:</b> ${criteria(t)}</div>`).join('')}`:'';
 const leg=`<div class="legend">A validação anual confirma que os estudos do sistema de medição estão dentro da vigência (12 meses ou periodicidade agendada) e atendem aos critérios de aceitação do manual. Estudos vencidos, reprovados ou incompletos exigem novo estudo/revalidação antes da liberação. Este relatório resume os vereditos — os relatórios individuais de cada estudo permanecem como evidência.</div>`;
 const sg=`<div class="sig"><div>Responsável pela validação<br><small>${esc(userName())}</small></div><div>Verificado por<br><small>${esc(sig.v||'')}</small></div><div>Aprovado por<br><small>${esc(sig.a||'')}</small></div></div>`;
 return `<div class="pg land">${hd}${info}${ban}${kpis}${tbl}${crit}${leg}${sg}</div>`}

function userName(){return (S.cfg.usuario||'').trim()||'—'}
function logHist(s,acao,det){if(!s)return;const h=Array.isArray(s.historico)?s.historico:[];h.push({ts:new Date().toISOString(),por:userName(),acao,det:det||''});s.historico=h.slice(-300)}
function aprovNow(){const s=V.edit;if(!s)return;s.aprovadoPor=userName();s.aprovadoEm=today();logHist(s,'Aprovação','aprovado por '+(s.aprovadoPor==='—'?'(configure o usuário em Configurações)':s.aprovadoPor));markDirty();rEditor();toast('Aprovação registrada com a data de hoje','fa-user-check')}
function clearReval(id){const s=(V.edit&&V.edit.id===id)?V.edit:S.studies.find(x=>x.id===id);if(!s)return;s.revalObr=null;if(S.studies.some(x=>x.id===id)){logHist(s,'Marcação de revalidação removida','manualmente');saveStudy(JSON.parse(JSON.stringify(s)))}markDirty();rEditor();toast('Marcação de revalidação removida','fa-xmark')}

  const hist=(i.calHist||[]).slice(-5).reverse();
  modal(`<div class="mh"><h3><i class="fas fa-screwdriver-wrench c-brand"></i>Evento do instrumento — ${esc(i.codigo)}</h3><button class="btn ic" onclick="closeModal()"><i class="fas fa-xmark"></i></button></div>
  <div class="mb">
   <div><label class="l">Evento</label><select class="f" id="rcT"><option>Reparo</option><option>Substituição</option><option>Manutenção</option><option>Verificação intermediária</option></select></div>

   <div style="margin-top:12px"><label class="l">Observação (ordem de serviço, fornecedor, etc.)</label><input class="f" id="rcO" placeholder="ex.: OS nº 2026-114 · troca de fusos"></div>
   <label class="row" style="margin-top:14px;gap:10px;align-items:flex-start"><input type="checkbox" id="rcR" checked style="margin-top:3px"><span><b>Exigir revalidação dos estudos deste instrumento</b><small style="display:block;color:var(--muted);margin-top:2px">Marca como vencidos no Cronograma todos os estudos ligados a ${esc(i.codigo)} — AIAG: o sistema de medição deve ser reavaliado após intervenção no instrumento.</small></span></label>
   ${hist.length?`<div style="margin-top:14px"><div class="l">Últimos eventos</div>${hist.map(h=>`<small style="display:block;color:var(--muted);margin-top:3px">· ${fdate(h.d)} — ${esc(h.t)}${h.obs?` (${esc(h.obs)})`:''}</small>`).join('')}</div>`:''}
  </div>
  <div class="mf"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="rcOk"><i class="fas fa-check"></i>Registrar evento</button></div>`);
  $('#rcOk').onclick=()=>{const ev=$('#rcT').value,d=$('#rcD').value||today(),obs=$('#rcO').value.trim();
    i.ultCal=d;i.calHist=[...(i.calHist||[]),{d,t:ev,obs}].slice(-50);saveInstr(i);

      alvo.forEach(s=>{s.revalObr={motivo:ev,em:d,instrumento:i.codigo+' · '+(i.descricao||'')};logHist(s,'Revalidação obrigatória',ev+' do instrumento '+i.codigo+' em '+fdate(d));saveStudy(JSON.parse(JSON.stringify(s)));n++});}
    closeModal();refresh();
    toast(`Evento registrado · ${i.codigo}${n?` · revalidação marcada para ${n} estudo(s)`:''}`,'fa-screwdriver-wrench')}}

/* --- aviso por e-mail (manual via cliente de correio + automático via FormSubmit) --- */
function digestData(){const items=schedItems().sort((a,b)=>(a.p||'').localeCompare(b.p||''));
  const over=items.filter(x=>x.st==='over'),soon=items.filter(x=>x.st==='soon');
  if(!over.length&&!soon.length)return null;
  const L=[];
  L.push('Resumo de vencimentos MSA — '+(S.cfg.empresa||'')+' — gerado em '+fdate(today()));
  L.push('');
  if(over.length){L.push('VENCIDOS ('+over.length+'):');
    over.forEach(x=>L.push('  - '+x.s.codigo+' '+(x.s.nome||x.s.caracteristica||'')+' | '+instrName(x.s)+' | '+dueTxt(x.p,x.st)+(x.rv?' | REVALIDAÇÃO OBRIGATÓRIA: '+x.s.revalObr.motivo+' do instrumento em '+fdate(x.s.revalObr.em):'')));L.push('')}
  if(soon.length){L.push('VENCENDO em até '+(+S.cfg.diasAviso||30)+' dias ('+soon.length+'):');
    soon.forEach(x=>L.push('  - '+x.s.codigo+' '+(x.s.nome||x.s.caracteristica||'')+' | '+instrName(x.s)+' | vence '+fdate(x.p)));L.push('')}
  L.push('Registre o recálculo no Cronograma (botão de reciclagem) após concluir o estudo.');
  return{over,soon,L,sub:'MSA Pro — '+over.length+' vencido(s), '+soon.length+' vencendo — '+(S.cfg.empresa||'')}}
function mailDigest(){const dest=(S.cfg.emailAvisos||'').trim();
  if(!dest){toast('Configure o e-mail em Configurações → Rastreabilidade e avisos','fa-envelope');return}
  const d=digestData();if(!d){toast('Nada vencido ou vencendo — nada para enviar','fa-circle-check');return}
  location.href='mailto:'+encodeURIComponent(dest)+'?subject='+encodeURIComponent(d.sub)+'&body='+encodeURIComponent(d.L.join('\n'))}

/* --- envio automático (FormSubmit — gratuito, funciona direto de arquivo local; 1ª vez exige clicar em Activate no inbox) --- */
function mailDests(){return (S.cfg.emailAvisos||'').split(',').map(x=>x.trim()).filter(Boolean)}
function formSubmitSend(to,sub,msg){return fetch('https://formsubmit.co/ajax/'+encodeURIComponent(to),{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({name:'MSA Pro — '+(S.cfg.empresa||''),_subject:sub,_template:'box',_captcha:'false',message:msg})})}
async function sendAutoMail(force){
  if(!S.cfg.emailAuto)return null;
  const dest=mailDests();if(!dest.length)return null;
  const d=digestData();if(!d)return null;
  if(!d.over.length)return null;
  if(!force&&S.cfg.emailAutoLast===today())return null;
  const msg=d.L.join('\n');const out=[];
  for(const to of dest){try{const r=await formSubmitSend(to,d.sub,msg);const j=await r.json().catch(()=>({}));out.push({to,ok:!!r.ok&&String(j.success)==='true',m:j.message||''})}
    catch(e){out.push({to,ok:false,m:'sem conexão'})}}
  const okn=out.filter(x=>x.ok).length;
  const when=new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  S.cfg.emailAutoLog=when+' · '+okn+'/'+out.length+' enviado(s) · '+d.over.length+' vencido(s), '+d.soon.length+' vencendo → '+dest.join(', ');
  if(okn===out.length)S.cfg.emailAutoLast=today();
  persist();
  if(okn>0){toast('E-mail automático enviado — '+d.over.length+' vencido(s) · '+dest.join(', '),'fa-paper-plane');notifyOverdue(true)}
  else{toast('Envio automático falhou — confira internet/ativação em Configurações','fa-triangle-exclamation')}
  if(V.view==='config')rCfg();
  return out}
function toggleAutoMail(){
  if(S.cfg.emailAuto){S.cfg.emailAuto=false;persist();toast('Envio automático desativado','fa-bell-slash');rCfg();return}
  const dest=mailDests();
  if(!dest.length){toast('Preencha "Avisos por e-mail para" antes de ativar','fa-envelope');return}
  toast('Enviando pedido de ativação para '+dest.join(', ')+'…','fa-paper-plane');
  const d=digestData();
  const sub='MSA Pro — ativação do envio automático — '+(S.cfg.empresa||'');
  const msg=d?d.L.join('\n'):'Ativação do envio automático de avisos MSA — nenhum estudo vencido ou vencendo no momento.';
  Promise.all(dest.map(to=>formSubmitSend(to,sub,msg).then(r=>r.json().catch(()=>({}))).catch(()=>({}))))
   .then(()=>{S.cfg.emailAuto=true;
     const when=new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
     S.cfg.emailAutoLog=when+' · automático ativado — pedido enviado para '+dest.length+' endereço(s)';persist();
     modal(`<div class="mh"><h3><i class="fas fa-paper-plane c-brand"></i> Envio automático ativado</h3></div><div class="mb"><p>Para liberar o envio automático, cada destinatário confirma <b>uma única vez</b>:</p><p>1. Abra a caixa de entrada de <b>${esc(dest.join(', '))}</b>;<br>2. Localize o e-mail do <b>FormSubmit</b> que acabou de chegar;<br>3. Clique em <b>"Activate FormSubmit"</b>.</p><p class="legend">A partir daí, sempre que o sistema for aberto com estudo <b>vencido</b>, o resumo sai sozinho (1× por dia). Requer internet — sem internet, o botão "Avisos por e-mail" do Cronograma continua funcionando.</p></div><div class="mf"><button class="btn pri" onclick="closeModal()">Entendi</button></div>`)})
   .catch(()=>{toast('Falha de conexão com o serviço de e-mail','fa-triangle-exclamation')})}

/* --- notificações do navegador --- */
function askNotify(){if(!('Notification' in window)){toast('Este navegador não suporta notificações','fa-circle-info');return}
  if(Notification.permission==='granted')notifyOverdue(true);
  else Notification.requestPermission().then(p=>{if(p==='granted')notifyOverdue(true);else toast('Permissão de notificação negada','fa-bell-slash')}).catch(()=>{})}
function notifyOverdue(force){try{
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const items=schedItems();const over=items.filter(x=>x.st==='over').length,soon=items.filter(x=>x.st==='soon').length;
  if(!over&&!soon)return;
  const last=localStorage.getItem('msaNotify');if(!force&&last===today())return;
  localStorage.setItem('msaNotify',today());
  const first=items.filter(x=>x.st==='over').slice(0,3).map(x=>x.s.codigo).join(', ');
  new Notification('MSA Pro — '+over+' vencido(s) · '+soon+' vencendo',{body:(first||'—')+' — abra o Cronograma para detalhes'})}catch(e){}}

/* ================= v21 · IMPORTAÇÃO CSV / TSV (CMM e planilhas) ================= */
function csvSep(line){const c={'\t':0,';':0,',':0,'|':0};for(const k in c)c[k]=(line.split(k).length-1);
  const b=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];return b[1]>0?b[0]:'\t'}
function csvRows(txt){txt=String(txt||'').replace(/\r/g,'').trim();if(!txt)return{rows:[],sep:'\t'};
  const sep=csvSep(txt.split('\n')[0]);
  const rows=txt.split('\n').map(l=>l.split(sep).map(x=>x.trim().replace(/^"|"$/g,''))).filter(r=>r.some(x=>x!==''));
  return{rows,sep}}
function csvNum(x){const t=String(x??'').trim();if(!t)return NaN;let v=t;
  const iC=v.lastIndexOf(','),iP=v.lastIndexOf('.');
  if(iC>=0&&iP>=0){if(iC>iP)v=v.replace(/\./g,'').replace(',','.');else v=v.replace(/,/g,'')}
  else if(iC>=0)v=v.replace(',','.');
  const n=parseFloat(v);return isFinite(n)?n:NaN}
const isTxt=x=>!ok(csvNum(x));
function csvIsHeader(r){return r.some(c=>/oper|avali|insp|pe[çc]a|peca|part|item|tent|ciclo|repet|trial|valor|leitura|medi|ref|result|reading/i.test(c))&&r.some(c=>isTxt(c))}
function csvModel(){const t=V.edit?.tipo||'rr';
  if(t==='rr')return 'operador,peca,tentativa,valor\nA,1,1,0.29\nA,1,2,0.41\nA,1,3,0.64\nA,2,1,-0.56\nB,1,1,0.08\n...';
  if(t==='atr')return 'avaliador,peca,tentativa,resultado,referencia\nAvaliador 1,1,1,A,A\nAvaliador 1,1,2,A,A\n...';
  if(t==='lin')return 'referencia,valor\n2.00,1.95\n2.00,1.93\n4.00,3.80\n...';
  if(t==='est')return 'subgrupo,valor\n1,10.02\n1,10.06\n1,10.03\n2,9.98\n...';
  return 'valor\n0.49\n0.51\n0.50\n...'}

function csvPrep(){const s=V.edit;if(!s)return;const{rows}=csvRows($('#csvTxt').value);
  const out=$('#csvPrev');window._csvParsed=null;$('#csvGo').disabled=true;
  if(!rows.length){out.innerHTML='<p class="legend" style="color:var(--warn)"><i class="fas fa-triangle-exclamation"></i> Cole os dados ou abra um arquivo primeiro.</p>';return}
  let mode=$('#csvMode').value,body=rows.slice(),header=null;
  const hasH=csvIsHeader(body[0]);
  if(hasH){const h=body[0].map(x=>x.toLowerCase());const hasOp=h.some(x=>/oper|avali|insp|appr/.test(x)),hasPt=h.some(x=>/pe[çc]a|peca|part|item/.test(x)),hasVl=h.some(x=>/valor|leitura|medi|result|reading/.test(x));
    if(mode==='auto')mode=(hasOp&&hasPt&&hasVl)?'long':'wide';
    body=body.slice(1);if(mode==='long')header=h}
  else if(mode==='auto'){const w=body[0].length;mode=(w===4||w===2)?'long':'wide'}
  const p=csvMap(body,mode,header,s.tipo);
  if(p.err){out.innerHTML=`<p class="legend" style="color:var(--bad)"><i class="fas fa-triangle-exclamation"></i> ${esc(p.err)}</p>`;return}
  window._csvParsed=p;$('#csvGo').disabled=false;
  out.innerHTML=`<div class="verdict bg-ok c-ok" style="margin-top:10px"><i class="fas fa-circle-check"></i><div><b>${p.n} medições reconhecidas</b><small>${esc(p.dims)} · formato ${p.mode==='long'?'longo (linhas)':'largo (colunas por peça)'}</small></div></div>`}
function csvMap(rows,mode,header,tipo){const err=m=>({err:m,n:0,dims:'',mode});
  const colIdx=names=>{if(!header)return -1;for(const nm of names){const i=header.findIndex(h=>nm.test(h));if(i>=0)return i}return -1};
  const caps={rr:[3,10,3],atr:[5,100,5]}[tipo]||[5,100,20];
  if(mode==='long'){
    if(!header){const w=Math.min(...rows.map(r=>r.length));
      if(w<2)return err('Formato longo sem cabeçalho precisa de pelo menos 2 colunas; ideal: operador, peça, tentativa, valor.');
      header=w===2?['peca','valor']:w===3?['operador','peca','valor']:['operador','peca','tentativa','valor'].concat(Array.from({length:w-4},(_,i)=>'extra'+i))}
    const iO=colIdx([/oper|avali|insp|appr/]),iP=colIdx([/pe[çc]a|peca|part|item/]),iT=colIdx([/tent|ciclo|repet|trial|rep$/]),
      iV0=colIdx([/valor|leitura|medi[çc]|result|reading/]),iR=colIdx([/^ref|refer|^padr/]);
    const iV=iV0>=0?iV0:header.length-1;
    const data={op:{},part:{},val:[],ref:{}};const opSeq=[];const seq={};
    let n=0,maxP=0,maxT=0;
    for(const r of rows){const raw=r[iV];if(raw==null||String(raw).trim()==='')continue;
      const val=tipo==='atr'?cvA(raw):csvNum(raw);if(tipo!=='atr'&&!ok(val))continue;
      const opName=(iO>=0?r[iO]:'')||'Operador 1';const pRaw=iP>=0?r[iP]:'1';const tRaw=iT>=0?r[iT]:'';
      if(!(opName in data.op)){data.op[opName]=opSeq.length;opSeq.push(String(opName))}
      const oIdx=data.op[opName];
      let pIdx;const ps=String(pRaw).trim();
      if(/^\d+$/.test(ps))pIdx=+ps-1;
      else{if(!(pRaw in data.part))data.part[pRaw]=Object.keys(data.part).length;pIdx=data.part[pRaw]}
      let tIdx=null;if(/^\d+$/.test(String(tRaw).trim()))tIdx=+String(tRaw).trim()-1;
      else{const k=oIdx+'_'+pIdx;seq[k]=(seq[k]??-1)+1;tIdx=seq[k]}
      data.val.push({o:oIdx,p:pIdx,t:tIdx,v:val});
      if(iR>=0&&tipo==='atr'&&r[iR]!=null&&String(r[iR]).trim()!==''){const rv=cvA(r[iR]);if(rv)data.ref[pIdx]=rv}
      maxP=Math.max(maxP,pIdx+1);maxT=Math.max(maxT,tIdx+1);n++}
    if(!n)return err('Nenhuma linha com valor válido foi reconhecida. Confira o cabeçalho (valor/leitura/medição).');
    if(tipo==='rr'||tipo==='atr'){if(opSeq.length>caps[0])return err(`Máximo de ${caps[0]} avaliadores (encontrei ${opSeq.length}).`);
      if(maxP>caps[1])return err(`Máximo de ${caps[1]} peças (encontrei ${maxP}). Divida o arquivo ou o estudo.`);
      if(maxT>caps[2])return err(`Máximo de ${caps[2]} tentativas (encontrei ${maxT}).`)}
    return{mode:'long',n,data,opNames:opSeq,maxP,maxT,ref:data.ref,
      dims:(tipo==='rr'||tipo==='atr')?`${opSeq.length} avaliador(es) · ${maxP} peça(s) · ${maxT} tentativa(s)`:n+' leitura(s)',
      table:''}}
  const w=Math.min(...rows.map(r=>r.length));if(!w||!rows.length)return err('Sem colunas reconhecíveis.');
  if(tipo==='bias'){const vals=[];rows.forEach(r=>r.forEach(c=>{const v=csvNum(c);if(ok(v))vals.push(v)}));
    if(!vals.length)return err('Nenhum valor numérico reconhecido.');
    return{mode:'wide',n:vals.length,dims:`tendência · ${vals.length} leitura(s)`,vals,table:''}}
  if(tipo==='est'){const c0=String(rows[0][0]??'').trim();const start=(c0===''||/^\d+$/.test(c0))?1:0;
    const n=rows[0].length-start;if(n<2)return err('Cada subgrupo precisa de pelo menos 2 medidas nas colunas.');
    if(n>10)return err(`A grade de estabilidade aceita até 10 medidas por subgrupo (encontrei ${n}).`);
    if(rows.length>60)return err(`Máximo de 60 subgrupos (encontrei ${rows.length}).`);
    const m=rows.map(r=>Array.from({length:n},(_,j)=>{const v=csvNum(r[start+j]);return ok(v)?String(v):''}));
    return{mode:'wide',n:rows.length*n,n2:n,g:rows.length,dims:`estabilidade · ${rows.length} subgrupo(s) × ${n} medida(s)`,m,table:''}}
  if(tipo==='lin'){const m=w-1;
    if(m<1)return err('Formato largo de linearidade: 1ª coluna = referência, demais colunas = leituras.');
    if(m>20)return err(`Máximo de 20 leituras por peça (encontrei ${m}).`);
    if(rows.length>10)return err(`Máximo de 10 peças de referência (encontrei ${rows.length}).`);
    const refs=rows.map(r=>{const v=csvNum(r[0]);return ok(v)?String(v):''}),v=rows.map(r=>Array.from({length:m},(_,j)=>{const x=csvNum(r[1+j]);return ok(x)?String(x):''}));
    if(refs.some(x=>x===''))return err('Todas as referências (1ª coluna) precisam ser numéricas.');
    return{mode:'wide',n:rows.length*m,g:rows.length,m,dims:`linearidade · ${rows.length} referência(s) × ${m} leitura(s)`,refs,v,table:''}}
  // ---- rr / atr: colunas = peças; col 0 = avaliador; col 1 opcional = tentativa ----
  const firstColTxt=rows.every(r=>isTxt(r[0]));
  const secondIsTrial=rows.length>0&&rows.every(r=>/^\d+$/.test(String(r[1]??'').trim()))&&w>2;
  if(!firstColTxt)return err('A 1ª coluna deve identificar o avaliador (texto). Para uma linha por medição use o formato longo.');
  const iStart=secondIsTrial?2:1;const P=w-iStart;
  if(P<2)return err('Precisa de pelo menos 2 colunas de peças após avaliador'+(secondIsTrial?' e tentativa':'')+'.');
  if(P>caps[1])return err(`Máximo de ${caps[1]} peças (encontrei ${P}).`);
  const groups={};const gOrder=[];
  rows.forEach(r=>{const g=String(r[0]);if(!groups[g]){groups[g]=[];gOrder.push(g)}groups[g].push(r)});
  const O=gOrder.length;if(O>caps[0])return err(`Máximo de ${caps[0]} avaliadores (encontrei ${O}).`);
  const per=groups[gOrder[0]].length;
  if(!secondIsTrial&&gOrder.some(g=>groups[g].length!==per))return err('Avaliadores com nº de linhas diferente: inclua a coluna de tentativa (1,2,3...) ou use o formato longo.');
  const T=secondIsTrial?Math.max(...rows.map(r=>+String(r[1]).trim())):per;
  if(T>caps[2])return err(`Máximo de ${caps[2]} tentativas (encontrei ${T}).`);
  const grid=Array.from({length:O},()=>Array.from({length:T},()=>Array(P).fill('')));
  let n=0;
  rows.forEach(r=>{const oi=gOrder.indexOf(String(r[0]));
    const ti=secondIsTrial?+String(r[1]).trim()-1:groups[String(r[0])].indexOf(r);
    if(ti<0||ti>=T)return;
    for(let p=0;p<P;p++){const raw=r[iStart+p];if(raw==null||String(raw).trim()==='')continue;
      const val=tipo==='atr'?cvA(raw):csvNum(raw);if(tipo!=='atr'&&!ok(val))continue;
      grid[oi][ti][p]=tipo==='atr'?val:String(raw).trim().replace(',','.');n++}});
  if(!n)return err('Nenhum valor reconhecido nas colunas de peças.');
  return{mode:'wide',n,dims:`${O} avaliador(es) × ${P} peça(s) × ${T} tentativa(s)`,grid,opNames:gOrder,O,P,T,table:''}}
function csvApply(){const p=window._csvParsed;const s=V.edit;if(!p||p.err||!s)return;
  const d=s.dados;const how=$('#csvHow').value;
  const num=v=>String(v).replace(',','.');
  const setv=(arr,val)=>how==='rep'?val:(String(arr??'').trim()===''?val:arr);
  if(s.tipo==='rr'||s.tipo==='atr'){
    const cap={rr:[3,10,3],atr:[5,100,5]}[s.tipo];
    if(p.mode==='wide'){
      d.ops=how==='rep'?Math.max(2,p.O):Math.max(d.ops,Math.min(p.O,cap[0]));
      d.parts=how==='rep'?Math.max(2,p.P):Math.max(d.parts,Math.min(p.P,cap[1]));
      d.trials=how==='rep'?Math.max(2,p.T):Math.max(d.trials,Math.min(p.T,cap[2]));
      normalize(s);
      d.opNames=Array.from({length:d.ops},(_,i)=>(how==='rep'||/^(Operador|Avaliador) \d+$/.test(d.opNames[i]||''))?(p.opNames[i]||d.opNames[i]||('Avaliador '+(i+1))):(d.opNames[i]||p.opNames[i]||('Avaliador '+(i+1))));
      d.v=Array.from({length:d.ops},(_,oi)=>Array.from({length:d.trials},(_,ti)=>Array.from({length:d.parts},(_,pi)=>{
        const nv=p.grid[oi]?.[ti]?.[pi]??'';return nv===''?setv(d.v?.[oi]?.[ti]?.[pi],''):setv(d.v?.[oi]?.[ti]?.[pi],nv)})));
      if(s.tipo==='atr'&&p.ref&&Object.keys(p.ref).length)d.ref=Array.from({length:d.parts},(_,i)=>p.ref[i]??d.ref?.[i]??'')}
    else{const vals=p.data.val;const ops=p.opNames;
      d.ops=how==='rep'?Math.max(2,Math.min(ops.length,cap[0])):Math.max(d.ops,Math.min(ops.length,cap[0]));
      d.parts=how==='rep'?Math.max(2,Math.min(p.maxP,cap[1])):Math.max(d.parts,Math.min(p.maxP,cap[1]));
      d.trials=how==='rep'?Math.max(2,Math.min(p.maxT||1,cap[2])):Math.max(d.trials,Math.min(p.maxT||1,cap[2]));
      if(how==='rep'){d.v=Array.from({length:d.ops},()=>mtx(d.trials,d.parts));d.opNames=Array.from({length:d.ops},(_,i)=>ops[i]||('Avaliador '+(i+1)))}
      normalize(s);
      d.opNames=Array.from({length:d.ops},(_,i)=>(how==='rep'||/^(Operador|Avaliador) \d+$/.test(d.opNames[i]||''))?(ops[i]||d.opNames[i]||('Avaliador '+(i+1))):(d.opNames[i]||ops[i]||('Avaliador '+(i+1))));
      vals.forEach(x=>{if(x.o>=d.ops||x.p>=d.parts)return;const ti=Math.min(x.t??0,d.trials-1);
        d.v[x.o][ti][x.p]=setv(d.v[x.o][ti][x.p],String(x.v).replace(',','.'))});
      if(s.tipo==='atr'&&p.ref&&Object.keys(p.ref).length)d.ref=Array.from({length:d.parts},(_,i)=>p.ref[i]??d.ref?.[i]??'')}}
  else if(s.tipo==='bias'){const vals=p.mode==='wide'?p.vals:p.data.val.map(x=>x.v);

function ivSep(line){const c={'\t':0,';':0,',':0,'|':0};for(const ch of line)if(ch in c)c[ch]++;const e=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];return e&&e[1]>0?e[0]:';'}
function ivParse(){
  const raw=($('#ivT').value||'').replace(/\r/g,'');const lines=raw.split('\n').filter(l=>l.trim());
  if(!lines.length){toast('Cole o CSV ou carregue o arquivo','fa-triangle-exclamation');return}
  if(window._iv)return;
  const sep=ivSep(lines[0]);const sp=l=>l.split(sep).map(c=>c.replace(/^"(.*)"$/,'$1').trim());
  const hdr=sp(lines[0]).map(ivN);
  const fnd=list=>{for(const n of list){const i=hdr.findIndex(h=>h===n);if(i>=0)return i}for(const n of list){const i=hdr.findIndex(h=>h.startsWith(n));if(i>=0)return i}return -1};
  const iEq=fnd(['equipamento','equip']),iDes=fnd(['descricao','desc']),iTip=fnd(['tipo','categoria']),iRes=fnd(['responsavel','resp']);
  const iSt=fnd(['status','situacao']);const iDt=hdr.findIndex(h=>h.includes('data calib')||h.includes('data_calibr')||h==='data');
  const iLoc=hdr.findIndex(h=>['local','setor','area'].some(x=>h===x));const iId=hdr.findIndex(h=>h==='id');
  if(iEq<0&&iDes<0){toast('Cabeçalho não reconhecido — use o CSV do sistema de calibração (ID, Equipamento, Tipo, Descrição...)','fa-triangle-exclamation');return}
  const rows=lines.slice(1).map((l,i)=>{const c=sp(l);const eq=(iEq>=0?c[iEq]:'')||(iId>=0?c[iId]:'');const de=(iDes>=0?c[iDes]:'')||eq;
    return {id:uid(),eqid:eq||('EQ'+String(i+1).padStart(3,'0')),desc:de,tipo:(iTip>=0?c[iTip]:'')||guessTipo(de),resp:iRes>=0?c[iRes]:'',status:iSt>=0?c[iSt]:'',dataCal:iDt>=0?c[iDt]:'',local:iLoc>=0?c[iLoc]:'',famId:null}}).filter(r=>r.desc);
  if(!rows.length){toast('Nenhuma linha de instrumento encontrada','fa-triangle-exclamation');return}
  const groups={};rows.forEach(r=>{const t=r.tipo||'(sem tipo)';(groups[t]=groups[t]||[]).push(r)});

   return `<div class="row" style="gap:8px;padding:7px 10px;border-bottom:1px solid var(--border);align-items:center">

    <select class="f" style="width:auto;min-width:200px" id="ivf-${i}">${sug?`<option value="${sug.id}" selected>${esc(sug.cod)} · ${esc(sug.nome)}</option>`:''}<option value="_new" ${sug?'':'selected'}>${cat?`criar ${cat.cod} · ${esc(cat.nome)}`:'criar família automaticamente'}</option><option value="">— sem família —</option>${S.fams.filter(f=>!sug||f.id!==sug.id).map(f=>`<option value="${f.id}">${esc(f.cod)} · ${esc(f.nome)}</option>`).join('')}</select></div>`}).join('')}</div>`}
function ivApply(){const iv=window._iv;if(!iv){toast('Importe ou cole o CSV primeiro','fa-triangle-exclamation');return}

  let L=S.studies.filter(s=>(!f.tipo||s.tipo===f.tipo)&&(!f.status||(s.resultado?.status||'Incompleto')===f.status)&&(!f.area||s.area===f.area)&&(!p||daysTo(s.data)>=-p)&&(!f.mes||(s.data||'').startsWith(f.mes))
    &&(!f.fam||s.familiaId===f.fam)&&(!q||[s.codigo,s.instrumentoCod||'',s.nome,s.peca,s.caracteristica,s.responsavel,s.area,instrName(s),famOf(s)?famOf(s).nome:'',TYPES[s.tipo].n].join(' ').toLowerCase().includes(q)));
  const k=V.sort.k,d=V.sort.d;const val=s=>k==='instr'?instrName(s):k==='status'?STATUS.indexOf(s.resultado?.status||'Incompleto'):k==='kv'?(s.resultado?.kv??-1):k==='tipo'?TYPES[s.tipo].n:(s[k]||'');
  return L.sort((a,b)=>{const x=val(a),y=val(b);return(x>y?1:x<y?-1:0)*d})}

   `<span style="flex:1"></span>${sel('tipo',Object.entries(TYPES).map(([k,v])=>[k,v.n]),f.tipo,'Todos os tipos')}${sel('area',areas().map(a=>[a,a]),f.area,'Todas as áreas')}${sel('fam',S.fams.slice().sort((a,b)=>a.cod.localeCompare(b.cod)).map(f=>[f.id,f.cod+' · '+f.nome]),f.fam,'Todas as famílias')}${sel('periodo',[['30','30 dias'],['90','90 dias'],['365','12 meses']],f.periodo,'Todo período')}
   ${f.mes?`<span class="chip on" onclick="V.f.mes='';rList()">Mês ${f.mes} ✕</span>`:''}${(f.tipo||f.status||f.area||f.periodo||f.q||f.mes||f.fam)?`<button class="btn sm" onclick="V.f={q:'',tipo:'',status:'',instr:'',periodo:'',area:'',fam:''};$('#q').value='';rList()"><i class="fas fa-filter-circle-xmark"></i>Limpar</button>`:''}`;

function askDel(id){const s=S.studies.find(x=>x.id===id);confirmBox(`Excluir o estudo <b>${esc(s.codigo)}</b>? Esta ação não pode ser desfeita.`,()=>{delStudy(id);V.sel.delete(id);toast('Estudo excluído','fa-trash');if(V.view==='editor')go('estudos',{force:true});else refresh()})}

function dupStudy(id){const s=JSON.parse(JSON.stringify(S.studies.find(x=>x.id===id)));s.id=uid();s.codigo=nextCode(s.tipo);s.data=today();s.criadoEm=new Date().toISOString();s.nome=(s.nome||'')+' (cópia)';s.criadoPor=userName();s.atualizadoPor=userName();s.aprovadoPor='';s.aprovadoEm='';s.revalObr=null;s.historico=[];logHist(s,'Estudo duplicado','cópia de '+(S.studies.find(x=>x.id===id)?.codigo||id));saveStudy(s);toast('Estudo duplicado');openStudy(s.id)}

  const go2=()=>{V.edit=newStudy(t);if(fam){V.edit.familiaId=fam;const f0=S.fams.find(x=>x.id===fam);if(f0&&!V.edit.instrumentoTxt)V.edit.instrumentoTxt='Família '+f0.cod}V.isNew=true;V.dirty=false;go('editor',{force:true})};if(V.view==='editor'&&V.dirty)confirmBox('Descartar alterações não salvas?',go2);else go2()}

function rEditor(){const s=V.edit;if(!s)return go('estudos');const T=TYPES[s.tipo];
  /* v40: adoção automática — se o estudo só tem texto/código do instrumento mas ele existe no
     Inventário, vincula o id ao abrir o editor (TAG/resolução passam a puxar em tudo; a mudança
     fica registrada no histórico de diffs ao salvar). Estudos de família não são afetados. */
  if(!s.instrumentoId){const di=instrDisp(s);if(di&&di.id){s.instrumentoId=di.id;if(!s.instrumentoCod)s.instrumentoCod=di.codigo}}
  /* v43 híbrido planilha ESTUDO DE TENDÊNCIA: para estudos de tendência os campos Especificação/Tolerância(±)
     substituem LIE/LSE — preenche um par a partir do outro para manter o motor (tol = LSE−LIE) e a nuvem intactos */
  if(s.tipo==='bias'){const E=num(s.espec),Tp=num(s.tolPm),li=num(s.lie),ls=num(s.lse),nfx=x=>String(+x.toFixed(6)).replace('.',',');
    if(ok(E)&&ok(Tp)&&Tp>0&&!ok(li)&&!ok(ls)){s.lie=nfx(E-Tp);s.lse=nfx(E+Tp)}
    else if(ok(li)&&ok(ls)&&ls>li&&(!ok(E)||!ok(Tp))){s.espec=nfx((li+ls)/2);s.tolPm=nfx((ls-li)/2)}}
  $('#main').innerHTML=`<div class="fade"><div class="top"><button class="btn ic" onclick="go('estudos')"><i class="fas fa-arrow-left"></i></button><div><h1><i class="fas ${T.ic} c-brand"></i> ${T.n}</h1><div class="sub">${esc(s.codigo)} · ${V.isNew?'Novo estudo':'Editando'} <span id="dirty"></span></div></div><div class="sp"></div>

   <button class="btn" onclick="importCSV()"><i class="fas fa-file-import"></i>Importar CSV</button>

   <button class="btn" onclick="printJustStudy()" title="Relatório de perguntas e respostas preparadas para o auditor"><i class="fas fa-clipboard-question"></i>Justificativa</button>
   ${V.isNew?'':`<button class="btn" onclick="dupStudy('${s.id}')"><i class="fas fa-copy"></i>Duplicar</button><button class="btn dan" onclick="askDel('${s.id}')"><i class="fas fa-trash"></i></button>`}
   <button class="btn" onclick="saveEdit(true)"><i class="fas fa-print"></i>Salvar e imprimir</button>
   <button class="btn pri" onclick="saveEdit()"><i class="fas fa-floppy-disk"></i>Salvar <small style="opacity:.7">Ctrl+S</small></button></div>
   <div class="card" style="margin-bottom:16px"><h3><i class="fas fa-circle-info c-brand"></i>Identificação</h3><div class="form" id="info"></div></div>
   ${s.revalObr?`<div class="card reval-banner" style="margin-bottom:16px"><h3><i class="fas fa-rotate c-bad"></i>Revalidação obrigatória</h3><p class="legend">Instrumento <b>${esc(s.revalObr.instrumento||'')}</b> — ${esc(s.revalObr.motivo)} em <b>${fdate(s.revalObr.em)}</b>. Registre um recálculo (novo ciclo) para liberar a revalidação.</p><div class="row"><button class="btn sm" onclick="openCycle('${s.id}')"><i class="fas fa-rotate"></i>Registrar recálculo</button><button class="btn sm dan" onclick="clearReval('${s.id}')"><i class="fas fa-xmark"></i>Remover marcação</button></div></div>`:''}<div class="card" style="margin-bottom:16px"><h3><i class="fas fa-table c-brand"></i>Dados de medição</h3><div class="row" id="params" style="margin-bottom:12px"></div><div class="row" style="margin-bottom:10px"><button class="btn sm" onclick="pasteModal()" title="Cole um bloco do Excel, PDF ou Word"><i class="fas fa-paste"></i>Colar em bloco</button><small class="legend">Ou cole direto (Ctrl+V) numa célula: o bloco é encaixado na grade e a orientação é ajustada sozinha.</small></div><div class="tw" id="grid" style="padding:0"></div></div>
   ${(s.historico||[]).length?`<div class="card" style="margin-bottom:16px"><h3><i class="fas fa-clock-rotate-left c-brand"></i>Rastreabilidade (auditoria)</h3><table class="t" style="font-size:12.5px"><thead><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Detalhe</th></tr></thead><tbody>${[...(s.historico||[])].slice(-10).reverse().map(h=>`<tr><td>${new Date(h.ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(h.por||'—')}</td><td>${esc(h.acao)}</td><td>${esc(h.det||'')}</td></tr>`).join('')}</tbody></table><small class="legend">Últimos ${Math.min(10,(s.historico||[]).length)} de ${(s.historico||[]).length} eventos · criado por <b>${esc(s.criadoPor||'—')}</b> · aprovação: ${esc(s.aprovadoPor||'—')}${s.aprovadoEm?' em '+fdate(s.aprovadoEm):''} · o histórico viaja com o estudo na nuvem.</small></div>`:''}<div class="grid g3"><div class="card"><h3><i class="fas fa-chart-area c-brand"></i>Gráficos</h3><div id="chs"></div></div><div class="card"><h3><i class="fas fa-calculator c-brand"></i>Resultado</h3><div id="res"></div></div></div></div>`;
  const inp=(k,l,t='text',ex='')=>`<div><label class="l">${l}</label><input class="f" data-f="${k}" type="${t}" value="${esc(s[k])}" ${ex}></div>`;
  const dlCod=[...S.inv.map(x=>({c:String(x.eqid||'').trim(),d:x.desc||''})),...S.instruments.map(i=>({c:String(i.codigo||'').trim(),d:i.descricao||''}))].filter(x=>x.c);
  $('#info').innerHTML=inp('codigo','Código do estudo')+inp('data','Data do estudo','date')+

   `<div><label class="l">Código do instrumento</label><input class="f" data-f="instrumentoCod" list="dlCod" value="${esc(s.instrumentoCod||'')}" style="text-transform:uppercase" autocomplete="off"><datalist id="dlCod">${dlCod.map(x=>`<option value="${esc(x.c)}">${esc(x.d||'')}</option>`).join('')}</datalist></div>`+

function saveCfg(){const was=S.cfg.cloud;$$('[data-c]').forEach(e=>{const k=e.dataset.c;S.cfg[k]=e.type==='checkbox'?e.checked:e.type==='number'||k==='k'||k==='decimais'?+e.value:e.value;if(k==='decimais')S.cfg[k]=Math.max(0,Math.min(8,Math.round(+e.value||0)))});
  S.studies.forEach(s=>s.resultado=calc(s));persist();if(S.cfg.cloud&&!was)initCloud();if(!S.cfg.cloud&&was){db=null;setSync(false)}toast('Configurações salvas · estudos recalculados')}
function wipe(){confirmBox('Apagar <b>todos</b> os estudos e instrumentos? Recomendamos baixar um backup antes.',()=>{S.studies.forEach(s=>cloudDel('msapro_estudos',s.id));S.instruments.forEach(i=>cloudDel('msapro_instrumentos',i.id));S.fams.forEach(f=>cloudDel('msapro_familias',f.id));S.inv.forEach(x=>cloudDel('msapro_inventario',x.id));S.studies=[];S.instruments=[];S.fams=[];S.inv=[];persist();toast('Dados apagados','fa-trash');render()})}

function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function exportJSON(){download(`msa_backup_${today()}.json`,JSON.stringify({versao:1,exportadoEm:new Date().toISOString(),...S},null,1),'application/json');toast('Backup baixado','fa-download')}
 function exportCSV(ids){const L=ids?S.studies.filter(s=>ids.includes(s.id)):filtered();const cols=['Código','Tipo','Peça','Característica','Instrumento','Código do instrumento','Família','Área','Data','Responsável','LIE','LSE','Casas decimais','Status','Origem dos dados','Resultado','Mensagem'];
  const allM=[...new Set(L.flatMap(s=>Object.keys(s.resultado?.m||{})))];const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
   const rows=L.map(s=>{s.resultado=calc(s);const R=s.resultado;return[s.codigo,TYPES[s.tipo].n,s.nome,s.caracteristica,instrName(s),s.instrumentoCod||'',famLabel(s),s.area,fdate(s.data),s.responsavel,s.lie,s.lse,decimalPlaces(s),R.status,'Registrado/manual',R.chave,R.msg,...allM.map(k=>{const v=R.m?.[k];return ok(v)?String(+v.toFixed(decimalPlaces(s))).replace('.',','):''})].map(q).join(';')});
  download(`msa_estudos_${today()}.csv`,'\ufeff'+[cols.concat(allM).map(q).join(';'),...rows].join('\n'),'text/csv');toast(`${L.length} estudo(s) exportado(s)`,'fa-file-csv')}
function importJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.studies))throw 0;
  confirmBox(`Importar <b>${d.studies.length}</b> estudo(s), <b>${(d.instruments||[]).length}</b> instrumento(s), <b>${(d.fams||[]).length}</b> família(s) e <b>${(d.inv||[]).length}</b> item(ns) de inventário? Itens com o mesmo identificador serão atualizados.`,()=>{(d.instruments||[]).forEach(saveInstr);(d.fams||[]).forEach(saveFam);(d.inv||[]).forEach(saveInvItem);d.studies.forEach(s=>saveStudy(s));if(d.cfg)Object.assign(S.cfg,d.cfg,{cloud:S.cfg.cloud});persist();toast('Backup importado');render()})}catch(x){toast('Arquivo inválido','fa-triangle-exclamation')}};r.readAsText(f);e.target.value=''}

function chartImg(cfg,w=520,h=360,fs=14){const cv=$('#printCanvas');cv.width=w;cv.height=h;const c=JSON.parse(JSON.stringify(cfg.c,(k,v)=>typeof v==='function'?undefined:v));c.plugins=cfg.c.plugins;c.options=Object.assign({},c.options,{animation:false,responsive:false,maintainAspectRatio:false,devicePixelRatio:2,font:{size:fs,family:"'Inter',Arial,sans-serif"}});
  if(cfg.c.options?.plugins?.legend?.labels?.filter){c.options.plugins.legend.labels.filter=cfg.c.options.plugins.legend.labels.filter}

  if(s.tipo==='rr'){const dp=decimalPlaces(s),f=x=>ok(x)?fxd(x,dp):'',c=v=>{const n=num(v);return v===''||v==null?'':ok(n)?fxd(n,dp):esc(v)},P=d.parts,T=d.trials,uc=s.resultado?.ser?.uclR;

  const cbG=(t,cfg)=>{cfg.options=cfg.options||{};cfg.options.layout=cfg.options.layout||{};cfg.options.layout.padding=Object.assign({},cfg.options.layout.padding,{top:40,left:6,right:10});cfg.plugins=[...(cfg.plugins||[]),{id:'ban',afterDraw(ch){const x=ch.ctx;x.save();x.fillStyle='#165A9C';x.fillRect(0,0,ch.width,30);x.fillStyle='#fff';x.font="bold 14px 'Segoe UI',Arial";x.textAlign='center';x.textBaseline='middle';x.fillText(t,ch.width/2,15);x.restore()}}];return`<div class="cb"><img src="${chartImg({c:cfg},760,560,14)}" alt="${esc(t)}"></div>`};

/* ---- Tendência (Bias) híbrido v44 — relatório paisagem em 2 páginas, mesmo padrão/cores dos outros estudos (sem espaço em branco) + formato da planilha ESTUDO DE TENDÊNCIA ---- */

  const st2=(k,v)=>`<tr><td class="sy">${k}</td><td class="vl">${v}</td></tr>`;
  const stats=`<table class="cal"><thead><tr><th colspan="2">Estatística — tendência</th></tr></thead><tbody>${st2('Média',fs(X.m))}${st2('Tendência',fs(X.b))}${st2('Amplitude',f(X.amp))}${st2('Desvio padrão',fs(X.s1))}${st2(`T bi-caudal (α = ${pct(X.al*100,0)})`,ft(X.tc))}${st2('Erro padrão σ<sub>b</sub>',fs(X.se))}${st2('t calculado',ft(X.t))}${st2('ν = n − 1',X.n-1)}</tbody></table>`;
  const icBox=`<table class="cal"><thead><tr><th colspan="2">tendência ± [σ<sub>b</sub> · t(ν, 1−α/2)]</th></tr></thead><tbody><tr><td class="vl" style="text-align:center">${fs(X.lo)}</td><td class="vl" style="text-align:center">${fs(X.hi)}</td></tr></tbody></table>

  const ana=`<div class="ana"><div class="at">ANÁLISE DE TENDÊNCIA</div><p>Foram realizadas ${X.n} medições repetidas do padrão de referência ${f(X.ref)} ${un} com o instrumento ${esc(insLabel(s))}, conforme AIAG MSA 4ª edição e formato da planilha ESTUDO DE TENDÊNCIA.</p><p>Tendência: <b>${fs(X.b)} ${un}</b> · t calculado = ${ft(X.t)} · t crítico bi-caudal = ${ft(X.tc)} · IC: ${fs(X.lo)} a ${fs(X.hi)}${ok(X.pb)?` · %Tendência = ${pct(X.pb,2)} da tolerância`:''}.</p><p><span class="verd ${R.status}">${verd}</span></p></div>`;

  <tr><td class="rb">Resultado do estudo <small>· ${esc(R.msg||'')}</small></td><td class="rv ${R.status==='Aprovado'?'ok':R.status==='Condicional'?'cond':'nok'}">${R.status.toUpperCase()}</td></tr></tbody></table>`;

  else{const mn=Math.min(...X.v,X.ref),mx=Math.max(...X.v,X.ref),bins=Math.max(5,Math.min(12,Math.ceil(Math.sqrt(X.v.length))+2)),w2=(mx-mn)/bins||1;cnt=Array(bins).fill(0);X.v.forEach(x=>cnt[Math.min(bins-1,Math.floor((x-mn)/w2))]++);labs=cnt.map((_,i2)=>fxd(mn+w2*(i2+.5),dp+2))}

  const cbG=(t,cfg)=>{cfg.options=cfg.options||{};cfg.options.layout=cfg.options.layout||{};cfg.options.layout.padding=Object.assign({},cfg.options.layout.padding,{top:40,left:6,right:10});cfg.plugins=[...(cfg.plugins||[]),{id:'ban',afterDraw(ch){const x=ch.ctx;x.save();x.fillStyle='#165A9C';x.fillRect(0,0,ch.width,30);x.fillStyle='#fff';x.font="bold 14px 'Segoe UI',Arial";x.textAlign='center';x.textBaseline='middle';x.fillText(t,ch.width/2,15);x.restore()}}];return`<div class="cb"><img src="${chartImg({c:cfg},760,560,14)}" alt="${esc(t)}"></div>`};

  <table class="info"><tr><td>Peça</td><td>${esc(s.nome)}</td><td>Característica</td><td>${esc(s.caracteristica)}</td><td>Data</td><td>${fdate(s.data)}</td></tr><tr><td>Instrumento</td><td>${esc(instrName(s))}${s.instrumentoCod&&famOf(s)?` <small>(unid. ${esc(s.instrumentoCod)})</small>`:''}${famNote(s)}</td><td>Nº série / Resolução</td><td>${esc(i?.serie||'')} ${i?.resolucao?'· Res. '+esc(i.resolucao)+' '+esc(i.unidade||s.unidade||'mm'):''}</td><td>Área</td><td>${esc(s.area)}</td></tr><tr><td>Tolerância</td><td>${esc(s.lie)} — ${esc(s.lse)} ${esc(s.unidade)}</td><td>Responsável</td><td>${esc(s.responsavel)}</td><td>Fabricante</td><td>${esc(i?.fabricante||'—')}</td></tr><tr><td>Aprovado por</td><td>${esc(s.aprovadoPor||'—')}${s.aprovadoEm?' em '+fdate(s.aprovadoEm):''}</td><td>Criado por</td><td>${esc(s.criadoPor||'—')} ${s.criadoEm?'em '+fdate(s.criadoEm.slice(0,10)):''}</td><td>Alterado por</td><td>${esc(s.atualizadoPor||'—')}</td></tr></table>
  ${(s.historico||[]).length?`<table class="info"><tr><td colspan="6"><b>Rastreabilidade</b> — ${(s.historico||[]).length} evento(s) registrado(s). Últimos: ${(s.historico||[]).slice(-4).map(h=>fdate(String(h.ts).slice(0,10))+' '+esc(h.acao)+' ('+esc(h.por)+')').join(' · ')}</td></tr></table>`:''}
  ${s.simulado?SIMBAN:''}<div class="v ${R.status}">RESULTADO: ${R.status.toUpperCase()} — ${esc(R.msg||'')}</div><div class="legend">Precisão exibida neste estudo: ${decimalPlaces(s)} ${decimalPlaces(s)===1?'casa decimal':'casas decimais'}.</div><div class="mt">${Object.entries(R.m||{}).map(([k,v])=>`<div><span>${k}</span><b>${fmtM(k,v,s)}</b></div>`).join('')}</div>
  ${imgs?`<div class="charts">${imgs}</div>`:''}<h3>Dados de medição</h3>${dataTable(s).replace(/<table class="dt"><tr>(.*?)<\/tr>/g,'<table class="dt"><thead><tr>$1</tr></thead>')}<div class="crit">${criteria(s.tipo)}</div>${s.obs?`<h3>Observações / ações</h3><div class="obs">${esc(s.obs).replace(/\n/g,'<br>')}</div>`:''}
  ${sigBlock(s,sig)}<div class="ft">MSA Pro · Metodologia AIAG MSA 4ª edição</div></div>`}
function openWin(title,body){const w=window.open('','_blank');if(!w){toast('Permita pop-ups para imprimir','fa-triangle-exclamation');return}
  w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(title)}</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><style>${RPT_CSS}</style></head><body><div class="np"><button onclick="print()">🖨 Imprimir / Salvar PDF</button></div>${body}<script>function fitPages(){try{var L=710,pgs=document.querySelectorAll("div.pg.land");for(var i=0;i<pgs.length;i++){var pg=pgs[i];if(/\bfill2\b|\bfill3\b/.test(pg.className))continue;var lv=0;pg.classList.add("meas");var h=pg.scrollHeight;pg.classList.remove("meas");while(h>L&&lv<4){lv++;pg.classList.add("pf"+lv);pg.classList.add("meas");h=pg.scrollHeight;pg.classList.remove("meas")}}}catch(e){}}<\/script><script>window.onload=()=>{(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(()=>{fitPages();print()},400))}<\/script></body></html>`);w.document.close()}
function printStudies(ids){const L=ids.map(id=>S.studies.find(s=>s.id===id)).filter(Boolean);if(!L.length){toast('Nenhum estudo para imprimir','fa-triangle-exclamation');return}
  modal(`<div class="mh"><h3>Assinaturas do relatório</h3><button class="btn ic" onclick="closeModal()"><i class="fas fa-xmark"></i></button></div><div class="mb">
  <label class="l">Verificado por</label><input class="f" id="sigV" value="${esc(S.cfg.verificadoPor||'')}" placeholder="Nome de quem verificou" onkeydown="if(event.key==='Enter')document.getElementById('sigGo').click()">
  <label class="l" style="margin-top:10px">Aprovado por</label><input class="f" id="sigA" value="${esc(S.cfg.aprovadoPor||'')}" placeholder="Nome de quem aprovou" onkeydown="if(event.key==='Enter')document.getElementById('sigGo').click()">
  <small class="legend" style="display:block;margin-top:10px">Os nomes entram no bloco de assinaturas de todos os estudos impressos e ficam salvos para as próximas impressões. Deixe em branco para imprimir somente as linhas.</small></div>
  <div class="mf"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="sigGo"><i class="fas fa-print"></i>Imprimir ${L.length>1?L.length+' estudos':'estudo'}</button></div>`);
  $('#sigGo').onclick=()=>{S.cfg.verificadoPor=document.getElementById('sigV').value.trim();S.cfg.aprovadoPor=document.getElementById('sigA').value.trim();persist();const sig={v:S.cfg.verificadoPor,a:S.cfg.aprovadoPor};closeModal();toast('Gerando relatório...','fa-print');setTimeout(()=>openWin(L.length===1?L[0].codigo:`Relatórios MSA (${L.length})`,L.map(s=>reportPage(JSON.parse(JSON.stringify(s)),sig)).join('')),30)};
  setTimeout(()=>{const el=document.getElementById('sigV');if(el)el.focus()},60)}
function printSummary(){const L=dashSet().sort((a,b)=>(b.data||'').localeCompare(a.data||''));const c=st=>L.filter(s=>(s.resultado?.status||'Incompleto')===st).length;
  const st=STATUS.map(c);const img=chartImg({c:{type:'bar',data:{labels:STATUS,datasets:[{data:st,backgroundColor:STATUS.map(x=>SCOL[x])}]},options:{plugins:{legend:{display:false}}}}});
  const tk=Object.keys(TYPES);const img2=chartImg({c:{type:'bar',data:{labels:tk.map(t=>TYPES[t].n),datasets:STATUS.map(x=>({label:x,data:tk.map(t=>L.filter(s=>s.tipo===t&&(s.resultado?.status||'Incompleto')===x).length),backgroundColor:SCOL[x]}))},options:{scales:{x:{stacked:true},y:{stacked:true}}}}});
  openWin('Relatório gerencial MSA',`<div class="pg"><div class="hd"><div><small>${esc(S.cfg.empresa)}</small><h1>Relatório gerencial MSA</h1></div><small>${{30:'Últimos 30 dias',90:'Últimos 90 dias',365:'Últimos 12 meses',0:'Todo o período'}[V.dash.periodo]}${V.dash.area?' · '+esc(V.dash.area):''} · ${new Date().toLocaleString('pt-BR')}</small></div>
  <div class="mt"><div><span>Total</span><b>${L.length}</b></div><div><span>Aprovados</span><b style="color:#107C10">${st[0]}</b></div><div><span>Condicionais</span><b style="color:#B54708">${st[1]}</b></div><div><span>Reprovados</span><b style="color:#D13438">${st[2]}</b></div><div><span>Incompletos</span><b>${st[3]}</b></div></div>
   <div class="charts"><img src="${img}"><img src="${img2}"></div><h3>Estudos</h3><table><thead><tr><th>Código</th><th>Tipo</th><th>Peça / Característica</th><th>Instrumento</th><th>Data</th><th>Responsável</th><th>Resultado</th><th>Status</th></tr></thead>${L.map(s=>`<tr><td><b>${esc(s.codigo)}</b></td><td>${TYPES[s.tipo].n}</td><td>${esc(s.nome)} ${esc(s.caracteristica)}</td><td>${esc(instrName(s))}</td><td>${fdate(s.data)}</td><td>${esc(s.responsavel)}</td><td>${esc(s.resultado?.chave)}</td><td class="${s.resultado?.status}">${s.resultado?.status}</td></tr>`).join('')}</table><div class="ft">MSA Pro</div></div>`)}

/* ---------------- modais ---------------- */
function modal(h){$('#modal').innerHTML=h;$('#ov').classList.add('show')}
function closeModal(){$('#ov').classList.remove('show')}
$('#ov').onclick=e=>{if(e.target.id==='ov')closeModal()};
function confirmBox(msg,yes){modal(`<div class="mh"><h3>Confirmar</h3></div><div class="mb">${msg}</div><div class="mf"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="cYes">Confirmar</button></div>`);$('#cYes').onclick=()=>{closeModal();yes()}}

load();S.studies.forEach(s=>{if(!s.resultado||s.tipo==='atr')s.resultado=calc(s)});migrateAll(false);repairSim();render();initCloud();setTimeout(notifyOverdue,2500);setTimeout(()=>{sendAutoMail(false)},4500);setInterval(()=>{sendAutoMail(false)},36e5);

<script>
(function(){var mode='auto';try{mode=localStorage.getItem('msa-theme')||'auto'}catch(e){}
function day(){var h=new Date().getHours();return h>=6&&h<18}
function apply(re){var t=mode==='auto'?(day()?'light':'dark'):mode,r=document.documentElement,ch=r.getAttribute('data-theme')!==t;r.setAttribute('data-theme',t);
 var l=document.getElementById('thmL');if(l)l.innerHTML=(t==='light'?'☀ Modo dia':'☾ Modo noite')+'<small>'+(mode==='auto'?'automático · dia 06h–18h':'escolha manual')+'</small>';
 document.querySelectorAll('.thm .sg button').forEach(function(b){b.classList.toggle('on',b.dataset.m===mode)});
 if(re&&ch&&typeof render==='function'){try{render()}catch(e){}}}
document.querySelectorAll('.thm .sg button').forEach(function(b){b.onclick=function(){mode=b.dataset.m;try{localStorage.setItem('msa-theme',mode)}catch(e){}apply(true)}});
setInterval(function(){if(mode==='auto')apply(true)},30000);apply(false)})();
</script>
